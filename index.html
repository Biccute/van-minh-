*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);line-height:1.5}button,input,textarea,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}.app{min-height:100vh}.topbar{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 clamp(16px,4vw,52px);position:sticky;top:0;z-index:20}.brand{display:flex;align-items:center;gap:11px;font-size:18px;font-weight:800;letter-spacing:-.5px}.logo{width:38px;height:38px;border-radius:13px;background:var(--green);color:white;display:grid;place-items:center;font-family:Georgia,serif;font-size:24px}.top-actions{display:flex;align-items:center;gap:12px}.pill{background:#f0f3ee;border-radius:99px;padding:7px 12px;font-size:12px;font-weight:700;color:#53645a}.app-grid{display:grid;grid-template-columns:258px minmax(0,1fr);max-width:1500px;margin:auto;min-height:calc(100vh - 72px)}.sidebar{padding:27px 17px;border-right:1px solid var(--line);background:#fbfcf9}.who{padding:14px;border-radius:14px;background:#eef3ed;margin-bottom:22px}.who small{color:var(--muted);display:block;font-size:11px;text-transform:uppercase;font-weight:800;letter-spacing:.08em}.who strong{display:block;margin-top:4px}.nav-label{font-size:10px;font-weight:800;color:#8a968e;letter-spacing:.12em;padding:0 13px;margin:24px 0 7px}.nav-btn{width:100%;border:0;background:transparent;color:#59675f;text-align:left;padding:11px 13px;border-radius:11px;display:flex;align-items:center;gap:10px;font-weight:650;margin:3px 0}.nav-btn .ico{font-size:17px;width:23px;text-align:center}.nav-btn.active,.nav-btn:hover{background:var(--green);color:#fff}.sidebar-note{font-size:12px;color:#758078;padding:16px 12px;margin-top:25px;border-top:1px solid var(--line)}main{padding:clamp(20px,4vw,48px);max-width:1180px;width:100%;margin:0 auto}.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#758579;font-weight:800}.page-title{font-size:clamp(27px,3vw,39px);line-height:1.13;margin:7px 0 12px;letter-spacing:-1.2px}.lead{color:var(--muted);max-width:720px;margin:0}.hero{border-radius:25px;background:var(--green);color:#fff;padding:clamp(24px,4vw,42px);display:grid;grid-template-columns:1.4fr .8fr;gap:20px;position:relative;overflow:hidden;box-shadow:var(--shadow)}.hero h1{font-family:Georgia,serif;font-weight:500;font-size:clamp(29px,4vw,43px);line-height:1.1;letter-spacing:-.8px;margin:10px 0 13px}.hero p{color:#dce8df;max-width:500px;margin:0 0 22px}.hero-mark{font-family:Georgia,serif;font-size:150px;line-height:1;display:grid;place-items:center;color:#ffffff14;transform:rotate(-8deg)}.btn{border:1px solid transparent;border-radius:11px;background:var(--green);color:white;padding:10px 15px;font-weight:750;transition:.15s;display:inline-flex;align-items:center;justify-content:center;gap:8px}.btn:hover{filter:brightness(1.08);transform:translateY(-1px)}.btn.light{background:#fff;color:var(--green)}.btn.ghost{border-color:var(--line);background:#fff;color:var(--ink)}.btn.small{padding:7px 11px;font-size:12px}.btn.warning{background:#fff1df;color:#77501c}.btn.full{width:100%}.section-head{display:flex;justify-content:space-between;align-items:end;gap:16px;margin:30px 0 14px}.section-head h2{font-size:20px;letter-spacing:-.4px;margin:0}.section-head p{font-size:13px;color:var(--muted);margin:3px 0 0}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin-top:20px}.stat,.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}.stat .s-label{font-size:12px;color:var(--muted);font-weight:650}.stat .s-num{font-size:27px;font-weight:800;letter-spacing:-1px;margin:5px 0}.stat .s-note{font-size:11px;color:#7d897f}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.lesson-card{display:flex;flex-direction:column;gap:10px}.lesson-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.lesson-icon{width:44px;height:44px;display:grid;place-items:center;background:var(--green2);border-radius:14px;font-size:21px;flex-shrink:0}.tag{display:inline-flex;align-items:center;border-radius:99px;padding:5px 9px;font-size:10px;font-weight:800;letter-spacing:.03em;background:#edf2ed;color:#52665a}.tag.done{background:#dcefe3;color:#286243}.tag.warm{background:#fff0db;color:#875921}.lesson-card h3{margin:0;font-size:17px;letter-spacing:-.3px}.locked-card{opacity:.78;background:#f8f9f6}.locked-card .lesson-icon{background:#ecefea;color:#778078}.lesson-card p{margin:0;color:var(--muted);font-size:13px}.progress-line{height:7px;border-radius:99px;background:#edf0eb;overflow:hidden}.progress-line span{height:100%;display:block;background:#6b9a7a;border-radius:99px;transition:width .3s}.lesson-meta{font-size:11px;color:#748077;display:flex;justify-content:space-between}.lesson-card .btn{margin-top:3px}.callout{padding:15px 17px;background:var(--cream);border-radius:14px;color:#6e512b;font-size:13px;margin:18px 0}.two-col{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(270px,.75fr);gap:16px}.module-list{display:grid;gap:10px}.module-row{display:flex;gap:13px;align-items:center;padding:15px;border:1px solid var(--line);background:#fff;border-radius:14px}.module-n{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:#eef3ed;font-weight:800;color:#4c6955;flex-shrink:0}.module-row h4{margin:0 0 3px;font-size:14px}.module-row p{margin:0;color:var(--muted);font-size:12px}.module-row .push{margin-left:auto}.detail-head{display:flex;gap:14px;align-items:flex-start;margin-bottom:22px}.back{border:1px solid var(--line);background:#fff;border-radius:11px;padding:9px 12px}.lesson-body{max-width:850px;margin:0 auto}.step-count{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin:17px 0 7px}.stepbar{height:5px;background:#e6ebe5;border-radius:99px;overflow:hidden}.stepbar span{display:block;height:100%;background:var(--orange)}.lesson-panel{background:#fff;border:1px solid var(--line);border-radius:21px;padding:clamp(20px,3vw,34px);box-shadow:var(--shadow);margin-top:16px}.lesson-panel h2{margin:4px 0 14px;font-size:25px;letter-spacing:-.7px;line-height:1.2}.lesson-panel p{color:#526057}.theory{background:#f5f7f2;border-radius:14px;padding:18px;margin:17px 0}.theory h3{font-size:14px;margin:0 0 7px}.theory ul{padding-left:20px;margin:8px 0}.theory li{margin:5px 0}.example{border-left:3px solid var(--orange);padding:12px 15px;background:#fff9f0;border-radius:0 10px 10px 0;margin:14px 0;font-size:14px}.choice-list{display:grid;gap:9px;margin:15px 0}.choice{display:flex;gap:11px;align-items:flex-start;text-align:left;background:#fff;border:1px solid #dfe6df;color:var(--ink);padding:13px 14px;border-radius:12px}.choice:hover{border-color:#71967d}.choice.selected{border-color:var(--green);background:#eff5ef;box-shadow:inset 0 0 0 1px var(--green)}.choice.correct{border-color:#52966b;background:#edf8ef}.choice.incorrect{border-color:#d88d86;background:#fff0ef}.choice .letter{width:25px;height:25px;border-radius:8px;background:#f0f3ef;display:grid;place-items:center;font-size:12px;font-weight:800;flex-shrink:0}.field{display:grid;gap:6px;margin:12px 0}.field label{font-size:12px;font-weight:800;color:#526057}.field input,.field textarea,.field select{width:100%;padding:12px 13px;border:1px solid #dce4dd;border-radius:11px;outline:none;background:white;color:var(--ink)}.field input:focus,.field textarea:focus{border-color:#73977f;box-shadow:0 0 0 3px #6d9c7c20}.field textarea{min-height:135px;resize:vertical}.feedback{padding:14px 15px;border-radius:12px;margin-top:14px;background:#eff7f0;color:#315e3e;font-size:13px}.feedback.bad{background:#fff1ed;color:#8a3a2e}.exam-clock{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:15px 18px;border:1px solid #f0d3a5;background:#fff7e8;border-radius:14px;margin:12px 0 16px}.exam-clock>strong{font-size:26px;font-variant-numeric:tabular-nums;color:#8a5520;white-space:nowrap}.exam-clock strong{font-weight:850}.exam-clock .small-muted{margin-top:3px}.lesson-actions{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:20px}.section-title{font-size:20px;margin:0 0 14px}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:15px;background:white}.data-table{border-collapse:collapse;width:100%;min-width:570px}.data-table th,.data-table td{padding:13px 15px;text-align:left;border-bottom:1px solid #edf0ec;font-size:12px}.data-table th{background:#f7f9f5;color:#647267;font-size:10px;text-transform:uppercase;letter-spacing:.08em}.data-table tr:last-child td{border-bottom:0}.empty{padding:30px 20px;text-align:center;color:var(--muted);font-size:13px}.auth-wrap{min-height:calc(100vh - 72px);display:grid;place-items:center;padding:25px}.auth-card{width:min(100%,460px);background:white;border:1px solid var(--line);border-radius:23px;padding:30px;box-shadow:var(--shadow)}.auth-card h1{font-size:28px;margin:7px 0}.auth-card>p{color:var(--muted);font-size:13px}.tabs{display:flex;background:#f0f3ef;border-radius:11px;padding:4px;margin:18px 0}.tabs button{flex:1;border:0;padding:9px;border-radius:8px;background:transparent;font-weight:750;color:#68776c}.tabs button.active{background:white;color:var(--green);box-shadow:0 2px 5px #172d2010}.notice{padding:12px 14px;background:#f7f8f4;border:1px solid var(--line);border-radius:11px;font-size:12px;color:#667368;margin:13px 0}.notice.error{color:#8a352e;background:#fff2f0;border-color:#f3d2cd}.notice.success{color:#315e3e;background:#edf8ef;border-color:#d5ead9}.foot{border-top:1px solid var(--line);margin-top:35px;padding:18px 0;color:#8a948b;font-size:11px;display:flex;justify-content:space-between;gap:12px}.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.settings-grid .card{padding:22px}.small-muted{font-size:11px;color:var(--muted)}.hide{display:none!important}.mobile-menu{display:none}.toast{position:fixed;bottom:20px;right:20px;background:#263e32;color:white;padding:13px 17px;border-radius:12px;font-size:13px;box-shadow:var(--shadow);z-index:99;max-width:340px}.ring{width:90px;height:90px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(#709b7e var(--p),#e7ede7 0);position:relative}.ring:before{content:"";position:absolute;inset:8px;background:white;border-radius:50%}.ring strong{position:relative;font-size:20px}.app-mode-label{font-size:11px;color:#8b968c}.badge-dot{width:7px;height:7px;border-radius:50%;background:#70a67c;display:inline-block;margin-right:5px}

<script type="module">
const APP_KEY='vanminh:v2';
const LOCAL_PREFIX='vanminh:learner:';
const CONFIG=window.VANMINH_CONFIG||{};
let cloudTimer=null, cloudLoading=false, parentResults=null, examClock=null;
const lessons=[
{"id":"start-here","phase":1,"title":"Bắt đầu từ gốc: học Ngữ văn như thế nào?","subtitle":"Không cần học thuộc văn mẫu; bắt đầu từ việc hiểu và nói rõ ý của mình","icon":"🌱","duration":"10–15 phút","skill":"Làm quen","steps":[{"type":"learn","title":"Ngữ văn không chỉ là viết bài dài","body":"Môn Ngữ văn rèn ba việc liên kết với nhau: đọc để hiểu văn bản, dùng tiếng Việt để diễn đạt chính xác và viết/nói để trình bày suy nghĩ có căn cứ. Nếu đang mất gốc, em không cần viết hay ngay; hãy tập làm từng việc nhỏ theo đúng thứ tự.","bullets":["Đọc hiểu: nhận ra văn bản nói gì, chi tiết nào quan trọng và vì sao.","Tiếng Việt: hiểu nghĩa từ, câu, cách liên kết và cách dùng từ phù hợp.","Viết: trả lời đúng câu hỏi trước, sau đó mới phát triển thành đoạn và bài."],"example":"Khi đề hỏi “Vì sao nhân vật buồn?”, em cần tìm chi tiết thể hiện tâm trạng rồi giải thích. Không cần mở bài dài hay dùng từ thật kêu."},{"type":"quiz","title":"Chọn cách bắt đầu phù hợp","question":"Một học sinh thấy mình viết văn rất yếu. Việc nên làm đầu tiên là gì?","options":["Học thuộc thật nhiều bài văn mẫu.","Tập đọc đề, tìm ý chính và viết câu trả lời ngắn có căn cứ.","Dùng thật nhiều từ ngữ hoa mỹ để bài dài hơn."],"correct":1,"explain":"Người mất gốc cần xây nền tảng trước: hiểu yêu cầu, đọc đúng, tìm căn cứ và diễn đạt rõ ràng. Học thuộc văn mẫu không giúp xử lý được đề mới."},{"type":"write","title":"Đặt mục tiêu nhỏ cho việc học","prompt":"Hãy viết 1–2 câu: em thấy khó nhất ở phần nào của môn Ngữ văn và em muốn cải thiện điều gì trước tiên.","minWords":12,"guide":"Có thể viết theo mẫu: “Em thường gặp khó khăn khi… Em muốn tập trước kỹ năng… vì…”. Không cần viết hay, chỉ cần đúng điều em nghĩ.","rubric":["Nêu được một khó khăn cụ thể","Nêu được một mục tiêu có thể luyện tập"],"model":"Em thường khó tìm ý khi đọc đề. Em muốn tập xác định từ khóa và trả lời bằng câu ngắn trước, vì khi hiểu đúng câu hỏi em sẽ dễ viết hơn."}]},
{"id":"understand-question","phase":1,"title":"Đọc đề và hiểu đúng từ khóa","subtitle":"Phân biệt yêu cầu: nêu, chỉ ra, giải thích, phân tích, nhận xét","icon":"🧭","duration":"12–18 phút","skill":"Kỹ năng làm đề","steps":[{"type":"learn","title":"Mỗi động từ yêu cầu một cách trả lời","body":"Trước khi trả lời, hãy khoanh động từ chỉ yêu cầu và gạch chân đối tượng được hỏi. “Chỉ ra/nêu” thường cần câu trả lời trực tiếp; “giải thích” cần nêu vì sao; “phân tích” cần làm rõ chi tiết và ý nghĩa; “nhận xét” cần đưa ra đánh giá kèm căn cứ.","bullets":["Nêu/chỉ ra: trả lời thẳng vào thông tin cần tìm.","Giải thích: nêu nguyên nhân hoặc ý nghĩa, thường trả lời câu hỏi “vì sao?”.","Phân tích: đưa chi tiết, giải thích chi tiết ấy cho thấy điều gì.","Nhận xét/đánh giá: nêu ý kiến và căn cứ; tránh khen/chê chung chung."],"example":"Câu hỏi “Chỉ ra một hình ảnh cho thấy sự vất vả” cần nêu hình ảnh cụ thể. Câu “Phân tích tác dụng của hình ảnh ấy” còn cần giải thích hình ảnh gợi ra điều gì."},{"type":"quiz","title":"Đúng với động từ yêu cầu","question":"Đề hỏi: “Giải thích vì sao nhân vật quyết định quay lại giúp bạn.” Câu trả lời nào đúng hướng nhất?","options":["Nhân vật quay lại giúp bạn.","Nhân vật quay lại vì thấy bạn đang gặp khó khăn; hành động ấy cho thấy sự quan tâm và tinh thần trách nhiệm.","Nhân vật là người tốt."],"correct":1,"explain":"Câu trả lời cần nêu nguyên nhân và giải thích ý nghĩa. Đáp án A chỉ nhắc lại hành động; đáp án C là nhận xét chung, chưa có căn cứ."},{"type":"order","title":"Sắp xếp cách xử lý đề","question":"Hãy sắp xếp các bước trước khi trả lời một câu hỏi đọc hiểu.","items":[{"id":"a","text":"Đọc lại văn bản để tìm chi tiết liên quan."},{"id":"b","text":"Gạch chân từ khóa và động từ yêu cầu."},{"id":"c","text":"Viết câu trả lời đúng trọng tâm."},{"id":"d","text":"Kiểm tra xem câu trả lời đã giải quyết đủ yêu cầu chưa."}],"correct":["b","a","c","d"],"explain":"Xác định yêu cầu trước, tìm căn cứ sau, viết rồi tự kiểm tra. Làm đúng trình tự giúp tránh trả lời lan man."}]},
{"id":"reading-strategy","phase":1,"title":"Đọc văn bản theo 3 lượt","subtitle":"Từ hiểu nội dung chung đến tìm chi tiết và suy luận","icon":"🔎","duration":"15–20 phút","skill":"Đọc hiểu","steps":[{"type":"learn","title":"Ba lượt đọc dành cho người dễ bị rối","body":"Không cần hiểu tất cả ngay lần đầu. Lượt 1 đọc nhan đề và toàn văn để nắm chủ đề. Lượt 2 đánh dấu nhân vật, sự việc, hình ảnh, từ ngữ lặp lại. Lượt 3 quay lại đúng câu hỏi để chọn bằng chứng và suy luận.","bullets":["Lượt 1: văn bản nói về ai/điều gì? Không vội phân tích từng từ.","Lượt 2: gạch dưới chi tiết quan trọng; ghi bên lề từ khóa ngắn.","Lượt 3: đối chiếu câu hỏi với văn bản; phân biệt điều được nói rõ và điều mình suy ra."],"example":"Văn bản kể về một bạn nhỏ nhường áo mưa cho người khác. Chi tiết “em đi dưới mưa về nhà” là bằng chứng; “em biết quan tâm” là nhận xét cần dựa vào chi tiết đó."},{"type":"quiz","title":"Phân biệt thông tin và suy luận","question":"Văn bản viết: “Lan nhường chỗ ngồi cho người lớn tuổi rồi đứng suốt quãng đường.” Điều nào là thông tin trực tiếp?","options":["Lan luôn là người tốt nhất lớp.","Lan nhường chỗ và đứng suốt quãng đường.","Lan chắc chắn rất giỏi mọi môn học."],"correct":1,"explain":"Đây là chi tiết được nói trực tiếp. Hai ý còn lại suy rộng quá mức, không có căn cứ từ câu văn."},{"type":"write","title":"Tìm bằng chứng cho nhận xét","prompt":"Giả sử em nhận xét nhân vật biết quan tâm người khác. Hãy viết một câu nêu loại chi tiết em cần tìm để chứng minh nhận xét ấy.","minWords":12,"guide":"Hãy nghĩ đến hành động, lời nói hoặc sự lựa chọn của nhân vật có liên quan trực tiếp đến người khác.","rubric":["Nêu được loại chi tiết phù hợp","Giải thích được vì sao chi tiết hỗ trợ nhận xét"],"model":"Em sẽ tìm hành động hoặc lời nói cho thấy nhân vật để ý đến khó khăn của người khác, chẳng hạn chủ động giúp đỡ khi thấy người khác cần."}]},
{id:'foundation-reading',phase:1,title:'Đọc hiểu: Tìm ý chính và bằng chứng',subtitle:'Đọc có mục tiêu, hiểu đúng trước khi viết',icon:'🔎',duration:'15–20 phút',skill:'Đọc hiểu',steps:[
{type:'learn',title:'Đọc để tìm điều quan trọng',body:'Đọc hiểu không phải là nhớ mọi từ trong văn bản. Trước tiên, hãy tự hỏi: đoạn văn đang nói về điều gì, tác giả muốn nhấn mạnh điều gì, chi tiết nào chứng minh nhận xét đó?',bullets:['Ý chính: thông tin hoặc thông điệp bao quát đoạn văn.','Bằng chứng: từ ngữ, chi tiết hoặc câu văn cụ thể làm căn cứ.','Suy luận: điều ta rút ra từ bằng chứng; cần có lý do hợp lý, không đoán tùy ý.'],example:'Một bạn luôn ở lại sau giờ học để giải thích bài cho bạn khác. Từ hành động ấy, ta có thể suy luận bạn ấy biết quan tâm và sẵn lòng giúp đỡ — nhưng không nên kết luận bạn ấy luôn đứng đầu lớp nếu không có căn cứ.'},
{type:'quiz',title:'Chọn ý chính',question:'Đọc đoạn sau: “Mỗi tối, Mai dành mười phút ghi lại những điều mình chưa hiểu. Hôm sau, em hỏi thầy cô hoặc bạn bè. Sau vài tuần, Mai nhận ra mình tự tin hơn khi học.” Ý chính phù hợp nhất là gì?',options:['Mai học giỏi tất cả các môn.','Thói quen nhận diện điều chưa hiểu và chủ động hỏi giúp Mai tiến bộ.','Mai chỉ học vào buổi tối.'],correct:1,explain:'Đáp án này bao quát cả thói quen và kết quả được nêu trong đoạn. Hai đáp án còn lại kết luận quá rộng hoặc chỉ nhắc một chi tiết.'},
{type:'quiz',title:'Tìm bằng chứng',question:'Chi tiết nào hỗ trợ trực tiếp nhất cho nhận xét “Mai chủ động trong học tập”?',options:['“Sau vài tuần”','“Hôm sau, em hỏi thầy cô hoặc bạn bè.”','“Mai nhận ra mình tự tin hơn.”'],correct:1,explain:'Chi tiết Mai tự tìm người hỏi cho thấy hành động chủ động. Câu cuối nói về kết quả, còn cụm “sau vài tuần” chỉ thời gian.'},
{type:'write',title:'Diễn đạt bằng lời của mình',prompt:'Viết 1–2 câu giải thích vì sao việc ghi lại điều chưa hiểu có thể giúp một học sinh tiến bộ.',minWords:12,guide:'Hãy nêu một lợi ích rồi giải thích lợi ích đó. Ví dụ: việc ghi lại câu hỏi giúp… vì…',rubric:['Có trả lời đúng trọng tâm','Có giải thích mối liên hệ giữa hành động và kết quả'],model:'Việc ghi lại điều chưa hiểu giúp học sinh nhận ra chính xác phần kiến thức còn yếu. Nhờ vậy, các bạn có thể đặt câu hỏi cụ thể và sửa lỗ hổng thay vì học một cách mơ hồ.'}
]},
{"id":"expression-methods","phase":1,"title":"Phương thức biểu đạt thường gặp","subtitle":"Nhận biết tự sự, miêu tả, biểu cảm, thuyết minh, nghị luận","icon":"🧩","duration":"15–20 phút","skill":"Kiến thức nền","steps":[{"type":"learn","title":"Nhìn vào mục đích chính của đoạn","body":"Một văn bản có thể kết hợp nhiều phương thức, nhưng câu hỏi thường yêu cầu phương thức chính hoặc một phương thức nổi bật. Đừng chỉ nhìn một từ đơn lẻ; hãy nhìn xem đoạn chủ yếu đang kể việc, tả đặc điểm, bộc lộ cảm xúc, cung cấp tri thức hay bảo vệ ý kiến.","bullets":["Tự sự: kể sự việc, thường có nhân vật và diễn biến.","Miêu tả: làm hiện lên đặc điểm, hình dáng, âm thanh, cảnh vật.","Biểu cảm: bộc lộ cảm xúc, tình cảm.","Thuyết minh: cung cấp tri thức, giải thích đặc điểm/cách thức.","Nghị luận: nêu ý kiến và dùng lý lẽ, dẫn chứng để thuyết phục."],"example":"“Con đường quanh co dưới hàng phượng đỏ, tiếng ve vang trên mái trường” thiên về miêu tả. “Tôi nhớ mãi buổi chia tay ấy” thiên về biểu cảm."},{"type":"quiz","title":"Nhận diện phương thức","question":"Đoạn văn trình bày các bước trồng một chậu cây, giải thích vì sao cần thoát nước và nêu cách chăm sóc. Phương thức nổi bật nhất là gì?","options":["Tự sự","Thuyết minh","Biểu cảm"],"correct":1,"explain":"Đoạn cung cấp kiến thức và hướng dẫn cách làm nên phương thức nổi bật là thuyết minh."},{"type":"quiz","title":"Khi văn bản kết hợp nhiều cách","question":"Một truyện ngắn có câu tả cơn mưa và kể nhân vật chạy về nhà. Nhận định nào đúng?","options":["Một văn bản chỉ được dùng duy nhất một phương thức.","Văn bản có thể kết hợp tự sự và miêu tả; cần xác định phương thức chính theo yêu cầu.","Có cảnh vật thì toàn bộ văn bản chắc chắn là thuyết minh."],"correct":1,"explain":"Các phương thức có thể kết hợp. Khi đề hỏi phương thức chính, hãy xét mục đích nổi bật của toàn đoạn/văn bản."},{"type":"write","title":"Giải thích lựa chọn","prompt":"Tự viết một ví dụ ngắn cho phương thức miêu tả hoặc nghị luận, rồi ghi một câu giải thích vì sao em chọn phương thức ấy.","minWords":18,"guide":"Nếu miêu tả, hãy làm hiện lên đặc điểm của một cảnh/vật. Nếu nghị luận, hãy nêu một ý kiến và một lý do bảo vệ ý kiến đó.","rubric":["Ví dụ phù hợp với phương thức đã chọn","Giải thích dựa trên dấu hiệu của phương thức"],"model":"“Sân trường rực màu hoa phượng, tiếng ve ngân trên những tán lá.” Đây là miêu tả vì câu văn tập trung làm hiện lên màu sắc và âm thanh của cảnh vật."}]},
{"id":"text-genres","phase":1,"title":"Nhận biết thể loại và kiểu văn bản","subtitle":"Thơ, truyện, ký, văn nghị luận và văn bản thông tin","icon":"📚","duration":"15–20 phút","skill":"Kiến thức nền","steps":[{"type":"learn","title":"Thể loại cho em biết cần chú ý điều gì","body":"Thể loại không phải chiếc nhãn để học thuộc rời rạc. Nhận ra thể loại giúp em biết nên tìm gì trong văn bản: thơ chú ý hình ảnh và cảm xúc; truyện chú ý nhân vật, sự việc, tình huống; văn bản thông tin chú ý dữ kiện và cách giải thích; nghị luận chú ý luận điểm và lý lẽ.","bullets":["Thơ: dòng thơ, nhịp, hình ảnh, âm thanh, cảm xúc và chủ thể trữ tình.","Truyện: nhân vật, người kể chuyện, sự việc, tình huống, chi tiết.","Ký: ghi chép/miêu tả con người, sự việc hoặc trải nghiệm, thường gắn với quan sát của người viết.","Văn bản thông tin: cung cấp, giải thích dữ kiện về một đối tượng/sự việc.","Văn bản nghị luận: nêu vấn đề, quan điểm, lý lẽ và dẫn chứng."],"example":"Nếu đề hỏi “chi tiết nào làm thay đổi quyết định của nhân vật?”, em đang đọc một văn bản có tuyến sự việc/nhân vật và cần theo dõi diễn biến."},{"type":"quiz","title":"Chọn điều cần chú ý","question":"Khi đọc một bài thơ thể hiện nỗi nhớ quê hương, nhóm yếu tố nào nên được chú ý trước?","options":["Chỉ đếm số câu văn và số nhân vật.","Hình ảnh thơ, từ ngữ gợi cảm, giọng điệu và cảm xúc.","Chỉ tìm số liệu và các bước thực hiện."],"correct":1,"explain":"Hình ảnh, từ ngữ và giọng điệu là những manh mối quan trọng để hiểu cảm xúc trong thơ."},{"type":"quiz","title":"Văn bản nghị luận","question":"Dấu hiệu nào giúp nhận biết rõ văn bản đang lập luận?","options":["Có ý kiến được nêu ra và lý lẽ/dẫn chứng để bảo vệ ý kiến.","Có nhiều màu sắc được miêu tả.","Chỉ có lời thoại giữa hai nhân vật."],"correct":0,"explain":"Văn bản nghị luận thuyết phục người đọc bằng quan điểm và căn cứ, dù có thể dùng ví dụ, kể chuyện hoặc miêu tả để hỗ trợ."}]},
{"id":"vietnamese-basics","phase":1,"title":"Tiếng Việt nền tảng: từ, câu và dấu câu","subtitle":"Diễn đạt thành câu trọn ý trước khi viết đoạn","icon":"🔤","duration":"15–20 phút","skill":"Tiếng Việt","steps":[{"type":"learn","title":"Một câu cần rõ ai/cái gì và nói điều gì","body":"Khi viết, hãy kiểm tra câu có ý nghĩa trọn vẹn không, từ ngữ có đúng nghĩa không và dấu câu có giúp người đọc hiểu không. Không cần phân tích ngữ pháp phức tạp ngay; trước hết hãy viết câu rõ chủ thể và hành động/nhận xét.","bullets":["Từ ngữ: chọn từ đúng nghĩa, tránh lặp vô ích hoặc dùng từ không hợp ngữ cảnh.","Câu: bảo đảm người đọc hiểu rõ em đang nói về ai/điều gì và ý gì.","Dấu chấm kết thúc ý; dấu phẩy ngăn các thành phần phù hợp, không đặt tùy tiện.","Không ghép quá nhiều ý xa nhau vào một câu dài."],"example":"Chưa rõ: “Vì nhân vật tốt bụng và rất nhiều điều nên truyện hay.” Rõ hơn: “Nhân vật tốt bụng vì sẵn sàng giúp người khác. Chi tiết này làm câu chuyện trở nên ấm áp.”"},{"type":"quiz","title":"Sửa câu thiếu rõ ràng","question":"Câu nào diễn đạt rõ nghĩa nhất?","options":["Vì bạn giúp và tốt nên việc ấy rất là.","Bạn chủ động giúp bạn cùng lớp khi bạn ấy gặp khó khăn.","Sự việc và bởi vì giúp đỡ điều đó."],"correct":1,"explain":"Câu B nêu rõ chủ thể, hành động và hoàn cảnh. Hai câu còn lại thiếu quan hệ ý nghĩa rõ ràng."},{"type":"order","title":"Từ ý rời thành câu rõ","question":"Sắp xếp để tạo thành câu tự nhiên.","items":[{"id":"a","text":"nên bạn ấy đã chủ động giúp đỡ"},{"id":"b","text":"Khi thấy bạn cùng lớp gặp khó khăn,"},{"id":"c","text":"và giải thích lại bài học."}],"correct":["b","a","c"],"explain":"Cụm chỉ hoàn cảnh đứng trước, sau đó đến hành động chính và phần bổ sung hành động."},{"type":"write","title":"Viết lại câu cho rõ","prompt":"Hãy viết lại câu “Vì việc tốt nên rất quan trọng và mọi người” thành một hoặc hai câu có nghĩa rõ ràng.","minWords":12,"guide":"Xác định em muốn nói ai làm việc gì và vì sao việc ấy có ý nghĩa. Có thể đổi hoàn toàn cách diễn đạt miễn là rõ ý.","rubric":["Câu có nghĩa trọn vẹn","Quan hệ giữa hành động và ý nghĩa rõ ràng"],"model":"Giúp đỡ người khác là việc làm có ý nghĩa. Hành động ấy thể hiện sự quan tâm và có thể giúp người gặp khó khăn cảm thấy được sẻ chia."}]},
{"id":"rhetorical-devices","phase":1,"title":"Biện pháp tu từ thường gặp","subtitle":"Nhận diện so sánh, nhân hóa, ẩn dụ, điệp ngữ và tác dụng","icon":"✨","duration":"18–25 phút","skill":"Tiếng Việt và đọc hiểu","steps":[{"type":"learn","title":"Đừng chỉ gọi tên biện pháp tu từ","body":"Khi đề hỏi tác dụng, em cần nói được biện pháp làm hình ảnh/cảm xúc/ý nghĩa nổi bật như thế nào trong ngữ cảnh cụ thể. Tránh trả lời máy móc “làm câu văn sinh động” mà không nói sinh động ở điểm nào.","bullets":["So sánh: đối chiếu hai sự vật để làm rõ đặc điểm.","Nhân hóa: gọi/tả sự vật bằng đặc điểm, hành động của con người.","Ẩn dụ: gọi tên sự vật bằng hình ảnh khác có nét tương đồng.","Hoán dụ: gọi sự vật bằng một dấu hiệu/bộ phận có quan hệ gần gũi.","Điệp ngữ: lặp từ/cụm từ có chủ đích; liệt kê: nêu nối tiếp nhiều sự vật/đặc điểm."],"example":"“Mặt trời xuống biển như hòn lửa” dùng so sánh để làm nổi bật vẻ rực sáng, hình dáng tròn và sắc đỏ của mặt trời lúc hoàng hôn."},{"type":"quiz","title":"Nhận diện biện pháp","question":"Câu “Những hàng cây dang tay đón gió” sử dụng biện pháp nào nổi bật?","options":["Nhân hóa","Thuyết minh","Nghị luận"],"correct":0,"explain":"“Dang tay đón” là hành động gắn với con người được dùng để miêu tả hàng cây, vì vậy là nhân hóa."},{"type":"quiz","title":"Nêu tác dụng có căn cứ","question":"Với câu “Tiếng mưa gõ đều trên mái ngói”, cách giải thích nào cụ thể hơn?","options":["Biện pháp làm câu thơ hay.","Từ “gõ đều” gợi âm thanh mưa liên tiếp, giúp người đọc hình dung rõ không gian và nhịp điệu của cơn mưa.","Đây chắc chắn là ẩn dụ nói về nỗi buồn của tác giả."],"correct":1,"explain":"Câu trả lời tốt chỉ ra từ ngữ và tác dụng cụ thể. Không nên tự kết luận tâm trạng nếu ngữ cảnh chưa hỗ trợ."},{"type":"write","title":"Giải thích một biện pháp","prompt":"Tự tạo một câu có so sánh hoặc nhân hóa, rồi giải thích hình ảnh ấy giúp người đọc hình dung điều gì.","minWords":15,"guide":"Ghi câu của em trước. Sau đó nêu từ ngữ tạo biện pháp và tác dụng cụ thể của nó.","rubric":["Có sử dụng đúng một biện pháp","Gọi đúng từ ngữ tạo biện pháp","Nêu tác dụng gắn với hình ảnh cụ thể"],"model":"“Gió chạy qua cánh đồng.” Cách nhân hóa “chạy” khiến gió như có chuyển động của con người, giúp cảnh đồng hiện lên sống động hơn."}]},
{"id":"narrative-basics","phase":2,"title":"Đọc truyện: người kể, nhân vật và chi tiết","subtitle":"Hiểu ai đang kể, ai đang hành động và chi tiết nói lên điều gì","icon":"🧑‍🤝‍🧑","duration":"18–22 phút","skill":"Đọc truyện","steps":[{"type":"learn","title":"Bốn câu hỏi khi đọc truyện","body":"Khi gặp văn bản tự sự, trước hết xác định ai kể chuyện, sự việc xảy ra với ai, tình huống nào quan trọng và chi tiết nào giúp hiểu nhân vật. Người kể chuyện không nhất thiết chính là tác giả; cần căn cứ vào cách văn bản kể.","bullets":["Người kể ngôi thứ nhất thường xưng “tôi”, kể từ góc nhìn của người trong cuộc.","Người kể ngôi thứ ba thường gọi nhân vật bằng tên hoặc đại từ; phạm vi hiểu biết tùy văn bản.","Nhân vật được khắc họa qua lời nói, hành động, suy nghĩ và quan hệ với người khác.","Chi tiết quan trọng có thể làm thay đổi diễn biến hoặc bộc lộ phẩm chất/tâm trạng."],"example":"Nếu nhân vật “cầm lá thư rồi gấp lại nhiều lần nhưng chưa gửi”, hành động ấy có thể gợi sự do dự. Em cần đọc ngữ cảnh trước và sau để giải thích chắc chắn."},{"type":"quiz","title":"Xác định người kể","question":"Đoạn văn viết: “Tôi cất quyển vở vào cặp và chạy xuống sân.” Dấu hiệu nào cho thấy câu chuyện được kể ở ngôi thứ nhất?","options":["Có nhắc đến một quyển vở.","Người kể xưng “tôi”.","Sự việc xảy ra ở sân trường."],"correct":1,"explain":"Đại từ “tôi” là dấu hiệu trực tiếp của ngôi kể thứ nhất trong câu này."},{"type":"quiz","title":"Suy luận từ chi tiết","question":"Nhân vật nhìn đồng hồ liên tục, đi lại trước cửa rồi thở phào khi thấy mẹ về. Nhận xét nào hợp lý nhất?","options":["Nhân vật chắc chắn ghét ở nhà.","Các hành động gợi sự chờ đợi và lo lắng; cần dựa vào ngữ cảnh để giải thích nguyên nhân.","Nhân vật không biết xem giờ."],"correct":1,"explain":"Chi tiết hỗ trợ suy luận về tâm trạng nhưng chưa đủ để kết luận nguyên nhân cụ thể. Phân tích tốt cần thận trọng."},{"type":"write","title":"Phân tích một hành động","prompt":"Tưởng tượng nhân vật im lặng nhặt lại quyển sách bị bạn làm rơi. Viết 2–3 câu phân tích hành động này có thể cho thấy điều gì, kèm cách diễn đạt thận trọng.","minWords":18,"guide":"Nêu hành động trước, sau đó liên hệ với phẩm chất có căn cứ. Dùng các cụm “có thể cho thấy”, “gợi ra” khi chưa có đủ thông tin.","rubric":["Nêu đúng chi tiết","Giải thích phẩm chất/tâm trạng hợp lý","Không kết luận quá mức"],"model":"Việc nhân vật im lặng nhặt sách cho thấy bạn ấy sẵn sàng giúp đỡ mà không cần được chú ý. Hành động này có thể gợi sự tử tế, nhưng cần đọc thêm ngữ cảnh để hiểu đầy đủ tính cách nhân vật."}]},
{"id":"poetry-reading","phase":2,"title":"Đọc hiểu thơ từ những điều nhìn thấy","subtitle":"Hình ảnh, từ ngữ, nhịp điệu, cảm xúc và chủ thể trữ tình","icon":"🌸","duration":"18–25 phút","skill":"Đọc thơ","steps":[{"type":"learn","title":"Đọc thơ bằng chứng cứ cụ thể","body":"Đừng bắt đầu bằng việc đoán “tác giả muốn nói gì”. Hãy chú ý từ ngữ và hình ảnh trước: hình ảnh nào xuất hiện, từ nào gợi cảm giác, giọng điệu ra sao, cảm xúc chuyển biến thế nào. Sau đó mới giải thích thông điệp có căn cứ.","bullets":["Hình ảnh thơ: sự vật/cảnh/hoạt động giúp diễn đạt cảm xúc hoặc ý nghĩa.","Từ ngữ gợi tả/gợi cảm: tạo màu sắc, âm thanh, chuyển động hoặc sắc thái tình cảm.","Chủ thể trữ tình: tiếng nói thể hiện cảm xúc trong bài thơ; không mặc định trùng hoàn toàn với tác giả ngoài đời.","Nhịp, vần, giọng điệu có thể góp phần tạo cảm xúc; hãy chỉ ra biểu hiện cụ thể."],"example":"Nếu bài thơ nhắc “bếp lửa”, “mùi khói” và “bàn tay bà”, các hình ảnh ấy có thể gợi ký ức gia đình và tình thương. Cần dùng câu thơ cụ thể để giải thích."},{"type":"quiz","title":"Bắt đầu phân tích thơ","question":"Muốn giải thích hình ảnh “con đường nhỏ dẫn về nhà” gợi nỗi nhớ, em nên làm gì trước?","options":["Khẳng định ngay tác giả đang nhớ quê hương, không cần căn cứ.","Xem các từ ngữ xung quanh, hoàn cảnh xuất hiện hình ảnh và cảm xúc của đoạn thơ.","Chỉ đếm số chữ trong câu thơ."],"correct":1,"explain":"Ý nghĩa hình ảnh phụ thuộc ngữ cảnh và các từ xung quanh. Cần tìm bằng chứng rồi mới nêu cách hiểu."},{"type":"order","title":"Sắp xếp các bước phân tích hình ảnh thơ","question":"Sắp xếp từ quan sát đến giải thích.","items":[{"id":"a","text":"Giải thích hình ảnh gợi cảm xúc hoặc ý nghĩa gì trong ngữ cảnh."},{"id":"b","text":"Trích hoặc nêu chính xác hình ảnh/từ ngữ."},{"id":"c","text":"Đọc câu thơ trước sau để hiểu ngữ cảnh."},{"id":"d","text":"Kết nối với chủ đề/cảm xúc của đoạn thơ."}],"correct":["b","c","a","d"],"explain":"Bắt đầu từ bằng chứng, kiểm tra ngữ cảnh, giải thích ý nghĩa rồi liên hệ với cảm xúc/chủ đề."},{"type":"write","title":"Trả lời về một hình ảnh thơ","prompt":"Hãy tự chọn một hình ảnh trong bài thơ em đang học hoặc tưởng tượng một hình ảnh, rồi viết 3 câu: hình ảnh là gì, gợi điều gì, và chi tiết nào giúp em hiểu như vậy.","minWords":25,"guide":"Có thể viết theo cấu trúc: “Hình ảnh… xuất hiện qua… Hình ảnh này gợi… vì… Qua đó…”.","rubric":["Nêu hình ảnh cụ thể","Giải thích dựa trên từ ngữ/ngữ cảnh","Liên hệ hợp lý với cảm xúc hoặc chủ đề"],"model":"Hình ảnh “mái nhà sáng đèn” gợi cảm giác ấm áp và sum họp. Ánh sáng thường gắn với sự hiện diện của người thân và nơi trở về. Vì vậy, trong ngữ cảnh phù hợp, hình ảnh có thể thể hiện nỗi nhớ gia đình hoặc niềm mong đợi được trở về."}]},
{"id":"summary-and-paraphrase","phase":2,"title":"Tóm tắt và diễn đạt lại bằng lời của mình","subtitle":"Giữ ý chính, không chép dài và không thêm chi tiết không có","icon":"📝","duration":"15–20 phút","skill":"Đọc hiểu","steps":[{"type":"learn","title":"Tóm tắt là chọn ý, không phải chép lại","body":"Tóm tắt cần giữ sự việc/ý chính quan trọng theo trình tự hợp lý, lược bỏ chi tiết phụ và không tự thêm thông tin. Diễn đạt lại là dùng câu chữ của mình nhưng phải giữ đúng nghĩa bản gốc.","bullets":["Đọc toàn đoạn để xác định chủ đề và sự việc chính.","Tự hỏi: nếu bỏ chi tiết này, người đọc có còn hiểu diễn biến/ý chính không?","Dùng từ của mình nhưng không bóp méo thông tin.","Không biến suy đoán cá nhân thành sự thật của văn bản."],"example":"Bản gốc có nhiều câu kể Lan chuẩn bị sách, đặt báo thức và đến lớp sớm. Có thể tóm tắt: “Lan chuẩn bị trước để chủ động cho buổi học.”"},{"type":"quiz","title":"Chọn bản tóm tắt tốt","question":"Đoạn văn kể Nam luyện đọc mỗi ngày, nhờ bạn sửa lỗi và dần tự tin phát biểu. Bản tóm tắt nào tốt nhất?","options":["Nam luyện đọc, nhờ bạn góp ý và dần tự tin hơn.","Nam luôn đứng đầu trường và chắc chắn sẽ thành nhà văn.","Nam có một người bạn."],"correct":0,"explain":"Bản A giữ chuỗi hành động và kết quả chính, không thêm kết luận vượt quá văn bản."},{"type":"write","title":"Tóm tắt ngắn","prompt":"Tóm tắt bằng 1–2 câu câu chuyện sau: “Hà thường ngại hỏi khi chưa hiểu bài. Một hôm, em ghi ra ba câu hỏi và nhờ cô giáo giải thích. Sau đó, Hà hiểu bài hơn và bắt đầu chủ động hỏi khi gặp khó khăn.”","minWords":18,"guide":"Nêu vấn đề ban đầu, hành động chính và kết quả; có thể gộp chi tiết nhỏ.","rubric":["Giữ được vấn đề ban đầu","Nêu hành động giải quyết","Nêu kết quả chính, không thêm thông tin"],"model":"Ban đầu Hà ngại hỏi khi chưa hiểu bài, nhưng sau khi ghi câu hỏi và nhờ cô giải thích, em hiểu bài hơn. Từ đó, Hà chủ động hỏi khi gặp khó khăn."}]},
{id:'sentence-paragraph',phase:2,title:'Từ câu đơn đến đoạn văn mạch lạc',subtitle:'Mỗi câu có một nhiệm vụ rõ ràng',icon:'✍️',duration:'20–25 phút',skill:'Diễn đạt',steps:[
{type:'learn',title:'Một đoạn văn cần có trục ý',body:'Đoạn văn tốt không chỉ gồm nhiều câu đúng ngữ pháp. Các câu phải cùng làm rõ một ý chính và được sắp xếp theo trình tự người đọc dễ theo dõi.',bullets:['Câu chủ đề: nêu ý chính của đoạn.','Câu triển khai: giải thích, đưa lý lẽ hoặc ví dụ.','Câu kết: khái quát hoặc nhấn mạnh ý; không phải đoạn nào cũng bắt buộc có câu kết riêng.'],example:'Ý chính: Đọc sách giúp mở rộng hiểu biết. → Giải thích: Sách đem lại thông tin ngoài trải nghiệm trực tiếp. → Ví dụ: Một cuốn sách khoa học giúp người đọc hiểu hiện tượng tự nhiên. → Kết: Vì vậy, đọc sách là cách tự học hữu ích.'},
{type:'quiz',title:'Nhận diện câu chủ đề',question:'Với đoạn văn bàn về lợi ích của tinh thần trách nhiệm, câu nào phù hợp nhất để làm câu chủ đề?',options:['Hôm qua, lớp em trực nhật vào buổi sáng.','Tinh thần trách nhiệm giúp mỗi người đáng tin cậy hơn trong học tập và cuộc sống.','Bạn Nam đã lau bảng rất sạch.'],correct:1,explain:'Câu chủ đề cần bao quát ý mà cả đoạn sẽ triển khai. Hai câu còn lại là chi tiết riêng lẻ, có thể dùng làm ví dụ nhưng chưa thể hiện luận điểm tổng quát.'},
{type:'order',title:'Sắp xếp để tạo lập luận',question:'Sắp xếp các ý theo trình tự hợp lý nhất: nêu ý chính → giải thích → ví dụ → kết luận.',items:[{id:'a',text:'Vì thế, mỗi học sinh nên hình thành thói quen chuẩn bị bài trước khi đến lớp.'},{id:'b',text:'Chuẩn bị bài trước giúp học sinh chủ động hơn khi tiếp nhận kiến thức.'},{id:'c',text:'Khi đã đọc trước nội dung, học sinh dễ nhận ra chỗ chưa hiểu và đặt câu hỏi.'},{id:'d',text:'Chẳng hạn, em có thể đánh dấu những khái niệm khó để hỏi giáo viên.'}],correct:['b','c','d','a'],explain:'Bắt đầu bằng luận điểm, sau đó giải thích cơ chế, minh họa bằng ví dụ và cuối cùng rút ra kết luận.'},
{type:'write',title:'Viết một đoạn ngắn',prompt:'Viết đoạn văn khoảng 4–6 câu về một thói quen có ích cho việc học. Hãy có câu chủ đề, ít nhất một câu giải thích và một ví dụ.',minWords:35,guide:'Có thể bắt đầu bằng: “Một thói quen có ích cho việc học là…”. Sau đó tự hỏi: Vì sao có ích? Nó thể hiện trong hành động nào?',rubric:['Có ý chính rõ ràng','Có giải thích hoặc lý lẽ','Có ví dụ cụ thể','Các câu liên kết với nhau'],model:'Một thói quen có ích cho việc học là ôn lại bài sau mỗi buổi học. Việc ôn tập giúp kiến thức được củng cố và giúp em phát hiện phần mình chưa hiểu. Chẳng hạn, em có thể dành mười phút ghi lại ba ý quan trọng của bài học trong ngày. Nếu gặp nội dung khó, em đánh dấu để hỏi lại giáo viên. Vì vậy, ôn tập đều đặn giúp việc học hiệu quả hơn.'}
]},
{"id":"paragraph-cohesion","phase":2,"title":"Liên kết câu và đoạn văn","subtitle":"Dùng từ nối, phép lặp và trình tự ý để người đọc không bị lạc","icon":"🔗","duration":"15–20 phút","skill":"Diễn đạt","steps":[{"type":"learn","title":"Các câu cần nối ý với nhau","body":"Một đoạn có thể có nhiều câu đúng nhưng vẫn rời rạc nếu mỗi câu nói một hướng. Hãy kiểm tra câu sau có tiếp tục, giải thích, minh họa hay kết luận cho câu trước không.","bullets":["Từ nối chỉ quan hệ: vì vậy (kết quả), tuy nhiên (đối lập), chẳng hạn (ví dụ), trước hết (trình tự).","Phép lặp từ khóa giúp giữ chủ đề, nhưng tránh lặp quá dày.","Đại từ/cụm từ thay thế giúp câu sau liên hệ với đối tượng đã nêu.","Mỗi câu nên có vai trò; bỏ câu không phục vụ ý chính nếu cần."],"example":"“Đọc sách mở rộng hiểu biết. Chẳng hạn, sách khoa học giúp ta tìm hiểu thiên nhiên. Vì vậy, đọc sách là một cách tự học hữu ích.” Từ nối giúp người đọc thấy ví dụ và kết luận liên hệ với ý chính."},{"type":"quiz","title":"Chọn từ nối phù hợp","question":"“Trời mưa rất to. ___, trận đấu phải tạm hoãn.” Từ nối nào hợp lý nhất?","options":["Chẳng hạn","Vì vậy","Mặt khác"],"correct":1,"explain":"“Vì vậy” thể hiện kết quả: mưa to dẫn đến trận đấu tạm hoãn."},{"type":"order","title":"Sắp xếp một đoạn mạch lạc","question":"Sắp xếp câu chủ đề, giải thích, ví dụ, kết luận.","items":[{"id":"a","text":"Chẳng hạn, em có thể ghi những điều chưa hiểu vào sổ để hỏi thầy cô."},{"id":"b","text":"Ghi chép câu hỏi giúp việc học chủ động hơn."},{"id":"c","text":"Nhờ vậy, em nhận ra lỗ hổng kiến thức và biết mình cần tìm lời giải ở đâu."},{"id":"d","text":"Do đó, đây là thói quen nên duy trì sau mỗi buổi học."}],"correct":["b","c","a","d"],"explain":"Đoạn cần có ý chính, giải thích, ví dụ và kết luận; các phần phải hỗ trợ nhau chứ không chỉ xếp cho đủ."},{"type":"write","title":"Chỉnh đoạn rời rạc","prompt":"Hãy nối ý thành đoạn 3–4 câu từ các ý: “Đọc trước bài. Biết từ khó. Dễ đặt câu hỏi. Học chủ động hơn.”","minWords":20,"guide":"Thêm câu chủ đề và từ nối hợp lý. Không cần kéo dài nếu ý đã rõ.","rubric":["Có câu chủ đề","Các ý được liên kết hợp lý","Có kết quả/kết luận"],"model":"Đọc trước bài giúp học sinh chủ động hơn trong giờ học. Khi chuẩn bị, em có thể nhận ra từ ngữ hoặc khái niệm khó. Nhờ vậy, em biết đặt câu hỏi đúng chỗ thay vì chỉ nghe mà không hiểu. Vì thế, đọc trước bài là một thói quen hữu ích."}]},
{"id":"reading-answer-patterns","phase":2,"title":"Trả lời câu hỏi đọc hiểu đủ ý","subtitle":"Cách viết câu trả lời ngắn, đúng trọng tâm và có căn cứ","icon":"📌","duration":"15–20 phút","skill":"Kỹ năng làm bài","steps":[{"type":"learn","title":"Câu trả lời tốt thường có ba phần","body":"Không phải câu nào cũng cần dài. Với câu hỏi nhận biết, nêu trực tiếp đáp án. Với câu hỏi giải thích hoặc tác dụng, hãy thêm căn cứ và ý nghĩa cụ thể. Luôn bám vào giới hạn đề yêu cầu.","bullets":["Bước 1: trả lời đúng đối tượng được hỏi.","Bước 2: nêu chi tiết/từ ngữ làm căn cứ nếu câu hỏi cần.","Bước 3: giải thích tác dụng hoặc ý nghĩa nếu đề yêu cầu.","Tránh kể lại cả văn bản khi đề chỉ hỏi một chi tiết."],"example":"Hỏi “Nhân vật làm gì để giúp bạn?” → nêu hành động. Hỏi “Hành động đó cho thấy điều gì?” → nêu phẩm chất và giải thích bằng hành động ấy."},{"type":"quiz","title":"Câu hỏi yêu cầu nêu chi tiết","question":"Đề hỏi: “Nêu một hành động thể hiện sự quan tâm của nhân vật.” Câu nào phù hợp nhất?","options":["Nhân vật là người giàu tình cảm và có nhiều phẩm chất tốt đẹp.","Nhân vật dừng lại để giúp bạn nhặt sách bị rơi.","Theo em, xã hội ngày nay cần sự quan tâm."],"correct":1,"explain":"Đề yêu cầu một hành động, nên trả lời trực tiếp bằng chi tiết cụ thể trong văn bản."},{"type":"write","title":"Trả lời theo cấu trúc bằng chứng – giải thích","prompt":"Dựa vào tình huống: “Minh ở lại sau giờ học để giảng lại bài cho bạn chưa hiểu”, hãy trả lời: Hành động này cho thấy phẩm chất gì? Giải thích ngắn gọn.","minWords":18,"guide":"Nêu phẩm chất trước, sau đó nối với hành động bằng từ “vì”, “qua đó” hoặc “điều này cho thấy”.","rubric":["Nêu phẩm chất phù hợp","Dùng đúng chi tiết làm bằng chứng","Có giải thích chứ không chỉ gắn nhãn"],"model":"Hành động này cho thấy Minh biết quan tâm và có tinh thần giúp đỡ bạn bè. Việc ở lại để giảng lại bài cho thấy Minh dành thời gian hỗ trợ người đang gặp khó khăn."}]},
{"id":"argument-foundation","phase":3,"title":"Nghị luận xã hội từ số 0","subtitle":"Phân biệt vấn đề, ý kiến, luận điểm, lý lẽ và dẫn chứng","icon":"💡","duration":"18–25 phút","skill":"Nghị luận xã hội","steps":[{"type":"learn","title":"Một ý kiến cần có lý do và bằng chứng","body":"Nghị luận xã hội là bàn về một vấn đề trong đời sống. Bài viết cần trả lời: em nghĩ gì về vấn đề, vì sao em nghĩ vậy, ví dụ nào giúp làm rõ, và người đọc có thể rút ra điều gì.","bullets":["Vấn đề: nội dung đề yêu cầu bàn luận.","Quan điểm/luận điểm: điều em muốn khẳng định về vấn đề.","Lý lẽ: lời giải thích vì sao luận điểm hợp lý.","Dẫn chứng: trường hợp cụ thể có liên quan.","Phân tích dẫn chứng: nói rõ dẫn chứng chứng minh điều gì; không để ví dụ tự đứng một mình."],"example":"Vấn đề: giữ lời hứa. Luận điểm: giữ lời hứa tạo niềm tin. Lý lẽ: người khác có thể dựa vào điều ta đã cam kết. Dẫn chứng: một bạn thực hiện đúng phần việc nhóm đã nhận. Phân tích: các thành viên yên tâm phối hợp."},{"type":"quiz","title":"Phân biệt luận điểm và dẫn chứng","question":"Luận điểm “Biết nhận lỗi giúp con người tiến bộ” là gì?","options":["Một ý kiến cần được giải thích và bảo vệ.","Một ví dụ cụ thể về một học sinh.","Một câu trích dẫn có tên tác giả."],"correct":0,"explain":"Luận điểm là ý chính mà người viết muốn khẳng định. Ví dụ và trích dẫn có thể làm dẫn chứng, nhưng phải liên quan và được phân tích."},{"type":"order","title":"Xếp khung lập luận","question":"Sắp xếp thành một đoạn nghị luận hợp lý.","items":[{"id":"a","text":"Chẳng hạn, khi làm sai phần việc nhóm, một học sinh chủ động nhận lỗi và sửa lại phần của mình."},{"id":"b","text":"Biết nhận lỗi là điều cần thiết để mỗi người tiến bộ."},{"id":"c","text":"Bởi khi thừa nhận sai sót, ta mới xác định được điều cần sửa và tránh lặp lại."},{"id":"d","text":"Tình huống ấy cho thấy nhận lỗi không làm con người yếu đi mà giúp họ có trách nhiệm hơn."}],"correct":["b","c","a","d"],"explain":"Nêu luận điểm, giải thích, đưa ví dụ, rồi phân tích ý nghĩa của ví dụ."},{"type":"write","title":"Viết luận điểm và lý do","prompt":"Với chủ đề “tính kiên trì”, hãy viết một luận điểm và một câu giải thích vì sao em cho rằng luận điểm ấy đúng.","minWords":18,"guide":"Luận điểm nên là một câu khẳng định rõ. Câu sau giải thích hệ quả hoặc lý do, không chỉ lặp lại câu đầu.","rubric":["Luận điểm rõ và đúng chủ đề","Lý lẽ giải thích được vì sao"],"model":"Kiên trì giúp con người tiến gần hơn đến mục tiêu. Bởi nhiều kỹ năng cần thời gian luyện tập, nên người không bỏ cuộc sau thất bại có cơ hội nhận ra lỗi và cải thiện từng bước."}]},
{id:'social-argument',phase:3,title:'Nghị luận xã hội: Xây dựng luận điểm',subtitle:'Thực hành khung lập luận qua chủ đề nhận lỗi',icon:'💬',duration:'20–30 phút',skill:'Nghị luận xã hội',steps:[
{type:'learn',title:'Đừng bắt đầu bằng văn mẫu',body:'Nghị luận xã hội là trình bày và bảo vệ một nhận định về vấn đề trong đời sống. Trước khi viết câu hay, cần biết mình muốn khẳng định điều gì và vì sao điều đó hợp lý.',bullets:['Vấn đề: đề bài yêu cầu bàn về điều gì?','Luận điểm: ý kiến chính mà em muốn bảo vệ.','Lý lẽ: lý do giải thích vì sao ý kiến ấy hợp lý.','Dẫn chứng: trường hợp cụ thể giúp làm sáng tỏ lý lẽ.','Phân tích: giải thích dẫn chứng chứng minh điều gì — không chỉ kể lại dẫn chứng.'],example:'Đề: “Ý nghĩa của sự kiên trì”. Luận điểm: Kiên trì giúp con người tiến bộ trước khó khăn. Lý lẽ: Kết quả thường cần thời gian luyện tập và sửa sai. Dẫn chứng: Một học sinh làm lại dạng toán còn yếu, ghi lỗi và luyện mỗi ngày. Phân tích: tiến bộ đến từ việc nhận lỗi và luyện tập đều đặn, không phải chỉ làm nhiều bài.'},
{type:'quiz',title:'Phân biệt luận điểm và dẫn chứng',question:'Trong các ý dưới đây, đâu là một luận điểm có thể dùng cho đề “Ý nghĩa của tinh thần trách nhiệm”?',options:['Bạn An đã nhận phần trực nhật của nhóm và hoàn thành đúng hạn.','Tinh thần trách nhiệm giúp tập thể tin tưởng và phối hợp với nhau tốt hơn.','Thứ sáu tuần trước, lớp em có buổi lao động.'],correct:1,explain:'Luận điểm là nhận định cần được lý giải. Ý về bạn An và buổi lao động là những chi tiết có thể dùng làm dẫn chứng.'},
{type:'quiz',title:'Chọn cách phân tích dẫn chứng',question:'Sau khi nêu ví dụ một học sinh kiên trì sửa lỗi viết văn, câu nào phân tích dẫn chứng tốt hơn?',options:['Đó là một học sinh rất chăm chỉ và ví dụ này rất hay.','Ví dụ này cho thấy việc ghi nhận lỗi và luyện tập có mục tiêu giúp học sinh cải thiện kỹ năng qua từng lần viết.','Em xin hết phần dẫn chứng.'],correct:1,explain:'Câu phân tích phải nối dẫn chứng với luận điểm, chỉ ra ví dụ chứng minh điều gì. Tránh khen dẫn chứng chung chung hoặc dừng ngay sau khi kể.'},
{type:'write',title:'Lập khung một đoạn nghị luận',prompt:'Đề: “Vì sao học sinh cần biết nhận lỗi?” Hãy viết 4 phần ngắn: luận điểm, lý lẽ, một dẫn chứng phù hợp và câu phân tích dẫn chứng.',minWords:30,guide:'Không cần viết hoa mỹ. Hãy trả lời lần lượt: Em khẳng định điều gì? Vì sao? Có ví dụ nào cụ thể? Ví dụ ấy chứng minh điều gì?',rubric:['Luận điểm trả lời đúng đề','Lý lẽ giải thích được luận điểm','Dẫn chứng cụ thể và phù hợp','Phân tích kết nối dẫn chứng với luận điểm'],model:'Luận điểm: Học sinh cần biết nhận lỗi để tiến bộ. Lý lẽ: Khi thừa nhận sai sót, mỗi người mới xác định được điều cần sửa. Dẫn chứng: Một học sinh nhận ra mình thường viết thiếu dẫn chứng nên kiểm tra lại từng đoạn sau mỗi bài. Phân tích: Việc nhìn thẳng vào lỗi giúp bạn ấy luyện đúng điểm yếu và cải thiện bài viết.'}
]},
{"id":"social-evidence","phase":3,"title":"Chọn dẫn chứng và phân tích dẫn chứng","subtitle":"Ví dụ phải liên quan, cụ thể và được giải thích","icon":"🧾","duration":"15–20 phút","skill":"Nghị luận xã hội","steps":[{"type":"learn","title":"Dẫn chứng không phải phần trang trí","body":"Một ví dụ chỉ hữu ích khi có liên quan trực tiếp đến luận điểm. Nếu không nhớ số liệu hoặc câu chuyện chính xác, không nên bịa tên người, sự kiện hay con số. Có thể dùng tình huống gần gũi ở trường/lớp, miễn là cụ thể và có phân tích.","bullets":["Liên quan: ví dụ minh họa trực tiếp cho ý kiến.","Cụ thể: ai làm gì, trong hoàn cảnh nào, kết quả ra sao.","Phân tích: giải thích ví dụ cho thấy điều gì về luận điểm.","Không phóng đại hoặc trình bày thông tin chưa kiểm chứng như sự thật."],"example":"Luận điểm về tinh thần hợp tác có thể dùng ví dụ một nhóm phân công rõ việc và hỗ trợ thành viên gặp khó khăn. Sau ví dụ, cần giải thích việc phân công và hỗ trợ giúp công việc chung tiến triển ra sao."},{"type":"quiz","title":"Chọn dẫn chứng mạnh hơn","question":"Đề bàn về tinh thần trách nhiệm. Ví dụ nào hữu ích hơn?","options":["Ai cũng biết trách nhiệm rất quan trọng.","Một học sinh nhận làm phần trình bày của nhóm, hoàn thành đúng hạn và báo sớm khi gặp khó khăn.","Có rất nhiều người trên thế giới có trách nhiệm."],"correct":1,"explain":"Ví dụ B cụ thể về hành động và cách ứng xử, giúp người đọc thấy tinh thần trách nhiệm biểu hiện ra sao."},{"type":"write","title":"Phân tích ví dụ","prompt":"Hãy dùng tình huống một bạn nhận lỗi vì làm mất đồ dùng chung rồi chủ động tìm cách thay thế để giải thích vì sao nhận lỗi thể hiện trách nhiệm.","minWords":22,"guide":"Đừng dừng ở câu “bạn ấy có trách nhiệm”. Nêu hành động, giải thích hành động cho thấy điều gì và kết nối với luận điểm.","rubric":["Nêu đúng tình huống","Giải thích ý nghĩa của hành động","Kết nối lại với luận điểm nhận lỗi/trách nhiệm"],"model":"Bạn chủ động nhận lỗi và tìm cách thay thế đồ dùng đã mất thay vì che giấu sự việc. Hành động ấy cho thấy bạn dám chịu trách nhiệm về hậu quả do mình gây ra và cố gắng khắc phục. Vì vậy, nhận lỗi đi cùng hành động sửa sai là một biểu hiện cụ thể của tinh thần trách nhiệm."}]},
{"id":"social-paragraph","phase":3,"title":"Viết đoạn nghị luận xã hội hoàn chỉnh","subtitle":"Từ câu chủ đề đến lý lẽ, dẫn chứng, phản đề và bài học","icon":"🖊️","duration":"20–30 phút","skill":"Nghị luận xã hội","steps":[{"type":"learn","title":"Khung đoạn có thể linh hoạt","body":"Đề thi có thể yêu cầu dung lượng và cách triển khai khác nhau. Hãy đọc yêu cầu trước; khung sau là điểm tựa, không phải công thức bắt buộc cho mọi đề.","bullets":["Mở đoạn: nêu thẳng vấn đề/quan điểm.","Giải thích: làm rõ khái niệm hoặc biểu hiện.","Bàn luận: nêu lý do, tác dụng/hậu quả và dẫn chứng phù hợp.","Mở rộng: có thể chỉ ra biểu hiện ngược lại hoặc giới hạn của vấn đề.","Kết đoạn: rút ra bài học nhận thức/hành động nếu phù hợp yêu cầu."],"example":"Với đề về sự trung thực, đừng chỉ viết “trung thực rất quan trọng”. Hãy giải thích trung thực là gì, nói vì sao nó tạo niềm tin, nêu tình huống cụ thể và rút ra hành động cần làm."},{"type":"quiz","title":"Đoạn còn thiếu gì?","question":"Một đoạn nêu “Lòng kiên trì rất quan trọng” rồi chỉ lặp lại câu ấy bằng các cách khác nhau. Phần nào cần bổ sung nhất?","options":["Thêm nhiều câu giống nhau để đoạn dài hơn.","Lý lẽ và ví dụ cụ thể giải thích vì sao kiên trì quan trọng.","Một câu không liên quan để chuyển chủ đề."],"correct":1,"explain":"Đoạn cần phát triển luận điểm bằng lý lẽ và ví dụ, không lặp lại cùng một nhận định."},{"type":"write","title":"Thực hành đoạn xã hội","prompt":"Viết đoạn khoảng 100–130 từ về ý nghĩa của việc biết nhận lỗi. Cần có quan điểm, lý lẽ, ví dụ/tình huống và bài học hoặc kết luận.","minWords":45,"guide":"Gợi ý thứ tự: nhận lỗi là gì → vì sao cần nhận lỗi → tình huống cụ thể → tình huống cho thấy điều gì → nên làm gì. Viết bằng lời của em.","rubric":["Đúng vấn đề, có quan điểm","Có giải thích/lý lẽ","Có ví dụ cụ thể và phân tích","Diễn đạt mạch lạc, có kết luận phù hợp"],"model":"Biết nhận lỗi là thái độ dám thừa nhận sai sót của bản thân thay vì đổ lỗi cho người khác. Điều này quan trọng vì chỉ khi nhìn nhận đúng lỗi, mỗi người mới biết mình cần sửa điều gì. Chẳng hạn, nếu làm chưa tốt phần việc nhóm, một học sinh chủ động xin lỗi và hoàn thành lại phần đó sẽ giúp cả nhóm tiếp tục công việc. Tình huống ấy cho thấy nhận lỗi cần đi kèm hành động khắc phục, chứ không chỉ là lời nói. Vì vậy, mỗi người nên bình tĩnh nhìn lại hành động của mình, nói thật và cố gắng không lặp lại sai sót."}]},
{id:'literature-analysis',phase:4,title:'Nghị luận văn học: Phân tích chi tiết',subtitle:'Từ dẫn chứng đến ý nghĩa, không chỉ kể lại',icon:'📖',duration:'20–30 phút',skill:'Nghị luận văn học',steps:[
{type:'learn',title:'Quan sát chi tiết rồi mới nhận xét',body:'Phân tích văn học cần có căn cứ trong văn bản. Em hãy xác định chi tiết nổi bật, xem chi tiết gợi lên điều gì và liên hệ nó với nhân vật, cảm xúc hoặc chủ đề.',bullets:['Nhận xét: em muốn khẳng định điều gì về nhân vật, hình ảnh hoặc cảm xúc?','Dẫn chứng: từ ngữ, hành động, hình ảnh cụ thể trong văn bản.','Phân tích: vì sao chi tiết đó gợi ra nhận xét của em?','Đánh giá: chi tiết góp phần thể hiện chủ đề hoặc làm nổi bật điều gì?'],example:'Đoạn văn minh họa do bài học tự tạo: “Trước cánh cửa lớp, Linh nắm chặt tờ giấy điểm. Em định bước vào rồi lại dừng, khẽ vuốt phẳng góc giấy đã nhàu.” Chi tiết tờ giấy bị vò nhàu và động tác vuốt phẳng có thể gợi tâm trạng lo lắng, do dự. Đây là một cách đọc có căn cứ, nhưng cần xem thêm ngữ cảnh để khẳng định sâu hơn.'},
{type:'quiz',title:'Chọn nhận xét có căn cứ',question:'Từ chi tiết “Linh định bước vào rồi lại dừng”, nhận xét nào thận trọng và có căn cứ nhất?',options:['Linh chắc chắn ghét tất cả các bạn trong lớp.','Linh có vẻ do dự hoặc lo lắng trước khi vào lớp.','Linh luôn là học sinh đứng đầu trường.'],correct:1,explain:'Hành động dừng lại gợi sự do dự, nhưng chưa đủ để kết luận nguyên nhân cụ thể hay thành tích học tập của Linh.'},
{type:'quiz',title:'Phân tích thay vì kể lại',question:'Sau khi dẫn chi tiết “khẽ vuốt phẳng góc giấy đã nhàu”, câu nào có tính phân tích hơn?',options:['Linh cầm tờ giấy và vuốt tờ giấy.','Động tác nhỏ ấy gợi sự bất an của Linh, đồng thời cho thấy em đang cố lấy lại bình tĩnh trước khi đối diện với kết quả.','Tờ giấy có một góc bị nhàu.'],correct:1,explain:'Câu phân tích giải thích ý nghĩa của chi tiết và liên hệ với tâm trạng nhân vật. Câu chỉ kể lại hành động hoặc lặp chi tiết chưa đi sâu vào ý nghĩa.'},
{type:'write',title:'Viết đoạn phân tích có dẫn chứng',prompt:'Dựa vào đoạn văn minh họa trong bài, viết 4–6 câu phân tích tâm trạng của Linh. Phải trích ít nhất một chi tiết và giải thích ý nghĩa của chi tiết đó.',minWords:35,guide:'Cấu trúc gợi ý: Nhận xét về tâm trạng → dẫn chứng cụ thể → giải thích chi tiết gợi điều gì → nhận xét khái quát. Đây là khung tư duy, không phải đoạn văn để chép.',rubric:['Nêu được nhận xét về tâm trạng','Dẫn chứng đúng chi tiết','Giải thích ý nghĩa thay vì kể lại','Kết luận phù hợp với bằng chứng'],model:'Linh có vẻ đang lo lắng và do dự trước khi bước vào lớp. Điều đó được gợi ra qua chi tiết em “định bước vào rồi lại dừng”. Đặc biệt, động tác “khẽ vuốt phẳng góc giấy đã nhàu” cho thấy Linh chú ý đến tờ giấy điểm và có thể đang cố trấn tĩnh bản thân. Những cử chỉ nhỏ khiến tâm trạng nhân vật hiện lên tự nhiên mà không cần tác giả trực tiếp gọi tên cảm xúc.'}
]},
{"id":"poetry-analysis","phase":4,"title":"Phân tích thơ: từ từ ngữ đến chủ đề","subtitle":"Không chỉ kể lại bài thơ; cần giải thích nghệ thuật và cảm xúc","icon":"🌙","duration":"20–25 phút","skill":"Nghị luận văn học","steps":[{"type":"learn","title":"Một đoạn phân tích thơ cần có căn cứ","body":"Khi phân tích thơ, hãy đi từ hình ảnh hoặc từ ngữ cụ thể đến cảm xúc và chủ đề. Tránh kể lại từng dòng hoặc đưa nhận xét chung chung như “bài thơ rất hay, rất sâu sắc”.","bullets":["Nêu nhận xét: hình ảnh/giọng điệu thể hiện điều gì?","Dẫn chứng: nhắc đúng từ ngữ hoặc hình ảnh trong văn bản.","Phân tích: giải thích cách từ ngữ tạo cảm xúc, hình ảnh hoặc ý nghĩa.","Liên hệ: kết nối với cảm xúc/chủ đề của đoạn thơ; không gán nghĩa thiếu căn cứ."],"example":"Một hình ảnh “bàn tay chai sần” có thể gợi sự lao động vất vả. Nếu đặt trong bài thơ về người mẹ, hình ảnh còn có thể góp phần thể hiện lòng biết ơn; cần chứng minh bằng ngữ cảnh."},{"type":"quiz","title":"Chọn câu phân tích","question":"Với hình ảnh “đôi vai bạc màu sương gió”, câu nào có tính phân tích hơn?","options":["Hình ảnh này rất hay và gây xúc động.","Cụm “bạc màu sương gió” gợi dấu vết của thời gian và vất vả, qua đó làm nổi bật sự hi sinh của nhân vật trong ngữ cảnh bài thơ.","Tác giả dùng hình ảnh này vì tất cả mọi người đều già."],"correct":1,"explain":"Câu B chỉ ra từ ngữ cụ thể, giải thích ý nghĩa rồi liên hệ với nhận xét. Cần đối chiếu ngữ cảnh thực tế của bài thơ khi làm bài."},{"type":"write","title":"Viết đoạn phân tích thơ","prompt":"Chọn một hình ảnh trong bài thơ em đã học. Viết khoảng 4–5 câu theo trình tự: nhận xét – dẫn chứng – phân tích từ ngữ – liên hệ chủ đề/cảm xúc.","minWords":35,"guide":"Đừng kể lại toàn bài. Mỗi câu cần làm một việc: nêu nhận xét, đưa chi tiết, giải thích chi tiết và kết nối với nội dung.","rubric":["Có nhận xét rõ ràng","Có dẫn chứng sát văn bản","Phân tích từ ngữ/hình ảnh cụ thể","Liên hệ hợp lý với cảm xúc/chủ đề"],"model":"Hình ảnh … góp phần thể hiện … Điều này được gợi ra qua từ ngữ …, vốn nhấn mạnh … Hình ảnh không chỉ giúp người đọc hình dung … mà còn gợi cảm xúc … Qua đó, đoạn thơ làm nổi bật …"}]},
{"id":"prose-analysis","phase":4,"title":"Phân tích truyện: nhân vật, tình huống và chi tiết","subtitle":"Dùng hành động/lời nói để giải thích phẩm chất, không gắn nhãn suông","icon":"📖","duration":"20–25 phút","skill":"Nghị luận văn học","steps":[{"type":"learn","title":"Đọc nhân vật qua bằng chứng","body":"Nhân vật không chỉ được hiểu qua một tính từ. Hãy quan sát hành động, lời nói, suy nghĩ, lựa chọn và sự thay đổi trong tình huống. Một chi tiết có thể gợi nhiều lớp nghĩa nhưng phải giải thích bằng ngữ cảnh.","bullets":["Tình huống truyện: hoàn cảnh làm nhân vật phải lựa chọn hoặc bộc lộ điều gì đó.","Chi tiết: hành động, lời nói, đồ vật hoặc sự việc có ý nghĩa trong mạch truyện.","Phẩm chất/tâm trạng phải được suy ra từ bằng chứng, không đoán tùy ý.","Có thể phân tích sự thay đổi của nhân vật trước và sau một sự việc."],"example":"Thay vì viết “nhân vật rất dũng cảm”, hãy nêu việc nhân vật dám đứng ra nhận trách nhiệm khi mọi người im lặng, rồi giải thích lựa chọn ấy cho thấy điều gì."},{"type":"quiz","title":"Chọn nhận xét có căn cứ","question":"Một nhân vật thú nhận mình làm vỡ món đồ và đề nghị sửa lại dù có thể không ai biết. Nhận xét nào phù hợp nhất?","options":["Nhân vật luôn hoàn hảo và không bao giờ mắc lỗi.","Hành động thú nhận và khắc phục gợi sự trung thực, có trách nhiệm.","Nhân vật không thích đồ vật."],"correct":1,"explain":"Nhận xét B gắn phẩm chất với hai hành động cụ thể. Không nên suy rộng thành “luôn hoàn hảo”."},{"type":"write","title":"Viết phân tích một chi tiết truyện","prompt":"Tình huống: “Sau khi gây hiểu lầm, nhân vật chủ động quay lại xin lỗi và giải thích sự thật.” Viết 3–4 câu phân tích chi tiết này có thể góp phần khắc họa nhân vật như thế nào.","minWords":25,"guide":"Nêu chi tiết, giải thích lựa chọn của nhân vật và kết luận về phẩm chất hoặc sự thay đổi. Dùng “gợi”, “cho thấy” thay vì khẳng định quá rộng.","rubric":["Nhắc đúng chi tiết","Giải thích ý nghĩa hành động","Kết luận hợp lý về nhân vật"],"model":"Việc chủ động quay lại xin lỗi cho thấy nhân vật không né tránh hậu quả của hành động mình gây ra. Việc giải thích sự thật còn thể hiện mong muốn sửa chữa hiểu lầm. Qua chi tiết này, nhân vật có thể được khắc họa là người biết nhận trách nhiệm và trưởng thành hơn sau sai sót."}]},
{"id":"literary-paragraph","phase":4,"title":"Viết đoạn nghị luận văn học có chiều sâu","subtitle":"Nhận xét, dẫn chứng, phân tích và đánh giá nghệ thuật","icon":"✒️","duration":"20–30 phút","skill":"Nghị luận văn học","steps":[{"type":"learn","title":"Đừng biến phân tích thành kể lại","body":"Kể lại cho biết chuyện gì xảy ra; phân tích phải trả lời chi tiết đó có ý nghĩa gì và được thể hiện bằng cách nào. Một đoạn tốt thường xoay quanh một nhận xét chính và dùng một vài dẫn chứng phù hợp để làm rõ.","bullets":["Câu đầu nêu nhận xét về nhân vật, hình ảnh hoặc nội dung.","Chọn dẫn chứng tiêu biểu, không cần chép quá dài.","Giải thích từ ngữ/hành động/chi tiết chứng minh nhận xét.","Kết nối chi tiết với chủ đề hoặc cách tác giả khắc họa; chỉ nhận xét nghệ thuật khi có căn cứ."],"example":"Kể lại: nhân vật thấy bạn khóc rồi đưa khăn giấy. Phân tích: hành động nhỏ ấy thể hiện sự tinh tế vì nhân vật nhận ra cảm xúc của bạn và giúp đỡ mà không khiến bạn xấu hổ."},{"type":"quiz","title":"Phân biệt kể và phân tích","question":"Câu nào là phân tích chứ không chỉ kể lại?","options":["Nhân vật mở cửa, bước vào phòng rồi đặt chiếc túi xuống.","Việc nhân vật đặt chiếc túi xuống thật nhẹ có thể gợi sự dè dặt; cần đặt chi tiết vào ngữ cảnh để hiểu tâm trạng.","Sau đó, nhân vật đi ra ngoài."],"correct":1,"explain":"Câu B giải thích chi tiết và nêu ý nghĩa có điều kiện, thay vì chỉ liệt kê hành động."},{"type":"write","title":"Viết một đoạn phân tích","prompt":"Chọn một nhân vật hoặc chi tiết trong tác phẩm em đang học, viết 4–6 câu: nêu nhận xét, dẫn chứng, phân tích và liên hệ nội dung.","minWords":40,"guide":"Nếu không nhớ chính xác câu chữ, hãy nêu đúng chi tiết/sự việc thay vì đặt trong ngoặc kép một câu không chắc chắn.","rubric":["Nhận xét bám sát tác phẩm","Dẫn chứng đúng và liên quan","Có giải thích ý nghĩa, không chỉ kể","Diễn đạt rõ, kết nối với chủ đề"],"model":"Qua chi tiết …, nhân vật hiện lên là người … Hành động/lời nói … cho thấy … bởi … Chi tiết này không chỉ làm rõ tính cách nhân vật mà còn góp phần thể hiện … của tác phẩm."}]},
{id:'full-essay',phase:5,title:'Từ đoạn văn đến bài văn hoàn chỉnh',subtitle:'Lập dàn ý, liên kết và tự kiểm tra',icon:'🧩',duration:'25–35 phút',skill:'Bố cục bài viết',steps:[
{type:'learn',title:'Bài văn là một chuỗi luận điểm',body:'Một bài văn hoàn chỉnh không đơn giản là ghép nhiều đoạn văn rời rạc. Mỗi phần cần có nhiệm vụ riêng và cùng phục vụ cho yêu cầu của đề.',bullets:['Mở bài: giới thiệu đúng vấn đề hoặc tác phẩm, tránh dài dòng.','Thân bài: triển khai các luận điểm theo trình tự hợp lý; mỗi đoạn tập trung làm rõ một ý.','Kết bài: khái quát lại nhận định hoặc ý nghĩa, không mở sang vấn đề hoàn toàn mới.','Sau khi viết: kiểm tra yêu cầu đề, sự trùng lặp, dẫn chứng và diễn đạt.'],example:'Trước khi viết, hãy thử nói mỗi đoạn thân bài trong một câu. Nếu hai đoạn nói cùng một ý, cần gộp hoặc phân biệt lại. Nếu có đoạn không phục vụ câu hỏi của đề, hãy cân nhắc bỏ hoặc viết lại.'},
{type:'quiz',title:'Chọn dàn ý phù hợp',question:'Đề: “Trình bày suy nghĩ về vai trò của sự trung thực”. Trình tự nào hợp lý nhất?',options:['Kể một câu chuyện dài → nói về trường học → kết bài.','Giải thích trung thực → nêu ý nghĩa bằng lý lẽ và dẫn chứng → bàn về biểu hiện trái ngược hoặc giới hạn phù hợp → rút ra bài học.','Viết kết bài trước → chép một câu danh ngôn → lặp lại đề bài.'],correct:1,explain:'Trình tự này đi từ làm rõ khái niệm đến phân tích, mở rộng và liên hệ. Các phần cần được điều chỉnh theo yêu cầu cụ thể của đề.'},
{type:'write',title:'Tạo dàn ý trước khi viết',prompt:'Lập dàn ý ngắn cho đề “Vai trò của tính tự giác trong học tập”. Hãy ghi một ý cho mở bài, ít nhất hai luận điểm thân bài kèm lý lẽ hoặc ví dụ và một ý kết bài.',minWords:35,guide:'Chưa cần viết thành bài hoàn chỉnh. Trước tiên hãy bảo đảm mỗi luận điểm mang một ý riêng, có thể giải thích bằng lý lẽ hoặc minh họa bằng ví dụ.',rubric:['Mở bài giới thiệu đúng vấn đề','Có ít nhất hai luận điểm khác nhau','Có lý lẽ hoặc ví dụ để phát triển ý','Kết bài phù hợp với vấn đề'],model:'Mở bài: Tự giác là phẩm chất cần thiết trong học tập. Luận điểm 1: Tự giác giúp học sinh chủ động tiếp thu kiến thức vì các em không phải luôn chờ người khác nhắc nhở. Ví dụ: tự ôn bài và ghi lại câu hỏi sau giờ học. Luận điểm 2: Tự giác rèn tính kỷ luật và trách nhiệm, có ích cả khi học lẫn khi làm việc nhóm. Kết bài: Mỗi học sinh nên bắt đầu từ những việc nhỏ và duy trì đều đặn.'}
]},
{"id":"revision-skills","phase":5,"title":"Tự sửa bài: lỗi thường gặp và cách chữa","subtitle":"Kiểm tra đúng đề, đủ ý, dẫn chứng, liên kết và diễn đạt","icon":"🛠️","duration":"15–20 phút","skill":"Chỉnh sửa","steps":[{"type":"learn","title":"Sửa bài theo từng lượt","body":"Đọc lại tất cả cùng lúc dễ bỏ sót lỗi. Hãy tự kiểm tra theo lượt: nội dung có đúng đề không, ý có phát triển không, bằng chứng có đúng không, câu có rõ không và dấu câu có hợp lý không.","bullets":["Lượt 1 – đúng đề: mọi đoạn có phục vụ yêu cầu không?","Lượt 2 – đủ ý: có luận điểm, giải thích, bằng chứng và phân tích khi cần không?","Lượt 3 – liên kết: trình tự ý có hợp lý, có câu lạc chủ đề không?","Lượt 4 – tiếng Việt: sửa câu dài, lặp từ, thiếu chủ-vị và lỗi dấu câu."],"example":"Nếu đề yêu cầu phân tích hình ảnh mà bài chỉ kể lại nội dung, cần bổ sung phần giải thích tác dụng của hình ảnh; sửa dấu phẩy chưa giải quyết được lỗi chính này."},{"type":"quiz","title":"Ưu tiên sửa lỗi nào?","question":"Đề yêu cầu phân tích nhân vật, nhưng bài chỉ kể lại toàn bộ cốt truyện. Em nên sửa điều gì trước?","options":["Thay một vài từ đơn giản bằng từ hoa mỹ.","Bổ sung nhận xét về nhân vật và phân tích các chi tiết có căn cứ.","Viết dài thêm bằng cách kể lại cốt truyện lần nữa."],"correct":1,"explain":"Lỗi lớn nhất là chưa đáp ứng yêu cầu phân tích. Cần sửa nội dung và lập luận trước khi làm đẹp câu chữ."},{"type":"write","title":"Tự đánh giá một đoạn","prompt":"Viết một câu trả lời theo mẫu: “Bài của em đã làm tốt…; em cần bổ sung…; lần sau em sẽ…”. Chọn tiêu chí thật cụ thể.","minWords":15,"guide":"Đừng tự nhận xét chung chung “em viết chưa tốt”. Hãy nói rõ thiếu dẫn chứng, giải thích chưa sâu, sai yêu cầu hay câu chưa rõ.","rubric":["Nêu một điểm làm được","Nêu một điểm cần sửa cụ thể","Đặt hành động cải thiện thực tế"],"model":"Bài của em đã nêu đúng luận điểm. Em cần bổ sung ví dụ và giải thích ví dụ chứng minh điều gì. Lần sau em sẽ kiểm tra từng luận điểm xem đã có lý lẽ và bằng chứng chưa."}]},
{"id":"exam-reading","phase":5,"title":"Luyện dạng câu hỏi đọc hiểu vào lớp 10","subtitle":"Nhận biết thông tin, giải thích, tu từ, thông điệp và liên hệ","icon":"🎯","duration":"20–25 phút","skill":"Ôn thi vào 10","steps":[{"type":"learn","title":"Bộ dạng câu hỏi cần luyện","body":"Cấu trúc đề có thể khác theo địa phương và năm thi, nhưng nhiều đề yêu cầu đọc văn bản rồi trả lời câu hỏi từ nhận biết đến giải thích, phân tích và liên hệ. Luôn ưu tiên câu chữ cụ thể của đề, không áp một công thức cho mọi câu.","bullets":["Nhận biết: tìm thông tin/chi tiết có sẵn trong văn bản.","Giải thích: nêu lý do hoặc ý nghĩa dựa trên căn cứ.","Biện pháp tu từ: gọi đúng dấu hiệu và nêu tác dụng cụ thể trong ngữ cảnh.","Thông điệp: nêu một bài học/ý nghĩa và giải thích vì sao phù hợp.","Liên hệ: đưa trải nghiệm/ý kiến ngắn, đúng vấn đề và không đi quá xa văn bản."],"example":"Nếu câu hỏi yêu cầu “nêu thông điệp”, hãy phát biểu thông điệp rõ ràng rồi giải thích bằng chi tiết trong văn bản. Đừng chỉ viết “bài học rất sâu sắc”."},{"type":"quiz","title":"Đáp ứng đúng dạng hỏi","question":"Đề hỏi: “Từ văn bản, em rút ra thông điệp gì? Giải thích.” Cách trả lời nào đủ hướng nhất?","options":["Chỉ ghi: “Em rút ra một thông điệp rất hay.”","Nêu một thông điệp cụ thể, sau đó liên hệ một chi tiết trong văn bản để giải thích.","Kể lại toàn bộ văn bản mà không nêu thông điệp."],"correct":1,"explain":"Câu trả lời phải nêu thông điệp và giải thích nó dựa trên văn bản, không chỉ khen hay kể lại."},{"type":"write","title":"Trả lời câu hỏi thông điệp","prompt":"Đọc tình huống: “Một người bạn nhiều lần mắc lỗi khi tập đàn nhưng vẫn luyện từng ngày, hỏi thầy cách sửa và cuối cùng biểu diễn thành công.” Hãy nêu một thông điệp và giải thích trong 2–3 câu.","minWords":20,"guide":"Thông điệp có thể liên quan đến kiên trì, tiếp nhận góp ý hoặc học từ sai sót. Dẫn hành động trong tình huống làm căn cứ.","rubric":["Thông điệp rõ ràng","Giải thích gắn với hành động trong tình huống","Diễn đạt ngắn gọn, không thêm chi tiết"],"model":"Thông điệp là cần kiên trì và biết tiếp nhận góp ý để tiến bộ. Người bạn không bỏ cuộc sau những lần mắc lỗi mà hỏi cách sửa và luyện tập hằng ngày. Điều đó cho thấy tiến bộ thường đến từ việc nhận ra lỗi và kiên trì khắc phục."}]},
{"id":"exam-social","phase":5,"title":"Luyện đề nghị luận xã hội vào lớp 10","subtitle":"Phân tích đề, lập dàn ý ngắn, viết đúng dung lượng và tự kiểm tra","icon":"🧠","duration":"25–35 phút","skill":"Ôn thi vào 10","steps":[{"type":"learn","title":"Đọc kỹ dung lượng và yêu cầu","body":"Không có một số từ duy nhất áp dụng cho mọi đề thi. Hãy làm theo đúng đề và hướng dẫn thi của địa phương/năm thi. Khi đề yêu cầu đoạn văn, tập trung một đoạn thống nhất; khi yêu cầu bài văn, phát triển các luận điểm thành phần rõ ràng.","bullets":["Gạch chân vấn đề cần bàn và yêu cầu cụ thể.","Chọn quan điểm rõ ràng; tránh mở bài quá dài.","Chuẩn bị lý lẽ và một ví dụ đáng tin, rồi phân tích ví dụ.","Rà soát xem bài có giải thích, bàn luận và kết luận/bài học phù hợp hay chưa."],"example":"Với đề về lòng biết ơn, không chỉ viết “biết ơn là đức tính tốt”. Hãy chỉ ra vì sao biết ơn giúp ta trân trọng sự giúp đỡ và thể hiện bằng hành động nào trong đời sống."},{"type":"order","title":"Lập dàn ý nhanh","question":"Sắp xếp các ý cho một đoạn về tính trung thực.","items":[{"id":"a","text":"Kết lại bằng việc mỗi người cần nói thật và sửa sai nếu mắc lỗi."},{"id":"b","text":"Giải thích trung thực là tôn trọng sự thật và không che giấu sai sót."},{"id":"c","text":"Nêu luận điểm: trung thực giúp xây dựng niềm tin."},{"id":"d","text":"Đưa ví dụ một học sinh nhận lỗi và chủ động khắc phục."}],"correct":["c","b","d","a"],"explain":"Một dàn ý hợp lý đi từ luận điểm đến giải thích, ví dụ rồi kết luận/hành động."},{"type":"write","title":"Viết đoạn theo dạng đề thi","prompt":"Viết đoạn nghị luận xã hội khoảng 120–150 từ về ý nghĩa của tinh thần tự học. Hãy có luận điểm, lý lẽ, ví dụ và kết luận. Nếu địa phương của em quy định dung lượng khác, hãy ưu tiên đúng yêu cầu của đề luyện.","minWords":50,"guide":"Gợi ý: tự học là gì → vì sao quan trọng → ví dụ gần gũi → ví dụ cho thấy điều gì → hành động có thể bắt đầu từ hôm nay.","rubric":["Đúng trọng tâm tinh thần tự học","Có luận điểm và giải thích rõ","Có ví dụ và phân tích","Đoạn mạch lạc, đúng dung lượng tương đối"],"model":"Tinh thần tự học giúp mỗi người chủ động mở rộng kiến thức thay vì chỉ chờ người khác nhắc nhở. Khi tự đọc trước bài, làm lại câu sai và ghi những điều chưa hiểu, học sinh biết rõ mình còn thiếu gì. Chẳng hạn, một bạn dành ít phút sau mỗi buổi học để tự làm lại bài tập sẽ dễ nhận ra phần kiến thức chưa vững và hỏi đúng điều cần hỏi. Ví dụ ấy cho thấy tự học không nhất thiết là học hàng giờ liền mà bắt đầu từ thói quen đều đặn. Vì vậy, mỗi học sinh nên đặt mục tiêu nhỏ và tự kiểm tra tiến bộ của mình."}]},
{"id":"exam-literature","phase":5,"title":"Luyện đề nghị luận văn học vào lớp 10","subtitle":"Đọc đúng tác phẩm, chọn dẫn chứng và viết phân tích thay vì kể lại","icon":"📚","duration":"25–35 phút","skill":"Ôn thi vào 10","steps":[{"type":"learn","title":"Phân tích theo câu hỏi trọng tâm","body":"Đề nghị luận văn học có thể yêu cầu phân tích nhân vật, đoạn thơ, chủ đề hoặc nét đặc sắc nghệ thuật. Đầu tiên xác định đối tượng và phạm vi; sau đó xây dựng các luận điểm hỗ trợ nhận định chính. Chỉ sử dụng dẫn chứng em nhớ chính xác.","bullets":["Đọc kỹ đối tượng: nhân vật nào, đoạn thơ nào, yêu cầu tập trung vào điều gì?","Lập 2–3 luận điểm chính, mỗi luận điểm gắn với dẫn chứng.","Sau dẫn chứng phải có phân tích: chi tiết cho thấy điều gì, được thể hiện bằng cách nào?","Kết nối các luận điểm với chủ đề/giá trị của tác phẩm; không khẳng định điều ngoài văn bản."],"example":"Với đề phân tích nhân vật, một luận điểm có thể nói về trách nhiệm. Sau đó chọn hành động/lời nói làm bằng chứng, giải thích hành động ấy thể hiện trách nhiệm ra sao."},{"type":"quiz","title":"Phát hiện lỗi lệch đề","question":"Đề yêu cầu phân tích diễn biến tâm trạng nhân vật, nhưng bài chủ yếu kể lại sự việc. Bài cần bổ sung gì?","options":["Những nhận xét về từng trạng thái tâm lý, có dẫn chứng và giải thích sự thay đổi.","Thêm nhiều sự việc phụ không liên quan.","Kết luận rằng tác phẩm hay mà không giải thích."],"correct":0,"explain":"Muốn phân tích diễn biến tâm trạng phải chỉ ra tâm trạng ở các thời điểm và căn cứ cho sự thay đổi ấy."},{"type":"write","title":"Lập dàn ý phân tích","prompt":"Chọn một nhân vật hoặc đoạn thơ em đang học. Viết một nhận xét trung tâm và hai luận điểm nhỏ kèm loại dẫn chứng em định dùng.","minWords":25,"guide":"Chưa cần viết thành bài hoàn chỉnh. Mỗi luận điểm cần trả lời một khía cạnh khác nhau của nhận xét trung tâm.","rubric":["Nhận xét trung tâm đúng phạm vi","Hai luận điểm khác nhau và hỗ trợ nhận xét","Dẫn chứng dự kiến cụ thể, đúng tác phẩm"],"model":"Nhận xét trung tâm: nhân vật dần trưởng thành sau sai lầm. Luận điểm 1: ban đầu nhân vật né tránh; dẫn chứng là lời nói/hành động cho thấy sự do dự. Luận điểm 2: sau đó nhân vật nhận trách nhiệm; dẫn chứng là hành động khắc phục. Qua sự thay đổi này, tác phẩm làm nổi bật quá trình trưởng thành."}]},
