const phases=[{n:1,title:'Lấy lại gốc Ngữ văn',desc:'Hiểu đề, đọc văn bản, tiếng Việt, phương thức biểu đạt và biện pháp tu từ',icon:'🌱'},{n:2,title:'Đọc hiểu và diễn đạt',desc:'Đọc thơ/truyện, tóm tắt, trả lời câu hỏi và viết câu/đoạn rõ ý',icon:'✍️'},{n:3,title:'Nghị luận xã hội',desc:'Tìm luận điểm, giải thích, chọn và phân tích dẫn chứng, viết đoạn',icon:'💬'},{n:4,title:'Nghị luận văn học',desc:'Phân tích thơ, truyện, nhân vật, chi tiết và chủ đề',icon:'📚'},{n:5,title:'Ôn thi vào lớp 10',desc:'Luyện dạng câu hỏi, viết theo đề, tự sửa và làm bài tổng hợp',icon:'🎯'}];
const defaultState={answers:{},progress:{},attempts:{},submissions:[],examHistory:[],examSession:null,profile:null,role:'student',screen:'home',lessonId:null,step:0,mode:'demo',settings:{}};
let state=loadState();let toastTimer;let authMsg='';
function normalName(name){return String(name||'').trim().replace(/\s+/g,' ').toLocaleLowerCase('vi-VN')}
function localKey(name){return LOCAL_PREFIX+encodeURIComponent(normalName(name))}
function ensureStudentId(){if(state.profile){if(!state.profile.student_id)state.profile.student_id=(crypto.randomUUID?crypto.randomUUID():('vm-'+Date.now()+'-'+Math.random().toString(36).slice(2)));return state.profile.student_id}return ''}
function loadState(){let s;try{s={...structuredClone(defaultState),...JSON.parse(localStorage.getItem(APP_KEY)||'{}')}}catch{s=structuredClone(defaultState)};if(s.profile&&s.profile.display_name){try{const named=JSON.parse(localStorage.getItem(localKey(s.profile.display_name))||'null');if(named)s={...structuredClone(defaultState),...named}}catch{}};return s}
function persist(){try{const snapshot=JSON.stringify(state);localStorage.setItem(APP_KEY,snapshot);if(state.profile?.display_name&&state.role!=='admin')localStorage.setItem(localKey(state.profile.display_name),snapshot)}catch(e){console.warn('Không thể lưu tiến độ trong trình duyệt',e)}if(!cloudLoading&&state.profile?.display_name&&state.role!=='admin'&&CONFIG.syncEndpoint)scheduleCloudSave()}
function savedLocalLearners(){const out=[];try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(!k||!k.startsWith(LOCAL_PREFIX))continue;try{const s=JSON.parse(localStorage.getItem(k)||'{}');if(s.profile?.display_name)out.push(s)}catch{}}}catch{}return out}
function scheduleCloudSave(){clearTimeout(cloudTimer);cloudTimer=setTimeout(()=>cloudRequest({action:'save',id:ensureStudentId(),name:userName(),payload:cloudPayload()}).then(()=>{const el=document.getElementById('saveStatus');if(el)el.textContent='Đã gửi yêu cầu lưu lên Google Sheets; cần kiểm tra bảng tính để xác nhận'}).catch(()=>{const el=document.getElementById('saveStatus');if(el)el.textContent='Đã lưu trên thiết bị; gửi lên Google Sheets chưa thành công'}),650)}
function cloudPayload(){return {answers:state.answers,progress:state.progress,submissions:state.submissions,examHistory:state.examHistory||[],screen:'home',lessonId:state.lessonId,step:state.step}}
function cloudRequest(body){if(!CONFIG.syncEndpoint) return Promise.reject(new Error('Chưa cấu hình lưu trực tuyến'));if(body.action==='save'){return fetch(CONFIG.syncEndpoint,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)}).then(()=>({ok:true,queued:true}));}if(body.action==='list')return new Promise((resolve,reject)=>{const callback='__vanMinhList_'+Date.now()+'_'+Math.random().toString(36).slice(2);const script=document.createElement('script');const timer=setTimeout(()=>{cleanup();reject(new Error('Quá thời gian tải dữ liệu. Hãy thử làm mới và kiểm tra mã theo dõi.'))},15000);function cleanup(){clearTimeout(timer);delete window[callback];script.remove()}window[callback]=data=>{cleanup();if(!data||data.ok!==true)reject(new Error(data?.error||'Không tải được dữ liệu phụ huynh.'));else resolve(data)};script.onerror=()=>{cleanup();reject(new Error('Không kết nối được Google Sheets. Kiểm tra URL Web app và quyền truy cập.'))};script.src=CONFIG.syncEndpoint+(CONFIG.syncEndpoint.includes('?')?'&':'?')+'action=list&pin='+encodeURIComponent(body.pin||'')+'&callback='+encodeURIComponent(callback)+'&_='+Date.now();document.head.appendChild(script)});return Promise.reject(new Error('Yêu cầu không được hỗ trợ.'))}
function activateStudent(name){name=String(name||'').trim().replace(/\s+/g,' ');if(name.length<2){authMsg='Hãy nhập tên có ít nhất 2 ký tự.';render();return}if(state.profile?.display_name)persist();let next=null;try{next=JSON.parse(localStorage.getItem(localKey(name))||'null')}catch{};state={...structuredClone(defaultState),...(next||{}),profile:{...(next?.profile||{}),display_name:name,student_id:next?.profile?.student_id||''},role:'student',mode:'demo',screen:'home'};ensureStudentId();parentResults=null;persist();render()}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function words(s){return (s.trim().match(/\S+/g)||[]).length}
function showToast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.remove('hide');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.add('hide'),3500)}
function pct(x,y){return y?Math.round(x/y*100):0}
function getProg(id){return state.progress[id]||{step:0,started:false,completed:false,score:0,total:0,best:0,attempts:0,updated:null}}
function userName(){return state.profile?.display_name||state.profile?.email?.split('@')[0]||(state.role==='admin'?'Người theo dõi':'Người học')}
function admin(){return state.role==='admin'}
function getAllStudents(){return state.mode==='demo'?[{id:'demo-student',display_name:'Em học sinh (dữ liệu mẫu)',email:'hoc.sinh@example.com',role:'student'}]:[]}
function avgScore(prog){const p=Object.values(prog);const a=p.filter(x=>x.total);return a.length?Math.round(a.reduce((s,x)=>s+(x.score/x.total*100),0)/a.length):0}
function allProgress(){return lessons.map(l=>({lesson:l,prog:getProg(l.id)}))}
function header(){return `<header class="topbar"><div class="brand"><div class="logo">文</div><span>Văn Mình</span></div><div class="top-actions"><span class="pill">${CONFIG.syncEndpoint?'☁ Lưu trực tuyến':'◉ Lưu tự động'}</span>${state.profile?`<span class="app-mode-label">${esc(userName())}</span><button class="btn ghost small" id="changeNameBtn">Đổi tên</button>`:''}</div></header>`}
function nav(){return `<aside class="sidebar"><div class="who"><small>Khu vực học tập</small><strong>${esc(userName())}</strong></div><button class="nav-btn ${state.screen==='home'?'active':''}" data-screen="home"><span class="ico">⌂</span>Tổng quan</button><button class="nav-btn ${state.screen==='curriculum'?'active':''}" data-screen="curriculum"><span class="ico">▤</span>Lộ trình học</button><button class="nav-btn ${state.screen==='progress'?'active':''}" data-screen="progress"><span class="ico">◷</span>Kết quả học tập</button><button class="nav-btn ${state.screen==='settings'?'active':''}" data-screen="settings"><span class="ico">⚙</span>Lưu tiến độ & hướng dẫn</button><div class="sidebar-note">Học từng bước nhỏ. Mỗi lần làm bài là một cơ hội tiến bộ.<div style="margin-top:12px"><a href="?mode=parent" style="color:inherit;font-weight:750">Dành cho người theo dõi →</a></div></div></aside>`}
function pageTop(eyebrow,title,desc=''){return `<div class="eyebrow">${esc(eyebrow)}</div><h1 class="page-title">${esc(title)}</h1>${desc?`<p class="lead">${esc(desc)}</p>`:''}`}
function lessonUnlocked(l){const i=lessons.findIndex(x=>x.id===l.id);return i===0||lessons.slice(0,i).every(x=>getProg(x.id).completed)}
function lessonCard(l){const p=getProg(l.id),unlocked=lessonUnlocked(l);const prog=p.completed?100:p.started?pct(Math.min(p.step+1,l.steps.length),l.steps.length):0;return `<article class="card lesson-card ${unlocked?'':'locked-card'}"><div class="lesson-top"><div class="lesson-icon">${unlocked?l.icon:'🔒'}</div><span class="tag ${p.completed?'done':p.started?'warm':''}">${p.completed?'Đã hoàn thành':!unlocked?'Chưa mở khóa':p.started?'Đang học':`Giai đoạn ${l.phase}`}</span></div><div><h3>${esc(l.title)}</h3><p>${esc(l.subtitle)}</p></div><div class="lesson-meta"><span>${esc(l.duration)}</span><span>${unlocked?prog:0}%</span></div><div class="progress-line"><span style="width:${unlocked?prog:0}%"></span></div>${unlocked?`<button class="btn ${p.completed?'ghost':''}" data-open-lesson="${l.id}">${p.completed?'Ôn tập lại':p.started?'Tiếp tục học':'Bắt đầu học'} <span>→</span></button>`:`<button class="btn ghost" disabled title="Hoàn thành bài trước để mở khóa">🔒 Hoàn thành bài trước</button>`}</article>`}
function renderHome(){const completed=lessons.filter(l=>getProg(l.id).completed).length;const stepsDone=lessons.reduce((s,l)=>s+(getProg(l.id).started?Math.min(getProg(l.id).step+1,l.steps.length):0),0);const stepsTotal=lessons.reduce((s,l)=>s+l.steps.length,0);const pscore=avgScore(state.progress);const next=lessons.find(l=>!getProg(l.id).completed)||lessons[0];return `${`<section class="hero"><div><div class="eyebrow" style="color:#b8d4c1">LỘ TRÌNH NGỮ VĂN CỦA BẠN</div><h1>Học Ngữ văn<br>từ gốc đến thi vào 10.</h1><p>Dành cho người đang mất gốc: học kiến thức nền, luyện đọc hiểu, tiếng Việt, viết đoạn, nghị luận xã hội và văn học qua các bước nhỏ có tương tác.</p><button class="btn light" data-open-lesson="${next.id}">${getProg(next.id).step?'Tiếp tục bài đang học':'Bắt đầu bài học đầu tiên'} <span>→</span></button></div><div class="hero-mark">文</div></section>`}<div class="stats"><div class="stat"><div class="s-label">Bài đã hoàn thành</div><div class="s-num">${completed}<span style="font-size:14px;color:#89948c"> / ${lessons.length}</span></div><div class="s-note">Theo tiến độ cá nhân</div></div><div class="stat"><div class="s-label">Bước học đã đi qua</div><div class="s-num">${stepsDone}</div><div class="s-note">Trong ${stepsTotal} bước</div></div><div class="stat"><div class="s-label">Điểm trung bình bài trắc nghiệm</div><div class="s-num">${pscore}%</div><div class="s-note">Chưa tính bài viết tự luận</div></div><div class="stat"><div class="s-label">Trạng thái lưu</div><div class="s-num" style="font-size:20px;margin:8px 0"><span class="badge-dot"></span>${CONFIG.syncEndpoint?'Trực tuyến':'Trên thiết bị này'}</div><div class="s-note">${CONFIG.syncEndpoint?'Đã bật đồng bộ':'Tiến độ được lưu tự động'}</div></div></div><div class="section-head"><div><h2>Tiếp tục học</h2><p>Học lý thuyết ngắn, thực hành và nhận phản hồi ngay.</p></div><button class="btn ghost small" data-screen="curriculum">Xem toàn bộ lộ trình →</button></div><div class="cards">${lessonCard(next)}</div><div class="callout"><strong>Nhắc nhỏ:</strong> Không cần học thuộc văn mẫu để bắt đầu. Mỗi bài đều đi từ kiến thức cơ bản đến ví dụ và bài tập; hãy làm từng bước, xem giải thích sau câu sai và luyện lại phần chưa vững.</div>`}
function renderCurriculum(){const next=lessons.find(l=>!getProg(l.id).completed)||lessons[0];return `${pageTop('BẢN ĐỒ HỌC TẬP','Lộ trình từ nền tảng đến luyện thi','Học từ nền tảng đến luyện thi: kiến thức ngắn, câu hỏi tương tác, bài thực hành và phản hồi. Bài học mở lần lượt để người mất gốc không bị quá tải.')}<div class="callout"><strong>Bài đang mở:</strong> ${esc(next.title)}. ${lessons.filter(l=>getProg(l.id).completed).length} / ${lessons.length} bài đã hoàn thành. Khi nhấn “Hoàn thành bài”, bài tiếp theo sẽ tự mở khóa.</div>${phases.map(p=>`<div class="section-head"><div><h2>${p.icon} Giai đoạn ${p.n}. ${esc(p.title)}</h2><p>${esc(p.desc)}</p></div></div><div class="cards">${lessons.filter(l=>l.phase===p.n).map(lessonCard).join('')||`<div class="card"><p class="small-muted">Các bài học nâng cao của giai đoạn này sẽ được mở rộng theo lớp và địa phương dự thi.</p></div>`}</div>`).join('')}<div class="callout"><strong>Cách học:</strong> Hoàn thành từng bài để mở bài kế tiếp. Có thể ôn lại bài đã hoàn thành bất cứ lúc nào. Lộ trình bao quát kiến thức nền và các dạng luyện thi phổ biến; cấu trúc, dung lượng và yêu cầu cụ thể vẫn cần đối chiếu thông báo tuyển sinh của địa phương và năm thi.</div>`}
function renderProgress(){const rows=lessons.map(l=>{const p=getProg(l.id);return `<tr><td><strong>${esc(l.title)}</strong><div class="small-muted">${esc(l.skill)}</div></td><td>${p.completed?'Hoàn thành':p.started?`Bước ${Math.min(p.step+1,l.steps.length)}/${l.steps.length}`:'Chưa bắt đầu'}</td><td>${p.total?`${p.score}/${p.total}`:'—'}</td><td>${p.best?`${p.best}/${p.total}`:'—'}</td><td>${p.updated?new Date(p.updated).toLocaleString('vi-VN'):'—'}</td></tr>`}).join('');const subs=state.submissions.slice().reverse().slice(0,20);return `${pageTop('LỊCH SỬ HỌC','Kết quả của tôi','Mỗi câu trả lời, bài đã nộp và tiến độ từng bài sẽ được ghi nhận.')}<div class="stats"><div class="stat"><div class="s-label">Bài hoàn thành</div><div class="s-num">${lessons.filter(l=>getProg(l.id).completed).length}</div></div><div class="stat"><div class="s-label">Bài đã bắt đầu</div><div class="s-num">${lessons.filter(l=>getProg(l.id).started).length}</div></div><div class="stat"><div class="s-label">Bài tự luận đã nộp</div><div class="s-num">${state.submissions.length}</div></div><div class="stat"><div class="s-label">Điểm trắc nghiệm trung bình</div><div class="s-num">${avgScore(state.progress)}%</div></div></div><div class="section-head"><div><h2>Tiến độ theo bài</h2><p>Thời điểm được lưu gần nhất theo từng bài.</p></div><button class="btn ghost small" id="exportBtn">Xuất kết quả JSON</button></div><div class="table-wrap"><table class="data-table"><thead><tr><th>Bài học / kỹ năng</th><th>Trạng thái</th><th>Điểm lần gần nhất</th><th>Điểm tốt nhất</th><th>Cập nhật</th></tr></thead><tbody>${rows}</tbody></table></div><div class="section-head"><div><h2>Lịch sử bài viết</h2><p>Lưu nguyên văn câu trả lời cùng đánh giá gợi ý và các ý còn thiếu.</p></div></div>${subs.length?`<div class="module-list">${subs.map(s=>`<details class="card"><summary style="cursor:pointer;font-weight:800">${esc(s.lessonTitle||s.lessonId)} · ${esc(s.gradeLabel||'Đã nộp')} · ${esc(s.date||'')}</summary><p class="small-muted">CÂU TRẢ LỜI NGUYÊN VĂN (${words(s.answer)} từ)</p><p style="white-space:pre-wrap;font-size:13px;color:#3c4d41">${esc(s.answer)}</p>${s.score!=null?`<p><strong>Điểm gợi ý: ${(Number(s.score||0)/10).toFixed(1)}/10 — ${esc(s.gradeLabel||'')}</strong></p>`:''}${s.matched?.length?`<p><strong>Ý đã nhận diện:</strong> ${esc(s.matched.join('; '))}</p>`:''}${s.missing?.length?`<p><strong>Ý nên bổ sung:</strong> ${esc(s.missing.join('; '))}</p>`:''}${s.feedback?`<div class="feedback">${esc(s.feedback)}</div>`:''}</details>`).join('')}</div>`:`<div class="card empty">Chưa có bài tự luận nào được nộp. Sau khi hoàn thành phần viết trong bài học, nội dung sẽ xuất hiện ở đây.</div>`}<div class="section-head"><div><h2>Lịch sử ôn thi có tính giờ</h2><p>Điểm tổng hợp trên thang 10, thời lượng và trạng thái nộp bài.</p></div></div>${(state.examHistory||[]).length?`<div class="table-wrap"><table class="data-table"><thead><tr><th>Lần thi</th><th>Điểm</th><th>Thời gian</th><th>Kết quả</th></tr></thead><tbody>${state.examHistory.slice().reverse().map(e=>`<tr><td>${esc(e.date||'')}</td><td>${esc(String(e.finalScore??'—'))}/10</td><td>${Math.round((e.durationSeconds||0)/60)} phút</td><td>${e.expired?'Hết giờ':'Đã nộp'}</td></tr>`).join('')}</tbody></table></div>`:`<div class="card empty">Chưa có lượt luyện thi tính giờ nào.</div>`}`}
function renderMonitor(){const students=parentResults?.students||savedLocalLearners().map(x=>({learner_name:x.profile.display_name,payload:cloudPayloadFrom(x),updated_at:x.progress?Object.values(x.progress).reduce((m,p)=>Math.max(m,Date.parse(p.updated||0)||0),0):0}));const cloudMessage=CONFIG.syncEndpoint?'Dữ liệu tổng hợp từ máy chủ trực tuyến.':'Đang xem dữ liệu được lưu trên trình duyệt hiện tại; để xem bài làm từ điện thoại hoặc thiết bị khác, hãy cấu hình đồng bộ trực tuyến.';return `${pageTop('BẢNG THEO DÕI','Kết quả người học','Theo dõi tiến độ, điểm luyện tập và bài viết đã nộp.')}<div class="callout">${esc(cloudMessage)}</div>${students.length?students.map(st=>{const p=st.payload||{},progs=p.progress||{},subs=p.submissions||[],completed=lessons.filter(l=>progs[l.id]?.completed).length,total=lessons.length;return `<section class="card" style="margin-bottom:14px"><div class="section-head" style="margin-top:0"><div><h2>${esc(st.learner_name||'Người học')}</h2><p>Cập nhật: ${st.updated_at?new Date(st.updated_at).toLocaleString('vi-VN'):'chưa có thời điểm đồng bộ'}</p></div><span class="tag">${completed}/${total} bài hoàn thành</span></div><div class="stats"><div class="stat"><div class="s-label">Bài bắt đầu</div><div class="s-num">${lessons.filter(l=>progs[l.id]?.started).length}</div></div><div class="stat"><div class="s-label">Bài hoàn thành</div><div class="s-num">${completed}</div></div><div class="stat"><div class="s-label">Bài viết đã nộp</div><div class="s-num">${subs.length}</div></div><div class="stat"><div class="s-label">Điểm trắc nghiệm TB</div><div class="s-num">${avgScore(progs)}%</div></div></div><div class="table-wrap" style="margin-top:14px"><table class="data-table"><thead><tr><th>Bài học</th><th>Trạng thái</th><th>Điểm</th><th>Cập nhật</th></tr></thead><tbody>${lessons.map(l=>{const x=progs[l.id]||{};return `<tr><td>${esc(l.title)}</td><td>${x.completed?'Hoàn thành':x.started?`Bước ${(x.step||0)+1}/${l.steps.length}`:'Chưa bắt đầu'}</td><td>${x.total?`${x.score||0}/${x.total}`:'—'}</td><td>${x.updated?new Date(x.updated).toLocaleString('vi-VN'):'—'}</td></tr>`}).join('')}</tbody></table></div>${subs.length?`<div class="section-head"><div><h2>Bài viết đã nộp</h2><p>Hiển thị nguyên văn câu trả lời để phụ huynh xem lại.</p></div></div>${subs.slice().reverse().map(a=>`<details class="module-row" style="margin-top:8px;display:block"><summary style="cursor:pointer"><strong>${esc(a.lessonTitle||a.lessonId||'Bài viết')}</strong> · ${esc(a.gradeLabel|| (a.score!=null?('Điểm gợi ý '+(Number(a.score||0)/10).toFixed(1)+'/10'):'Chưa chấm'))} · ${esc(a.date||'')}</summary><div style="margin-top:10px"><div class="small-muted">CÂU TRẢ LỜI NGUYÊN VĂN</div><p style="white-space:pre-wrap;margin-top:7px">${esc(a.answer||'')}</p>${a.matched?.length?`<p><strong>Ý chính đã nhận diện:</strong> ${esc(a.matched.join('; '))}</p>`:''}${a.missing?.length?`<p><strong>Ý cần bổ sung:</strong> ${esc(a.missing.join('; '))}</p>`:''}<p class="feedback">${esc(a.feedback||'')}</p></div></details>`).join('')}`:''}${(p.examHistory||[]).length?`<div class="section-head"><div><h2>Lịch sử luyện thi có tính giờ</h2></div></div><div class="module-list">${p.examHistory.slice().reverse().map(e=>`<div class="module-row"><div style="flex:1"><strong>${esc(e.title||'Bài luyện thi Ngữ văn')}</strong><p>Điểm: ${esc(String(e.finalScore??'—'))}/10 · ${Math.round((e.durationSeconds||0)/60)} phút · ${e.expired?'Hết giờ':'Hoàn thành'}</p></div><small>${esc(e.date||'')}</small></div>`).join('')}</div>`:''}</section>`}).join(''):`<div class="card empty">Chưa có dữ liệu để hiển thị. Người học cần mở link, nhập tên và bắt đầu làm bài. Nếu bạn đang sử dụng thiết bị khác, hãy bật đồng bộ trực tuyến trong hướng dẫn bên dưới.</div>`}<div class="lesson-actions"><button class="btn ghost" id="refreshParent">Làm mới dữ liệu</button><button class="btn ghost" id="exportParent">Xuất báo cáo JSON</button><a class="btn" href="./">Quay lại học</a></div>`}
function cloudPayloadFrom(s){return {answers:s.answers||{},progress:s.progress||{},submissions:s.submissions||[],examHistory:s.examHistory||[],screen:'home'}}
function renderParentGate(){return `<div class="auth-wrap"><section class="auth-card"><div class="logo">文</div><div class="eyebrow" style="margin-top:20px">VĂN MÌNH · KHU VỰC NGƯỜI THEO DÕI</div><h1>Theo dõi tiến độ học</h1><p>Người học không cần tài khoản. Bạn có thể mở bảng này bằng link riêng và nhập mã theo dõi đã đặt trong cấu hình máy chủ.</p><div class="field"><label for="parentPin">Mã theo dõi</label><input id="parentPin" type="password" placeholder="Nhập mã theo dõi" autocomplete="current-password"></div><div id="parentMessage" class="notice">${CONFIG.syncEndpoint?'Bảng sẽ lấy kết quả đã đồng bộ từ thiết bị của người học.':'Chưa bật đồng bộ trực tuyến; dữ liệu chỉ có thể xem trên chính trình duyệt lưu bài.'}</div><button class="btn full" id="enterParent">Mở bảng theo dõi</button><button class="btn ghost full" style="margin-top:8px" id="showLocalParent">Xem dữ liệu trên thiết bị này</button><a class="btn ghost full" style="margin-top:8px;text-decoration:none" href="./">Quay lại trang học</a></section></div>`}
function renderSettings(){return `${pageTop('LƯU TIẾN ĐỘ','Tiến độ được lưu tự động','Không cần tài khoản. Người học nhập tên, làm bài và có thể quay lại bằng cùng tên.')}<div class="cards"><div class="card"><div class="lesson-icon">💾</div><h2 style="font-size:19px">Lưu trên trình duyệt</h2><p class="small-muted">Bản mặc định tự lưu câu trả lời và tiến độ trên chính trình duyệt, kể cả khi đóng trang. Dữ liệu cục bộ không tự chuyển sang thiết bị khác.</p><button class="btn ghost" id="changeNameFromSettings">Đổi tên người học</button><button class="btn ghost" id="exportBtn" style="margin-left:6px">Xuất kết quả JSON</button></div><div class="card"><div class="lesson-icon">☁️</div><h2 style="font-size:19px">Đồng bộ giữa thiết bị</h2><p class="small-muted">Muốn bạn theo dõi bài làm từ thiết bị khác, cần thiết lập một dịch vụ dữ liệu trực tuyến. Gói mã nguồn có thể dùng Google Sheets + Apps Script để đồng bộ kết quả từ điện thoại lên bảng theo dõi; người học không cần tài khoản riêng.</p><button class="btn ghost" id="showHowto">Xem hướng dẫn xuất bản</button></div></div><div class="callout"><strong>Đã lưu chưa?</strong> <span id="saveStatus">${CONFIG.syncEndpoint?'Đã cấu hình đồng bộ trực tuyến.':'Tiến độ hiện được lưu trên trình duyệt này.'}</span> Không xóa dữ liệu trang web/trình duyệt nếu chưa xuất hoặc đồng bộ kết quả.</div><div class="section-head"><div><h2>Muốn đổi người học?</h2><p>Mỗi tên có hồ sơ tiến độ riêng trên cùng một trình duyệt.</p></div></div><div class="card"><p>Người học nên dùng cùng một tên mỗi lần quay lại. Với chế độ chỉ nhập tên, tên không phải phương thức xác thực bảo mật; không nhập thông tin cá nhân nhạy cảm vào bài viết.</p><div class="lesson-actions"><button class="btn ghost" id="switchRole">Mở khu vực người theo dõi trên thiết bị này</button><button class="btn warning" id="resetDemo">Xóa kết quả trên thiết bị này</button></div></div>`}
function renderHowto(){return `${pageTop('XUẤT BẢN','Đưa Văn Mình lên GitHub Pages','Sau khi xuất bản, bạn gửi link HTTPS cho em trai qua Zalo; em mở trực tiếp trong trình duyệt, không cần tải ứng dụng.')}<div class="module-list"><div class="module-row"><div class="module-n">1</div><div><h4>Giữ nguyên file config.js đang hoạt động</h4><p>File này cần chứa Web app URL Google Apps Script của bạn. Khi cập nhật index.html, không thay config.js bằng bản mẫu rỗng.</p></div></div><div class="module-row"><div class="module-n">2</div><div><h4>Kết nối Google Sheets</h4><p>Tạo bảng tính theo dõi, mở Extensions → Apps Script và dùng file Code.gs trong gói cập nhật. Chạy Deploy → Manage deployments → Edit → New version → Deploy.</p></div></div><div class="module-row"><div class="module-n">3</div><div><h4>Đặt mã theo dõi phụ huynh</h4><p>Trong Apps Script, mở Project Settings → Script Properties và đặt VANMINH_PARENT_PIN. Không đặt mã PIN trong mã nguồn website và không gửi mã này vào cuộc trò chuyện.</p></div></div><div class="module-row"><div class="module-n">4</div><div><h4>Cập nhật index.html trên GitHub</h4><p>Thay file index.html cũ bằng bản mới, commit changes. Giữ nguyên config.js và không xoá các file cấu hình cần thiết.</p></div></div><div class="module-row"><div class="module-n">5</div><div><h4>Gửi link cho người học</h4><p>Em mở link qua Zalo, nhập cùng tên hồ sơ và học như bình thường. Khi đồng bộ đã được kết nối, tiến độ và bài tự luận sẽ được gửi lên Google Sheets.</p></div></div></div><div class="callout"><strong>Lưu ý:</strong> Google Sheets/Apps Script là dịch vụ lưu dữ liệu trực tuyến, không phải kho lưu trữ tuyệt đối riêng tư. Dùng mã theo dõi riêng, không dùng mật khẩu tài khoản; tránh đưa thông tin nhạy cảm vào câu trả lời. Câu trả lời tự luận được giữ nguyên văn để phụ huynh xem lại.</div><button class="btn" data-screen="home">Quay lại tổng quan</button>`}
function renderLesson(){const l=lessons.find(x=>x.id===state.lessonId);if(!l)return renderHome();if(l.id==='exam-practice'&&state.examSession?.finished)return renderExamResult(l);const step=Math.min(state.step,l.steps.length-1);const s=l.steps[step];const ans=state.answers[`${l.id}:${step}`]||{};const timer=l.id==='exam-practice'?`<div class="exam-clock"><div><strong>⏱ Bài luyện thi đang tính giờ</strong><div class="small-muted">30 phút · hết giờ sẽ tự lưu câu trả lời và kết thúc lượt thi</div></div><strong id="examTimer">${formatCountdown(state.examSession?.deadline||Date.now()+1800000)}</strong></div>`:'';return `<div class="lesson-body"><div class="detail-head"><button class="back" id="backLesson">← Quay lại</button><div style="flex:1"><div class="eyebrow">GIAI ĐOẠN ${l.phase} · ${esc(l.skill)}</div><h1 class="page-title" style="font-size:26px;margin-bottom:4px">${esc(l.title)}</h1><p class="small-muted">${esc(l.subtitle)}</p></div></div>${timer}<div class="step-count"><span>Bước ${step+1} / ${l.steps.length}</span><span>${pct(step+1,l.steps.length)}%</span></div><div class="stepbar"><span style="width:${pct(step+1,l.steps.length)}%"></span></div><section class="lesson-panel"><div class="eyebrow">${s.type==='learn'?'KIẾN THỨC CỐT LÕI':s.type==='quiz'?'CÂU HỎI TƯƠNG TÁC':s.type==='order'?'SẮP XẾP Ý':'THỰC HÀNH VIẾT'}</div><h2>${esc(s.title)}</h2>${s.type==='learn'?renderLearn(s):s.type==='quiz'?renderQuiz(l,step,s,ans):s.type==='order'?renderOrder(l,step,s,ans):renderWrite(l,step,s,ans)}<div class="lesson-actions"><button class="btn ghost" id="prevStep" ${step===0?'disabled':''}>← Bước trước</button>${step<l.steps.length-1?`<button class="btn" id="nextStep" ${!canContinue(l,step,s,ans)?'disabled':''}>Bước tiếp theo →</button>`:`<button class="btn" id="finishLesson" ${!canContinue(l,step,s,ans)?'disabled':''}>Hoàn thành bài ✓</button>`}</div><p class="small-muted" style="margin-top:14px"><span id="saveStatus">${CONFIG.syncEndpoint?'Tiến độ sẽ tự động đồng bộ sau mỗi thao tác.':'Tiến độ tự lưu trên trình duyệt này.'}</span></p></section></div>`}
function renderExamResult(l){const e=state.examSession||{};return `<div class="lesson-body"><section class="lesson-panel"><div class="eyebrow">KẾT QUẢ LUYỆN THI</div><h1 class="page-title">${e.expired?'Đã hết giờ':'Em đã hoàn thành lượt thi'}</h1><p>${esc(l.title)}</p><div class="stats"><div class="stat"><div class="s-label">Điểm tổng hợp</div><div class="s-num">${e.finalScore??0}<span style="font-size:14px">/10</span></div></div><div class="stat"><div class="s-label">Thời gian làm</div><div class="s-num">${Math.round((e.durationSeconds||0)/60)}<span style="font-size:14px"> phút</span></div></div><div class="stat"><div class="s-label">Điểm trắc nghiệm</div><div class="s-num">${e.quizPoints??0}<span style="font-size:14px">/3</span></div></div><div class="stat"><div class="s-label">Điểm tự luận</div><div class="s-num">${e.writingScore??0}<span style="font-size:14px">/100</span></div></div></div><div class="callout">${e.expired?'Hết giờ: câu trả lời tự luận đang nhập đã được lưu nếu có nội dung. Hãy xem lại phần chưa hoàn thành và thử lại khi đã ôn tập.':'Lượt thi đã được lưu vào lịch sử. Điểm tự luận là điểm gợi ý theo các ý chính được nhận diện tự động, không thay thế người chấm.'}</div><div class="lesson-actions"><button class="btn" id="retakeExamBtn">Làm lại bài luyện thi</button><button class="btn ghost" data-screen="progress">Xem lịch sử kết quả</button><button class="btn ghost" data-screen="home">Về trang chủ</button></div></section></div>`}
function renderLearn(s){return `<p>${esc(s.body)}</p><div class="theory"><h3>Ghi nhớ</h3><ul>${s.bullets.map(b=>`<li>${esc(b)}</li>`).join('')}</ul></div><div class="example"><strong>Ví dụ:</strong> ${esc(s.example)}</div><div class="notice">Trước khi sang bước tiếp theo, hãy thử tự nói lại một ý quan trọng bằng lời của mình.</div>`}
function renderQuiz(l,step,s,a){return `<p>${esc(s.question)}</p><div class="notice">Chọn đáp án rồi đọc phản hồi. Nếu sai, em phải bấm “Thử lại” sau khi xem giải thích; mỗi lần sai làm giảm điểm của câu này 0,25 điểm.</div><div class="choice-list">${s.options.map((o,i)=>`<button class="choice ${a.selected===i?'selected':''} ${a.checked&&i===s.correct?'correct':''} ${a.checked&&a.selected===i&&i!==s.correct?'incorrect':''}" data-choice="${i}" ${a.checked?'disabled':''}><span class="letter">${String.fromCharCode(65+i)}</span><span>${esc(o)}</span></button>`).join('')}</div>${a.checked?`<div class="feedback ${a.correct?'':'bad'}"><strong>${a.correct?'Chính xác!':`Chưa đúng — đây là lần sai thứ ${a.wrongAttempts||1}.`}</strong><div style="margin-top:5px">${esc(s.explain)}</div>${a.correct?`<p><strong>Điểm nhận được cho câu này: ${Number(a.points||0).toFixed(2)}/1</strong></p>`:`<p>Chưa thể qua câu tiếp theo. Đọc lời giải rồi thử lại; điểm sẽ giảm theo số lần sai.</p><button class="btn ghost small" style="margin-top:10px" id="retryQuiz">Đã xem giải thích — thử lại</button>`}</div>`:''}`}
function renderOrder(l,step,s,a){const chosen=a.order||s.items.map(x=>x.id);return `<p>${esc(s.question)}</p><div class="notice">Hãy sắp xếp rồi kiểm tra. Nếu sai, phải xem giải thích và bấm thử lại; mỗi lần sai làm giảm điểm của câu này 0,25 điểm.</div><div class="module-list">${chosen.map((id,i)=>{const item=s.items.find(x=>x.id===id);return `<div class="module-row"><div class="module-n">${i+1}</div><div style="flex:1"><p style="color:#3e4f44">${esc(item?.text||'')}</p></div><button class="btn ghost small" data-move="${id}" data-dir="-1" ${i===0||a.checked?'disabled':''}>↑</button><button class="btn ghost small" data-move="${id}" data-dir="1" ${i===chosen.length-1||a.checked?'disabled':''}>↓</button></div>`}).join('')}</div>${a.checked?`<div class="feedback ${a.correct?'':'bad'}"><strong>${a.correct?'Đúng trình tự!':`Chưa đúng — đây là lần sai thứ ${a.wrongAttempts||1}.`}</strong><div>${esc(s.explain)}</div>${a.correct?`<p>Điểm nhận được cho câu này: ${Number(a.points||0).toFixed(2)}/1</p>`:`<button class="btn ghost small" style="margin-top:10px" id="retryQuiz">Đã xem giải thích — thử lại</button>`}</div>`:''}<div style="margin-top:12px"><button class="btn ghost" id="checkOrder" ${a.checked?'disabled':''}>Kiểm tra thứ tự</button></div>`}
function renderWrite(l,step,s,a){const val=a.text||'',g=a.grade||null;return `<p>${esc(s.prompt)}</p><div class="notice">Hệ thống đối chiếu các ý chính và cách diễn đạt tương đương, không yêu cầu chép nguyên văn đáp án mẫu. Điểm tự động là gợi ý theo bộ tiêu chí của bài; nếu cách diễn đạt quá mới, phụ huynh vẫn nên xem nguyên văn.</div><div class="field"><label for="writingAnswer">Câu trả lời của em · tối thiểu gợi ý ${s.minWords} từ</label><textarea id="writingAnswer" placeholder="Hãy viết bằng lời của em. Sai sót là một phần của quá trình học…">${esc(val)}</textarea></div><div class="lesson-meta"><span id="wordCounter">${words(val)} từ</span><span>Rõ ý và có căn cứ quan trọng hơn viết giống văn mẫu.</span></div><div class="theory"><h3>Gợi ý nếu em bí ý</h3><p style="margin:0;font-size:13px">${esc(s.guide)}</p></div><div class="lesson-actions" style="justify-content:flex-start"><button class="btn" id="submitWriting">Lưu và nhận phản hồi</button><button class="btn ghost" id="saveDraft">Lưu bản nháp</button></div>${a.submitted?`<div class="feedback ${g&&g.score<50?'bad':''}"><strong>Đánh giá gợi ý: ${g?`${g.score}/100 · ${esc(g.label)}`:'Đã lưu bài viết'}</strong><div style="margin-top:5px">${esc(a.feedback||'Bài đã được lưu. Hãy xem tiêu chí bên dưới và thử chỉnh sửa để tiến bộ hơn.')}</div>${g?.matched?.length?`<p><strong>Ý chính đã nhận diện:</strong> ${esc(g.matched.join('; '))}</p>`:''}${g?.missing?.length?`<p><strong>Ý nên bổ sung:</strong> ${esc(g.missing.join('; '))}</p>`:''}<div style="margin-top:9px"><strong>Tiêu chí của bài</strong><ul style="margin:5px 0;padding-left:18px">${s.rubric.map(r=>`<li>${esc(r)}</li>`).join('')}</ul></div><details style="margin-top:9px"><summary style="cursor:pointer;font-weight:750">Xem đoạn tham khảo (không nên chép nguyên văn)</summary><p style="white-space:pre-wrap">${esc(s.model)}</p></details><button class="btn ghost small" style="margin-top:10px" id="editWriting">Sửa và nộp lại</button></div>`:''}`}
function canContinue(l,step,s,a){if(l.id==='exam-practice'&&state.examSession?.finished)return false;if(s.type==='learn')return true;if(s.type==='quiz')return a.checked&&a.selected===s.correct;if(s.type==='order')return a.checked&&a.correct;if(s.type==='write')return a.submitted&&words(a.text||'')>=Math.min(6,s.minWords);return false}
function renderAuth(){return `<div class="auth-wrap"><section class="auth-card"><div class="logo">文</div><div class="eyebrow" style="margin-top:20px">VĂN MÌNH · HỌC NGỮ VĂN TỪNG BƯỚC</div><h1>Bắt đầu học nhé!</h1><p>Chỉ cần nhập tên. Không cần email, mật khẩu hay tạo tài khoản. Tiến độ sẽ được tự lưu theo tên trên trình duyệt này.</p>${authMsg?`<div class="notice error">${esc(authMsg)}</div>`:''}<form id="studentNameForm"><div class="field"><label for="studentName">Tên người học</label><input id="studentName" name="studentName" autocomplete="name" required minlength="2" maxlength="60" placeholder="Ví dụ: Minh Anh"></div><button class="btn full" type="submit">Vào học ngay →</button></form><div class="notice">Khi quay lại trên cùng trình duyệt, hãy nhập đúng tên đã dùng để tiếp tục tiến độ cũ. Để theo dõi kết quả từ thiết bị khác, người quản lý cần bật đồng bộ trực tuyến.</div><a href="?mode=parent" style="display:block;text-align:center;margin-top:13px;color:#52665a;font-weight:750;font-size:13px">Tôi là người theo dõi</a></section></div>`}
function render(){if(state.screen==='auth'){document.getElementById('app').innerHTML=header()+renderAuth();wire();return}if(state.screen==='monitor-gate'){document.getElementById('app').innerHTML=header()+renderParentGate();wire();return}const content=state.screen==='home'?renderHome():state.screen==='curriculum'?renderCurriculum():state.screen==='progress'?renderProgress():state.screen==='monitor'?renderMonitor():state.screen==='settings'?renderSettings():state.screen==='howto'?renderHowto():state.screen==='lesson'?renderLesson():renderHome();document.getElementById('app').innerHTML=header()+`<div class="app-grid">${nav()}<main>${content}<footer class="foot"><span>Văn Mình · Học từng bước nhỏ, tiến bộ từng ngày.</span><span id="saveStatus">${CONFIG.syncEndpoint?'Đồng bộ trực tuyến':'Tự lưu trên trình duyệt này'}</span></footer></main></div>`;wire()}
function setScreen(screen){state.screen=screen;persist();render()}
function startExamAttempt(){const lesson=lessons.find(x=>x.id==='exam-practice');lesson.steps.forEach((_,i)=>delete state.answers[`${lesson.id}:${i}`]);const old=getProg(lesson.id);state.progress[lesson.id]={...old,step:0,started:true,completed:false,score:0,total:0,correctCount:0,updated:new Date().toISOString()};state.examSession={id:'exam-'+Date.now(),lessonId:lesson.id,startedAt:Date.now(),deadline:Date.now()+30*60*1000,finished:false}}
function openLesson(id){const lesson=lessons.find(l=>l.id===id);if(!lesson)return;if(!lessonUnlocked(lesson)){const previous=lessons[lessons.findIndex(l=>l.id===id)-1];showToast(`Hãy hoàn thành bài “${previous?.title||'bài trước'}” để mở khóa bài này nhé.`);return}state.lessonId=id;state.screen='lesson';if(id==='exam-practice'&&(!state.examSession||state.examSession.lessonId!==id||state.examSession.finished)){startExamAttempt();state.step=0}else state.step=getProg(id).completed?0:Math.min(getProg(id).step,lesson.steps.length-1);getProg(id).started=true;persist();saveProgress();render()}
function saveProgress(){const l=lessons.find(x=>x.id===state.lessonId);if(!l)return;const p=getProg(l.id);p.step=Math.min(l.steps.length-1,Math.max(p.step,state.step));p.started=true;p.updated=new Date().toISOString();state.progress[l.id]=p;persist()}
function updateAnswer(key,val){state.answers[key]={...(state.answers[key]||{}),...val};persist()}
function currentStep(){return lessons.find(l=>l.id===state.lessonId)?.steps[state.step]}
function normalizeMeaning(text){return String(text||'').toLocaleLowerCase('vi-VN').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/[^a-z0-9\s]/g,' ').replace(/\s+/g,' ').trim()}
function conceptTermMatches(clean,term){const t=normalizeMeaning(term);if(!t)return false;if(t.length<=2)return (` ${clean} `).includes(` ${t} `);return clean.includes(t)}

function gradeWriting(text,s,lessonId){const clean=normalizeMeaning(text);const rules=conceptRules(lessonId);const matched=[],missing=[];for(const rule of rules){if(rule.terms.some(term=>conceptTermMatches(clean,term)))matched.push(rule.label);else missing.push(rule.label)}const coverage=Math.round(matched.length/rules.length*100);const length=words(text);let score=coverage;if(length<s.minWords)score=Math.max(0,score-Math.min(20,Math.ceil((s.minWords-length)/Math.max(1,s.minWords)*20)));const label=score>=75?'Đạt phần lớn ý chính':score>=50?'Đạt một phần — nên bổ sung ý':'Chưa thể hiện rõ các ý chính';const notes=[];if(length>=s.minWords)notes.push(`Độ dài ${length} từ đạt mức gợi ý.`);else notes.push(`Bài có ${length} từ, ngắn hơn mức gợi ý ${s.minWords} từ.`);if(matched.length)notes.push('Hệ thống nhận diện được: '+matched.join('; ')+'.');if(missing.length)notes.push('Nên xem lại: '+missing.join('; ')+'.');notes.push('Điểm gợi ý trên thang 10 dựa trên các ý chính và cụm từ tương đương đã cấu hình; đây chưa phải AI hiểu ngữ nghĩa hoàn chỉnh.');return {score,label,matched,missing,feedback:notes.join(' ')}}

function startExamClock(){stopExamClock();if(!state.examSession||state.examSession.finished)return;const tick=()=>{const el=document.getElementById('examTimer');const left=Math.max(0,Math.ceil((state.examSession.deadline-Date.now())/1000));if(el)el.textContent=formatCountdown(state.examSession.deadline);if(left<=0){stopExamClock();finalizeExam(true)}};tick();if(state.examSession&&!state.examSession.finished)examClock=setInterval(tick,1000)}
function finalizeExam(expired){if(!state.examSession||state.examSession.finished)return;const l=lessons.find(x=>x.id==='exam-practice');const writeIndex=l.steps.findIndex(x=>x.type==='write');const key=`${l.id}:${writeIndex}`;if(expired){const ta=state.step===writeIndex?document.getElementById('writingAnswer'):null;const text=(ta?.value||state.answers[key]?.text||'').trim();if(text&&!state.answers[key]?.submitted){const step=l.steps[writeIndex],g=gradeWriting(text,step,l.id),entry={lessonId:l.id,lessonTitle:l.title,answer:text,feedback:g.feedback,score:g.score,gradeLabel:g.label,matched:g.matched,missing:g.missing,date:new Date().toLocaleString('vi-VN'),examSessionId:state.examSession.id,autoSubmitted:true};state.submissions.push(entry);state.answers[key]={...(state.answers[key]||{}),text,submitted:true,feedback:g.feedback,grade:g};}}const quizIndex=l.steps.findIndex(x=>x.type==='quiz'||x.type==='order');const qa=state.answers[`${l.id}:${quizIndex}`]||{};const quizPoints=Math.round((qa.points||0)*3*100)/100;const essay=state.submissions.filter(x=>x.examSessionId===state.examSession.id).slice(-1)[0];const writingScore=essay?.score||0;const finalScore=Math.round((quizPoints+writingScore*0.07)*10)/10;const endedAt=Date.now();const entry={id:state.examSession.id,title:l.title,date:new Date(endedAt).toLocaleString('vi-VN'),startedAt:state.examSession.startedAt,endedAt,durationSeconds:Math.max(0,Math.round((endedAt-state.examSession.startedAt)/1000)),expired:!!expired,quizPoints,writingScore,finalScore};state.examHistory=state.examHistory||[];state.examHistory.push(entry);state.examSession={...state.examSession,finished:true,expired:!!expired,endedAt,durationSeconds:entry.durationSeconds,quizPoints,writingScore,finalScore};const p=getProg(l.id);p.completed=true;p.started=true;p.updated=new Date().toISOString();state.progress[l.id]=p;persist();render()}
async function finishQuiz(l,step,s,selected){const key=`${l.id}:${step}`,old=state.answers[key]||{};if(old.checked)return;const correct=selected===s.correct;const wrongAttempts=Number(old.wrongAttempts||0)+(correct?0:1);const points=correct?Math.max(0,1-(Number(old.wrongAttempts||0)*0.25)):0;state.answers[key]={...old,selected,checked:true,correct,wrongAttempts,points};const p=getProg(l.id);p.attempts=(p.attempts||0)+1;const scored=l.steps.map((st,i)=>({st,a:state.answers[`${l.id}:${i}`]})).filter(x=>(x.st.type==='quiz'||x.st.type==='order')&&x.a&&x.a.checked);p.total=scored.length;p.score=Math.round(scored.reduce((sum,x)=>sum+(Number(x.a.points)||0),0)*100)/100;p.correctCount=scored.filter(x=>!!x.a.correct).length;p.best=Math.max(p.best||0,p.score||0);p.updated=new Date().toISOString();state.progress[l.id]=p;persist();render()}
