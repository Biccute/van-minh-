*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);line-height:1.5}button,input,textarea,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}.app{min-height:100vh}.topbar{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 clamp(16px,4vw,52px);position:sticky;top:0;z-index:20}.brand{display:flex;align-items:center;gap:11px;font-size:18px;font-weight:800;letter-spacing:-.5px}.logo{width:38px;height:38px;border-radius:13px;background:var(--green);color:white;display:grid;place-items:center;font-family:Georgia,serif;font-size:24px}.top-actions{display:flex;align-items:center;gap:12px}.pill{background:#f0f3ee;border-radius:99px;padding:7px 12px;font-size:12px;font-weight:700;color:#53645a}.app-grid{display:grid;grid-template-columns:258px minmax(0,1fr);max-width:1500px;margin:auto;min-height:calc(100vh - 72px)}.sidebar{padding:27px 17px;border-right:1px solid var(--line);background:#fbfcf9}.who{padding:14px;border-radius:14px;background:#eef3ed;margin-bottom:22px}.who small{color:var(--muted);display:block;font-size:11px;text-transform:uppercase;font-weight:800;letter-spacing:.08em}.who strong{display:block;margin-top:4px}.nav-label{font-size:10px;font-weight:800;color:#8a968e;letter-spacing:.12em;padding:0 13px;margin:24px 0 7px}.nav-btn{width:100%;border:0;background:transparent;color:#59675f;text-align:left;padding:11px 13px;border-radius:11px;display:flex;align-items:center;gap:10px;font-weight:650;margin:3px 0}.nav-btn .ico{font-size:17px;width:23px;text-align:center}.nav-btn.active,.nav-btn:hover{background:var(--green);color:#fff}.sidebar-note{font-size:12px;color:#758078;padding:16px 12px;margin-top:25px;border-top:1px solid var(--line)}main{padding:clamp(20px,4vw,48px);max-width:1180px;width:100%;margin:0 auto}.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#758579;font-weight:800}.page-title{font-size:clamp(27px,3vw,39px);line-height:1.13;margin:7px 0 12px;letter-spacing:-1.2px}.lead{color:var(--muted);max-width:720px;margin:0}.hero{border-radius:25px;background:var(--green);color:#fff;padding:clamp(24px,4vw,42px);display:grid;grid-template-columns:1.4fr .8fr;gap:20px;position:relative;overflow:hidden;box-shadow:var(--shadow)}.hero h1{font-family:Georgia,serif;font-weight:500;font-size:clamp(29px,4vw,43px);line-height:1.1;letter-spacing:-.8px;margin:10px 0 13px}.hero p{color:#dce8df;max-width:500px;margin:0 0 22px}.hero-mark{font-family:Georgia,serif;font-size:150px;line-height:1;display:grid;place-items:center;color:#ffffff14;transform:rotate(-8deg)}.btn{border:1px solid transparent;border-radius:11px;background:var(--green);color:white;padding:10px 15px;font-weight:750;transition:.15s;display:inline-flex;align-items:center;justify-content:center;gap:8px}.btn:hover{filter:brightness(1.08);transform:translateY(-1px)}.btn.light{background:#fff;color:var(--green)}.btn.ghost{border-color:var(--line);background:#fff;color:var(--ink)}.btn.small{padding:7px 11px;font-size:12px}.btn.warning{background:#fff1df;color:#77501c}.btn.full{width:100%}.section-head{display:flex;justify-content:space-between;align-items:end;gap:16px;margin:30px 0 14px}.section-head h2{font-size:20px;letter-spacing:-.4px;margin:0}.section-head p{font-size:13px;color:var(--muted);margin:3px 0 0}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin-top:20px}.stat,.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}.stat .s-label{font-size:12px;color:var(--muted);font-weight:650}.stat .s-num{font-size:27px;font-weight:800;letter-spacing:-1px;margin:5px 0}.stat .s-note{font-size:11px;color:#7d897f}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.lesson-card{display:flex;flex-direction:column;gap:10px}.lesson-top{display:flex;align-items:flex-start;justify-content:spac ck;height:100%;background:var(--orange)}.lesson-panel{background:#fff;border:1px solid var(--line);border-radius:21px;padding:clamp(20px,3vw,34px);box-shadow:var(--shadow);margin-top:16px}.lesson-panel h2{margin:4px 0 14px;font-size:25px;letter-spacing:-.7px;line-height:1.2}.lesson-panel p{color:#526057}.theory{background:#f5f7f2;border-radius:14px;padding:18px;margin:17px 0}.theory h3{font-size:14px;margin:0 0 7px}.theory ul{padding-left:20px;margin:8px 0}.theory li{margin:5px 0}.example{border-left:3px solid var(--orange);padding:12px 15px;background:#fff9f0;border-radius:0 10px 10px 0;margin:14px 0;font-size:14px}.choice-list{display:grid;gap:9px;margin:15px 0}.choice{display:flex;gap:11px;align-items:flex-start;text-align:left;background:#fff;border:1px solid #dfe6df;color:var(--ink);padding:13px 14px;border-radius:12px}.choice:hover{border-color:#71967d}.choice.selected{border-color:var(--green);background:#eff5ef;box-shadow:inset 0 0 0 1px var(--green)}.choice.correct{border-color:#52966b;background:#edf8ef}.choice.incorrect{border-color:#d88d86;background:#fff0ef}.choice .letter{width:25px;height:25px;border-radius:8px;background:#f0f3ef;display:grid;place-items:center;font-size:12px;font-weight:800;flex-shrink:0}.field{display:grid;gap:6px;margin:12px 0}.field label{font-size:12px;font-weight:800;color:#526057}.field input,.field textarea,.field select{width:100%;padding:12px 13px;border:1px solid #dce4dd;border-radius:11px;outline:none;background:white;color:var(--ink)}.field input:focus,.field textarea:focus{border-color:#73977f;box-shadow:0 0 0 3px #6d9c7c20}.field textarea{min-height:135px;resize:vertical}.feedback{padding:14px 15px;border-radius:12px;margin-top:14px;background:#eff7f0;color:#315e3e;font-size:13px}.feedback.bad{background:#fff1ed;color:#8a3a2e}.exam-clock{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:15px 18px;border:1px solid #f0d3a5;background:#fff7e8;border-radius:14px;margin:12px 0 16px}.exam-clock>strong{font-size:26px;font-variant-numeric:tabular-nums;color:#8a5520;white-space:nowrap}.exam-clock strong{font-weight:850}.exam-clock .small-muted{margin-top:3px}.lesson-actions{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:20px}.section-title{font-size:20px;margin:0 0 14px}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:15px;background:white}.data-table{border-collapse:collapse;width:100%;min-width:570px}.data-table th,.data-table td{padding:13px 15px;text-align:left;border-bottom:1px solid #edf0ec;font-size:12px}.data-table th{background:#f7f9f5;color:#647267;font-size:10px;text-transform:uppercase;letter-spacing:.08em}.data-table tr:last-child td{border-bottom:0}.empty{padding:30px 20px;text-align:center;color:var(--muted);font-size:13px}.auth-wrap{min-height:calc(100vh - 72px);display:grid;place-items:center;padding:25px}.auth-card{width:min(100%,460px);background:white;border:1px solid var(--line);border-radius:23px;padding:30px;box-shadow:var(--shadow)}.auth-card h1{font-size:28px;margin:7px 0}.auth-card>p{color:var(--muted);font-size:13px}.tabs{display:flex;background:#f0f3ef;border-radius:11px;padding:4px;margin:18px 0}.tabs button{flex:1;border:0;padding:9px;border-radius:8px;background:transparent;font-weight:750;color:#68776c}.tabs button.active{background:white;color:var(--green);box-shadow:0 2px 5px #172d2010}.notice{padding:12px 14px;background:#f7f8f4;border:1px solid var(--line);border-radius:11px;font-size:12px;color:#667368;margin:13px 0}.notice.error{color:#8a352e;background:#fff2f0;border-color:#f3d2cd}.notice.success{color:#315e3e;background:#edf8ef;border-color:#d5ead9}.foot{border-top:1px solid var(--line);margin-top:35px;padding:18px 0;color:#8a948b;font-size:11px;display:flex;justify-content:space-between;gap:12px}.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.settings-grid .card{padding:22px}.small-muted{font-size:11px;color:var(--muted)}.hide{display:none!important}.mobile-menu{display:none}.toast{position:fixed;bottom:20px;right:20px;background:#263e32;color:white;padding:13px 17px;border-radius:12px;font-size:13px;box-shadow:var(--shadow);z-index:99;max-width:340px}.ring{width:90px;height:90px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(#709b7e var(--p),#e7ede7 0);position:relative}.ring:before{content:"";position:absolute;inset:8px;background:white;border-radius:50%}.ring strong{position:relative;font-size:20px}.app-mode-label{font-size:11px;color:#8b968c}.badge-dot{width:7px;height:7px;border-radius:50%;background:#70a67c;display:inline-block;margin-right:5px}
@media(max-width:900px){.app-grid{grid-template-columns:1fr}.sidebar{border-right:0;border-bottom:1px solid var(--line);padding:9px 14px;display:flex;overflow:auto;gap:5px;position:sticky;top:72px;z-index:15}.who,.nav-label,.sidebar-note{display:none}.nav-btn{white-space:nowrap;width:auto;padding:9px 12px}.nav-btn .ico{width:auto}.hero{grid-template-columns:1fr}.hero-mark{display:none}.two-col{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}

<body>

<script type="module">
const APP_KEY='vanminh:v2';
const LOCAL_PREFIX='vanminh:learner:';
const CONFIG=window.VANMINH_CONFIG||{};
let cloudTimer=null, cloudLoading=false, parentResults=null, examClock=null;
const lessons=[
{id:'foundation-reading',phase:1,title:'Đọc hiểu: Tìm ý chính và bằng chứng',subtitle:'Đọc có mục tiêu, hiểu đúng trước khi viết',icon:'🔎',duration:'15–20 phút',skill:'Đọc hiểu',steps:[
{type:'learn',title:'Đọc để tìm điều quan trọng',body:'Đọc hiểu không phải là nhớ mọi từ trong văn bản. Trước tiên, hãy tự hỏi: đoạn văn đang nói về điều gì, tác giả muốn nhấn mạnh điều gì, chi tiết nào chứng minh nhận xét đó?',bullets:['Ý chính: thông tin hoặc thông điệp bao quát đoạn văn.','Bằng chứng: từ ngữ, chi tiết hoặc câu văn cụ thể làm căn cứ.','Suy luận: điều ta rút ra từ bằng chứng; cần có lý do hợp lý, không đoán tùy ý.'],example:'Một bạn luôn ở lại sau giờ học để giải thích bài cho bạn khác. Từ hành động ấy, ta có thể suy luận bạn ấy biết quan tâm và sẵn lòng giúp đỡ — nhưng không nên kết luận bạn ấy luôn đứng đầu lớp nếu không có căn cứ.'},
{type:'quiz',title:'Chọn ý chính',question:'Đọc đoạn sau: “Mỗi tối, Mai dành mười phút ghi lại những điều mình chưa hiểu. Hôm sau, em hỏi thầy cô hoặc bạn bè. Sau vài tuần, Mai nhận ra mình tự tin hơn khi học.” Ý chính phù hợp nhất là gì?',options:['Mai học giỏi tất cả các môn.','Thói quen nhận diện điều chưa hiểu và chủ động hỏi giúp Mai tiến bộ.','Mai chỉ học vào buổi tối.'],correct:1,explain:'Đáp án này bao quát cả thói quen và kết quả được nêu trong đoạn. Hai đáp án còn lại kết luận quá rộng hoặc chỉ nhắc một chi tiết.'},
{type:'quiz',title:'Tìm bằng chứng',question:'Chi tiết nào hỗ trợ trực tiếp nhất cho nhận xét “Mai chủ động trong học tập”?',options:['“Sau vài tuần”','“Hôm sau, em hỏi thầy cô hoặc bạn bè.”','“Mai nhận ra mình tự tin hơn.”'],correct:1,explain:'Chi tiết Mai tự tìm người hỏi cho thấy hành động chủ động. Câu cuối nói về kết quả, còn cụm “sau vài tuần” chỉ thời gian.'},
{type:'write',title:'Diễn đạt bằng lời của mình',prompt:'Viết 1–2 câu giải thích vì sao việc ghi lại điều chưa hiểu có thể giúp một học sinh tiến bộ.',minWords:12,guide:'Hãy nêu một lợi ích rồi giải thích lợi ích đó. Ví dụ: việc ghi lại câu hỏi giúp… vì…',rubric:['Có trả lời đúng trọng tâm','Có giải thích mối liên hệ giữa hành động và kết quả'],model:'Việc ghi lại điều chưa hiểu giúp học sinh nhận ra chính xác phần kiến thức còn yếu. Nhờ vậy, các bạn có thể đặt câu hỏi cụ thể và sửa lỗ hổng thay vì học một cách mơ hồ.'}
]},
{id:'sentence-paragraph',phase:2,title:'Từ câu đơn đến đoạn văn mạch lạc',subtitle:'Mỗi câu có một nhiệm vụ rõ ràng',icon:'✍️',duration:'20–25 phút',skill:'Diễn đạt',steps:[
{type:'learn',title:'Một đoạn văn cần có trục ý',body:'Đoạn văn tốt không chỉ gồm nhiều câu đúng ngữ pháp. Các câu phải cùng làm rõ một ý chính và được sắp xếp theo trình tự người đọc dễ theo dõi.',bullets:['Câu chủ đề: nêu ý chính của đoạn.','Câu triển khai: giải thích, đưa lý lẽ hoặc ví dụ.','Câu kết: khái quát hoặc nhấn mạnh ý; không phải đoạn nào cũng bắt buộc có câu kết riêng.'],example:'Ý chính: Đọc sách giúp mở rộng hiểu biết. → Giải thích: Sách đem lại thông tin ngoài trải nghiệm trực tiếp. → Ví dụ: Một cuốn sách khoa học giúp người đọc hiểu hiện tượng tự nhiên. → Kết: Vì vậy, đọc sách là cách tự học hữu ích.'},
{type:'quiz',title:'Nhận diện câu chủ đề',question:'Với đoạn văn bàn về lợi ích của tinh thần trách nhiệm, câu nào phù hợp nhất để làm câu chủ đề?',options:['Hôm qua, lớp em trực nhật vào buổi sáng.','Tinh thần trách nhiệm giúp mỗi người đáng tin cậy hơn trong học tập và cuộc sống.','Bạn Nam đã lau bảng rất sạch.'],correct:1,explain:'Câu chủ đề cần bao quát ý mà cả đoạn sẽ triển khai. Hai câu còn lại là chi tiết riêng lẻ, có thể dùng làm ví dụ nhưng chưa thể hiện luận điểm tổng quát.'},
{type:'order',title:'Sắp xếp để tạo lập luận',question:'Sắp xếp các ý theo trình tự hợp lý nhất: nêu ý chính → giải thích → ví dụ → kết luận.',items:[{id:'a',text:'Vì thế, mỗi học sinh nên hình thành thói quen chuẩn bị bài trước khi đến lớp.'},{id:'b',text:'Chuẩn bị bài trước giúp học sinh chủ động hơn khi tiếp nhận kiến thức.'},{id:'c',text:'Khi đã đọc trước nội dung, học sinh dễ nhận ra chỗ chưa hiểu và đặt câu hỏi.'},{id:'d',text:'Chẳng hạn, em có thể đánh dấu những khái niệm khó để hỏi giáo viên.'}],correct:['b','c','d','a'],explain:'Bắt đầu bằng luận điểm, sau đó giải thích cơ chế, minh họa bằng ví dụ và cuối cùng rút ra kết luận.'},
{type:'write',title:'Viết một đoạn ngắn',prompt:'Viết đoạn văn khoảng 4–6 câu về một thói quen có ích cho việc học. Hãy có câu chủ đề, ít nhất một câu giải thích và một ví dụ.',minWords:35,guide:'Có thể bắt đầu bằng: “Một thói quen có ích cho việc học là…”. Sau đó tự hỏi: Vì sao có ích? Nó thể hiện trong hành động nào?',rubric:['Có ý chính rõ ràng','Có giải thích hoặc lý lẽ','Có ví dụ cụ thể','Các câu liên kết với nhau'],model:'Một thói quen có ích cho việc học là ôn lại bài sau mỗi buổi học. Việc ôn tập giúp kiến thức được củng cố và giúp em phát hiện phần mình chưa hiểu. Chẳng hạn, em có thể dành mười phút ghi lại ba ý quan trọng của bài học trong ngày. Nếu gặp nội dung khó, em đánh dấu để hỏi lại giáo viên. Vì vậy, ôn tập đều đặn giúp việc học hiệu quả hơn.'}
]},
{id:'social-argument',phase:3,title:'Nghị luận xã hội: Xây dựng luận điểm',subtitle:'Nêu ý kiến, giải thích, chứng minh',icon:'💬',duration:'20–30 phút',skill:'Nghị luận xã hội',steps:[
{type:'learn',title:'Đừng bắt đầu bằng văn mẫu',body:'Nghị luận xã hội là trình bày và bảo vệ một nhận định về vấn đề trong đời sống. Trước khi viết câu hay, cần biết mình muốn khẳng định điều gì và vì sao điều đó hợp lý.',bullets:['Vấn đề: đề bài yêu cầu bàn về điều gì?','Luận điểm: ý kiến chính mà em muốn bảo vệ.','Lý lẽ: lý do giải thích vì sao ý kiến ấy hợp lý.','Dẫn chứng: trường hợp cụ thể giúp làm sáng tỏ lý lẽ.','Phân tích: giải thích dẫn chứng chứng minh điều gì — không chỉ kể lại dẫn chứng.'],example:'Đề: “Ý nghĩa của sự kiên trì”. Luận điểm: Kiên trì giúp con người tiến bộ trước khó khăn. Lý lẽ: Kết quả thường cần thời gian luyện tập và sửa sai. Dẫn chứng: Một học sinh làm lại dạng toán còn yếu, ghi lỗi và luyện mỗi ngày. Phân tích: tiến bộ đến từ việc nhận lỗi và luyện tập đều đặn, không phải chỉ làm nhiều bài.'},
{type:'quiz',title:'Phân biệt luận điểm và dẫn chứng',question:'Trong các ý dưới đây, đâu là một luận điểm có thể dùng cho đề “Ý nghĩa của tinh thần trách nhiệm”?',options:['Bạn An đã nhận phần trực nhật của nhóm và hoàn thành đúng hạn.','Tinh thần trách nhiệm giúp tập thể tin tưởng và phối hợp với nhau tốt hơn.','Thứ sáu tuần trước, lớp em có buổi lao động.'],correct:1,explain:'Luận điểm là nhận định cần được lý giải. Ý về bạn An và buổi lao động là những chi tiết có thể dùng làm dẫn chứng.'},
{type:'quiz',title:'Chọn cách phân tích dẫn chứng',question:'Sau khi nêu ví dụ một học sinh kiên trì sửa lỗi viết văn, câu nào phân tích dẫn chứng tốt hơn?',options:['Đó là một học sinh rất chăm chỉ và ví dụ này rất hay.','Ví dụ này cho thấy việc ghi nhận lỗi và luyện tập có mục tiêu giúp học sinh cải thiện kỹ năng qua từng lần viết.','Em xin hết phần dẫn chứng.'],correct:1,explain:'Câu phân tích phải nối dẫn chứng với luận điểm, chỉ ra ví dụ chứng minh điều gì. Tránh khen dẫn chứng chung chung hoặc dừng ngay sau khi kể.'},
{type:'write',title:'Lập khung một đoạn nghị luận',prompt:'Đề: “Vì sao học sinh cần biết nhận lỗi?” Hãy viết 4 phần ngắn: luận điểm, lý lẽ, một dẫn chứng phù hợp và câu phân tích dẫn chứng.',minWords:30,guide:'Không cần viết hoa mỹ. Hãy trả lời lần lượt: Em khẳng định điều gì? Vì sao? Có ví dụ nào cụ thể? Ví dụ ấy chứng minh điều gì?',rubric:['Luận điểm trả lời đúng đề','Lý lẽ giải thích được luận điểm','Dẫn chứng cụ thể và phù hợp','Phân tích kết nối dẫn chứng với luận điểm'],model:'Luận điểm: Học sinh cần biết nhận lỗi để tiến bộ. Lý lẽ: Khi thừa nhận sai sót, mỗi người mới xác định được điều cần sửa. Dẫn chứng: Một học sinh nhận ra mình thường viết thiếu dẫn chứng nên kiểm tra lại từng đoạn sau mỗi bài. Phân tích: Việc nhìn thẳng vào lỗi giúp bạn ấy luyện đúng điểm yếu và cải thiện bài viết.'}
]},
{id:'literature-analysis',phase:4,title:'Nghị luận văn học: Phân tích chi tiết',subtitle:'Từ dẫn chứng đến ý nghĩa, không chỉ kể lại',icon:'📖',duration:'20–30 phút',skill:'Nghị luận văn học',steps:[
{type:'learn',title:'Quan sát chi tiết rồi mới nhận xét',body:'Phân tích văn học cần có căn cứ trong văn bản. Em hãy xác định chi tiết nổi bật, xem chi tiết gợi lên điều gì và liên hệ nó với nhân vật, cảm xúc hoặc chủ đề.',bullets:['Nhận xét: em muốn khẳng định điều gì về nhân vật, hình ảnh hoặc cảm xúc?','Dẫn chứng: từ ngữ, hành động, hình ảnh cụ thể trong văn bản.','Phân tích: vì sao chi tiết đó gợi ra nhận xét của em?','Đánh giá: chi tiết góp phần thể hiện chủ đề hoặc làm nổi bật điều gì?'],example:'Đoạn văn minh họa do bài học tự tạo: “Trước cánh cửa lớp, Linh nắm chặt tờ giấy điểm. Em định bước vào rồi lại dừng, khẽ vuốt phẳng góc giấy đã nhàu.” Chi tiết tờ giấy bị vò nhàu và động tác vuốt phẳng có thể gợi tâm trạng lo lắng, do dự. Đây là một cách đọc có căn cứ, nhưng cần xem thêm ngữ cảnh để khẳng định sâu hơn.'},
{type:'quiz',title:'Chọn nhận xét có căn cứ',question:'Từ chi tiết “Linh định bước vào rồi lại dừng”, nhận xét nào thận trọng và có căn cứ nhất?',options:['Linh chắc chắn ghét tất cả các bạn trong lớp.','Linh có vẻ do dự hoặc lo lắng trước khi vào lớp.','Linh luôn là học sinh đứng đầu trường.'],correct:1,explain:'Hành động dừng lại gợi sự do dự, nhưng chưa đủ để kết luận nguyên nhân cụ thể hay thành tích học tập của Linh.'},
{type:'quiz',title:'Phân tích thay vì kể lại',question:'Sau khi dẫn chi tiết “khẽ vuốt phẳng góc giấy đã nhàu”, câu nào có tính phân tích hơn?',options:['Linh cầm tờ giấy và vuốt tờ giấy.','Động tác nhỏ ấy gợi sự bất an của Linh, đồng thời cho thấy em đang cố lấy lại bình tĩnh trước khi đối diện với kết quả.','Tờ giấy có một góc bị nhàu.'],correct:1,explain:'Câu phân tích giải thích ý nghĩa của chi tiết và liên hệ với tâm trạng nhân vật. Câu chỉ kể lại hành động hoặc lặp chi tiết chưa đi sâu vào ý nghĩa.'},
{type:'write',title:'Viết đoạn phân tích có dẫn chứng',prompt:'Dựa vào đoạn văn minh họa trong bài, viết 4–6 câu phân tích tâm trạng của Linh. Phải trích ít nhất một chi tiết và giải thích ý nghĩa của chi tiết đó.',minWords:35,guide:'Cấu trúc gợi ý: Nhận xét về tâm trạng → dẫn chứng cụ thể → giải thích chi tiết gợi điều gì → nhận xét khái quát. Đây là khung tư duy, không phải đoạn văn để chép.',rubric:['Nêu được nhận xét về tâm trạng','Dẫn chứng đúng chi tiết','Giải thích ý nghĩa thay vì kể lại','Kết luận phù hợp với bằng chứng'],model:'Linh có vẻ đang lo lắng và do dự trước khi bước vào lớp. Điều đó được gợi ra qua chi tiết em “định bước vào rồi lại dừng”. Đặc biệt, động tác “khẽ vuốt phẳng góc giấy đã nhàu” cho thấy Linh chú ý đến tờ giấy điểm và có thể đang cố trấn tĩnh bản thân. Những cử chỉ nhỏ khiến tâm trạng nhân vật hiện lên tự nhiên mà không cần tác giả trực tiếp gọi tên cảm xúc.'}
]},
{id:'full-essay',phase:5,title:'Từ đoạn văn đến bài văn hoàn chỉnh',subtitle:'Lập dàn ý, liên kết và tự kiểm tra',icon:'🧩',duration:'25–35 phút',skill:'Bố cục bài viết',steps:[
{type:'learn',title:'Bài văn là một chuỗi luận điểm',body:'Một bài văn hoàn chỉnh không đơn giản là ghép nhiều đoạn văn rời rạc. Mỗi phần cần có nhiệm vụ riêng và cùng phục vụ cho yêu cầu của đề.',bullets:['Mở bài: giới thiệu đúng vấn đề hoặc tác phẩm, tránh dài dòng.','Thân bài: triển khai các luận điểm theo trình tự hợp lý; mỗi đoạn tập trung làm rõ một ý.','Kết bài: khái quát lại nhận định hoặc ý nghĩa, không mở sang vấn đề hoàn toàn mới.','Sau khi viết: kiểm tra yêu cầu đề, sự trùng lặp, dẫn chứng và diễn đạt.'],example:'Trước khi viết, hãy thử nói mỗi đoạn thân bài trong một câu. Nếu hai đoạn nói cùng một ý, cần gộp hoặc phân biệt lại. Nếu có đoạn không phục vụ câu hỏi của đề, hãy cân nhắc bỏ hoặc viết lại.'},
{type:'quiz',title:'Chọn dàn ý phù hợp',question:'Đề: “Trình bày suy nghĩ về vai trò của sự trung thực”. Trình tự nào hợp lý nhất?',options:['Kể một câu chuyện dài → nói về trường học → kết bài.','Giải thích trung thực → nêu ý nghĩa bằng lý lẽ và dẫn chứng → bàn về biểu hiện trái ngược hoặc giới hạn phù hợp → rút ra bài học.','Viết kết bài trước → chép một câu danh ngôn → lặp lại đề bài.'],correct:1,explain:'Trình tự này đi từ làm rõ khái niệm đến phân tích, mở rộng và liên hệ. Các phần cần được điều chỉnh theo yêu cầu cụ thể của đề.'},
{type:'write',title:'Tạo dàn ý trước khi viết',prompt:'Lập dàn ý ngắn cho đề “Vai trò của tính tự giác trong học tập”. Hãy ghi một ý cho mở bài, ít nhất hai luận điểm thân bài kèm lý lẽ hoặc ví dụ và một ý kết bài.',minWords:35,guide:'Chưa cần viết thành bài hoàn chỉnh. Trước tiên hãy bảo đảm mỗi luận điểm mang một ý riêng, có thể giải thích bằng lý lẽ hoặc minh họa bằng ví dụ.',rubric:['Mở bài giới thiệu đúng vấn đề','Có ít nhất hai luận điểm khác nhau','Có lý lẽ hoặc ví dụ để phát triển ý','Kết bài phù hợp với vấn đề'],model:'Mở bài: Tự giác là phẩm chất cần thiết trong học tập. Luận điểm 1: Tự giác giúp học sinh chủ động tiếp thu kiến thức vì các em không phải luôn chờ người khác nhắc nhở. Ví dụ: tự ôn bài và ghi lại câu hỏi sau giờ học. Luận điểm 2: Tự giác rèn tính kỷ luật và trách nhiệm, có ích cả khi học lẫn khi làm việc nhóm. Kết bài: Mỗi học sinh nên bắt đầu từ những việc nhỏ và duy trì đều đặn.'}
]},
{id:'exam-practice',phase:5,title:'Luyện tập tổng hợp theo định hướng thi vào 10',subtitle:'Đọc kỹ đề, phân bổ thời gian, tự sửa lỗi',icon:'🎯',duration:'30 phút',skill:'Luyện đề',steps:[
{type:'learn',title:'Quy trình làm bài',body:'Trước khi viết, hãy đọc kỹ động từ yêu cầu trong đề: nêu, chỉ ra, giải thích, phân tích, nhận xét hay trình bày suy nghĩ. Mỗi động từ đòi hỏi mức độ trả lời khác nhau.',bullets:['Gạch chân yêu cầu và giới hạn dung lượng nếu đề có nêu.','Ước lượng thời gian cho từng phần trước khi bắt đầu.','Dành thời gian lập ý cho câu viết dài.','Cuối bài, kiểm tra nội dung, dẫn chứng, câu văn và chính tả.'],example:'Lưu ý: cấu trúc, ngữ liệu, thang điểm và yêu cầu bài thi vào lớp 10 khác nhau theo địa phương và từng năm. Bài này là luyện tập nền tảng, chưa thay thế đề thi chính thức của tỉnh/thành.'},
{type:'quiz',title:'Đọc đúng yêu cầu',question:'Đề yêu cầu “phân tích tác dụng của hình ảnh”. Cách trả lời nào phù hợp nhất?',options:['Chép lại hình ảnh rồi dừng lại.','Nêu hình ảnh, giải thích gợi ra điều gì và chỉ ra tác dụng đối với cảm xúc hoặc nội dung văn bản.','Kể lại toàn bộ văn bản.'],correct:1,explain:'Phân tích tác dụng cần làm rõ hình ảnh gợi điều gì và đóng góp ra sao cho nội dung hoặc cảm xúc, thay vì chỉ chép hay kể lại.'},
{type:'write',title:'Bài viết ngắn có tự kiểm tra',prompt:'Trong khoảng 6–8 câu, trình bày suy nghĩ về một hành động nhỏ thể hiện sự quan tâm đến người khác. Nêu ý kiến, giải thích, đưa ví dụ và rút ra điều em học được.',minWords:55,guide:'Viết theo cách em hiểu. Sau đó đọc lại: em đã trả lời đúng đề chưa, ví dụ có cụ thể không, đã giải thích ví dụ chưa, các câu có liên kết không?',rubric:['Đúng vấn đề','Có lý lẽ và ví dụ','Có phân tích ví dụ','Diễn đạt rõ ràng và kết thúc phù hợp'],model:'Một hành động nhỏ cũng có thể thể hiện sự quan tâm đến người khác. Đôi khi, chỉ cần chủ động hỏi thăm một người đang buồn hoặc giúp bạn hiểu một bài học khó cũng khiến họ cảm thấy được chia sẻ. Bởi lẽ, sự quan tâm không nhất thiết phải thể hiện bằng những việc lớn mà nằm ở khả năng nhận ra nhu cầu của người khác. Chẳng hạn, khi thấy bạn chưa hiểu bài, em có thể giải thích phần mình biết thay vì chê trách bạn. Hành động ấy vừa giúp bạn học tốt hơn vừa tạo nên sự tin tưởng giữa hai người. Qua đó, em hiểu rằng sự tử tế cần được thể hiện bằng những việc làm cụ thể hằng ngày.'}
]}
];
const phases=[{n:1,title:'Lấy lại gốc Ngữ văn',desc:'Đọc hiểu, tìm ý chính và suy luận có căn cứ',icon:'🌱'},{n:2,title:'Xây dựng kỹ năng viết',desc:'Câu rõ nghĩa, đoạn văn mạch lạc, biết phát triển ý',icon:'✍️'},{n:3,title:'Nghị luận xã hội',desc:'Luận điểm, lý lẽ, dẫn chứng và lập luận',icon:'💬'},{n:4,title:'Nghị luận văn học',desc:'Đọc chi tiết, phân tích dẫn chứng và ý nghĩa',icon:'📚'},{n:5,title:'Luyện thi vào lớp 10',desc:'Bài viết hoàn chỉnh, luyện đề và chữa lỗi',icon:'🎯'}];
const defaultState={answers:{},progress:{},attempts:{},submissions:[],examHistory:[],examSession:null,profile:null,role:'student',screen:'home',lessonId:null,step:0,mode:'demo',settings:{}};
let state=loadState();let toastTimer;let authMsg='';
function normalName(name){return String(name||'').trim().replace(/\s+/g,' ').toLocaleLowerCase('vi-VN')}
function localKey(name){return LOCAL_PREFIX+encodeURIComponent(normalName(name))}
function ensureStudentId(){if(state.profile){if(!state.profile.student_id)state.profile.student_id=(crypto.randomUUID?crypto.randomUUID():('vm-'+Date.now()+'-'+Math.random().toString(36).slice(2)));return state.profile.student_id}return ''}
function loadState(){let s;try{s={...structuredClone(defaultState),...JSON.parse(localStorage.getItem(APP_KEY)||'{}')}}catch{s=structuredClone(defaultState)};if(s.profile&&s.profile.display_name){try{const named=JSON.parse(localStorage.getItem(localKey(s.profile.display_name))||'null');if(named)s={...structuredClone(defaultState),...named}}catch{}};return s}
function persist(){try{const snapshot=JSON.stringify(state);localStorage.setItem(APP_KEY,snapshot);if(state.profile?.display_name&&state.role!=='admin')localStorage.setItem(localKey(state.profile.display_name),snapshot)}catch(e){console.warn('Không thể lưu tiến độ trong trình duyệt',e)}if(!cloudLoading&&state.profile?.display_name&&state.role!=='admin'&&CONFIG.syncEndpoint)scheduleCloudSave()}
function savedLocalLearners(){const out=[];try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(!k||!k.startsWith(LOCAL_PREFIX))continue;try{const s=JSON.parse(localStorage.getItem(k)||'{}');if(s.profile?.display_name)out.push(s)}catch{}}}catch{}return out}
function scheduleCloudSave(){clearTimeout(cloudTimer);cloudTimer=setTimeout(()=>cloudRequest({action:'save',id:ensureStudentId(),name:userName(),payload:cloudPayload()}).then(()=>{const el=document.getElementById('saveStatus');if(el)el.textContent='Đã gửi yêu cầu lưu lên Google Sheets; cần kiểm tra bảng tính để xác nhận'}).catch(()=>{const el=document.getElementById('saveStatus');if(el)el.textContent='Đã lưu trên thiết bị; gửi lên Google Sheets chưa thành công'}),650)}
function cloudPayload(){return {answers:state.answers,progress:state.progress,submissions:state.submissions,examHistory:state.examHistory||[],screen:'home',lessonId:state.lessonId,step:state.step}}
function cloudRequest(body){if(!CONFIG.syncEndpoint) return Promise.reject(new Error('Chưa cấu hình lưu trực tuyến'));if(body.action==='save'){return fetch(CONFIG.syncEndpoint,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)}).then(()=>({ok:true,queued:true}));}if(body.action==='list')return new Promise((resolve,reject)=>{const callback='__vanMinhList_'+Date.now()+'_'+Math.random().toString(36).slice(2);const script=document.createElement('script');const timer=setTimeout(()=>{cleanup();reject(new Error('Quá thời gian tải dữ liệu. Hãy thử làm mới và kiểm tra mã theo dõi.'))},15000);function cleanup(){clearTimeout(timer);delete window[callback];script.remove()}window[callback]=data=>{cleanup();if(!data||data.ok!==true)reject(new Error(data?.error||'Không tải được dữ liệu phụ huynh.'));else resolve(data)};script.onerror=()=>{cleanup();reject(new Error('Không kết nối được Google Sheets. Kiểm tra URL Web app và quyền truy cập.'))};script.src=CONFIG.syncEndpoint+(CONFIG.syncEndpoint.includes('?')?'&':'?')+'action=list&pin='+encodeURIComponent(body.pin||'')+'&callback='+encodeURIComponent(callback)+'&_='+Date.now();document.head.appendChild(script)});return Promise.reject(new Error('Yêu cầu không được hỗ trợ.'))}
function activateStudent(name){name=String(name||'').trim().replace(/\s+/g,' ');if(name.length<2){authMsg='Hãy nhập tên có ít nhất 2 ký tự.';render();return}if(state.profile?.display_name)persist();let next=null;try{next=JSON.parse(localStorage.getItem(localKey(name))||'null')}catch{};state={...structuredClone(defaultState),...(next||{}),profile:{...(next?.profile||{}),display_name:name,student_id:next?.profile?.student_id||''},role:'student',mode:'demo',screen:'home'};ensureStudentId();parentResults=null;persist();render()}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function words(s){return (s.trim().match(/\S+/g)||[]).length}
function showToast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.remove('hide');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.add('hide'),3500)}
function pct(x,y){return y?Math.round(x/y*100):0}
function getProg(id){return state.progress[id]||{step:0,started:false,completed:false,score:0,total:0,best:0,attempts:0,updated:null}}
function userName(){return state.profile?.display_name||state.profile?.email?.split('@')[0]||(state.role==='admin'?'Người theo dõi':'Người học')}
function admin(){return state.role==='admin'}
function getAllStudents(){return state.mode==='demo'?[{id:'demo-student',display_name:'Em học sinh (dữ liệu mẫu)',email:'hoc.sinh@example.com',role:'student'}]:[]}
function avgScore(prog){const p=Object.values(prog);const a=p.filter(x=>x.total);return a.length?Math.round(a.reduce((s,x)=>s+(x.score/x.total*100),0)/a.length):0}
function allProgress(){return lessons.map(l=>({lesson:l,prog:getProg(l.id)}))}
function header(){return `<header class="topbar"><div class="brand"><div class="logo">文</div><span>Văn Mình</span></div><div class="top-actions"><span class="pill">${CONFIG.syncEndpoint?'☁ Lưu trực tuyến':'◉ Lưu tự động'}</span>${state.profile?`<span class="app-mode-label">${esc(userName())}</span><button class="btn ghost small" id="changeNameBtn">Đổi tên</button>`:''}</div></header>`}
function nav(){return `<aside class="sidebar"><div class="who"><small>Khu vực học tập</small><strong>${esc(userName())}</strong></div><button class="nav-btn ${state.screen==='home'?'active':''}" data-screen="home"><span class="ico">⌂</span>Tổng quan</button><button class="nav-btn ${state.screen==='curriculum'?'active':''}" data-screen="curriculum"><span class="ico">▤</span>Lộ trình học</button><button class="nav-btn ${state.screen==='progress'?'active':''}" data-screen="progress"><span class="ico">◷</span>Kết quả học tập</button><button class="nav-btn ${state.screen==='settings'?'active':''}" data-screen="settings"><span class="ico">⚙</span>Lưu tiến độ & hướng dẫn</button><div class="sidebar-note">Học từng bước nhỏ. Mỗi lần làm bài là một cơ hội tiến bộ.<div style="margin-top:12px"><a href="?mode=parent" style="color:inherit;font-weight:750">Dành cho người theo dõi →</a></div></div></aside>`}
function pageTop(eyebrow,title,desc=''){return `<div class="eyebrow">${esc(eyebrow)}</div><h1 class="page-title">${esc(title)}</h1>${desc?`<p class="lead">${esc(desc)}</p>`:''}`}
function lessonUnlocked(l){const i=lessons.findIndex(x=>x.id===l.id);return i===0||lessons.slice(0,i).every(x=>getProg(x.id).completed)}
function lessonCard(l){const p=getProg(l.id),unlocked=lessonUnlocked(l);const prog=p.completed?100:p.started?pct(Math.min(p.step+1,l.steps.length),l.steps.length):0;return `<article class="card lesson-card ${unlocked?'':'locked-card'}"><div class="lesson-top"><div class="lesson-icon">${unlocked?l.icon:'🔒'}</div><span class="tag ${p.completed?'done':p.started?'warm':''}">${p.completed?'Đã hoàn thành':!unlocked?'Chưa mở khóa':p.started?'Đang học':`Giai đoạn ${l.phase}`}</span></div><div><h3>${esc(l.title)}</h3><p>${esc(l.subtitle)}</p></div><div class="lesson-meta"><span>${esc(l.duration)}</span><span>${unlocked?prog:0}%</span></div><div class="progress-line"><span style="width:${unlocked?prog:0}%"></span></div>${unlocked?`<button class="btn ${p.completed?'ghost':''}" data-open-lesson="${l.id}">${p.completed?'Ôn tập lại':p.started?'Tiếp tục học':'Bắt đầu học'} <span>→</span></button>`:`<button class="btn ghost" disabled title="Hoàn thành bài trước để mở khóa">🔒 Hoàn thành bài trước</button>`}</article>`}
function renderHome(){const completed=lessons.filter(l=>getProg(l.id).completed).length;const stepsDone=lessons.reduce((s,l)=>s+(getProg(l.id).started?Math.min(getProg(l.id).step+1,l.steps.length):0),0);const stepsTotal=lessons.reduce((s,l)=>s+l.steps.length,0);const pscore=avgScore(state.progress);const next=lessons.find(l=>!getProg(l.id).completed)||lessons[0];return `${`<section class="hero"><div><div class="eyebrow" style="color:#b8d4c1">LỘ TRÌNH NGỮ VĂN CỦA BẠN</div><h1>Viết tốt hơn,<br>từng bước một.</h1><p>Không cần biết viết hay ngay từ đầu. Hãy học cách tìm ý, lập luận, dùng dẫn chứng và diễn đạt rõ ràng qua từng nhiệm vụ nhỏ.</p><button class="btn light" data-open-lesson="${next.id}">${getProg(next.id).step?'Tiếp tục bài đang học':'Bắt đầu bài học đầu tiên'} <span>→</span></button></div><div class="hero-mark">文</div></section>`}<div class="stats"><div class="stat"><div class="s-label">Bài đã hoàn thành</div><div class="s-num">${completed}<span style="font-size:14px;color:#89948c"> / ${lessons.length}</span></div><div class="s-note">Theo tiến độ cá nhân</div></div><div class="stat"><div class="s-label">Bước học đã đi qua</div><div class="s-num">${stepsDone}</div><div class="s-note">Trong ${stepsTotal} bước</div></div><div class="stat"><div class="s-label">Điểm trung bình bài trắc nghiệm</div><div class="s-num">${pscore}%</div><div class="s-note">Chưa tính bài viết tự luận</div></div><div class="stat"><div class="s-label">Trạng thái lưu</div><div class="s-num" style="font-size:20px;margin:8px 0"><span class="badge-dot"></span>${CONFIG.syncEndpoint?'Trực tuyến':'Trên thiết bị này'}</div><div class="s-note">${CONFIG.syncEndpoint?'Đã bật đồng bộ':'Tiến độ được lưu tự động'}</div></div></div><div class="section-head"><div><h2>Tiếp tục học</h2><p>Học lý thuyết ngắn, thực hành và nhận phản hồi ngay.</p></div><button class="btn ghost small" data-screen="curriculum">Xem toàn bộ lộ trình →</button></div><div class="cards">${lessonCard(next)}</div><div class="callout"><strong>Nhắc nhỏ:</strong> Văn học không chỉ có “năng khiếu”. Em có thể rèn kỹ năng quan sát, tìm bằng chứng, giải thích và viết rõ ý bằng phương pháp.</div>`}
function renderCurriculum(){const next=lessons.find(l=>!getProg(l.id).completed)||lessons[0];return `${pageTop('BẢN ĐỒ HỌC TẬP','Lộ trình từ nền tảng đến luyện thi','Học tuần tự: hoàn thành bài hiện tại để tự động mở khóa bài tiếp theo. Các bài phía sau sẽ bị khóa để tránh học nhảy cóc.')}<div class="callout"><strong>Bài đang mở:</strong> ${esc(next.title)}. ${lessons.filter(l=>getProg(l.id).completed).length} / ${lessons.length} bài đã hoàn thành. Khi nhấn “Hoàn thành bài”, bài tiếp theo sẽ tự mở khóa.</div>${phases.map(p=>`<div class="section-head"><div><h2>${p.icon} Giai đoạn ${p.n}. ${esc(p.title)}</h2><p>${esc(p.desc)}</p></div></div><div class="cards">${lessons.filter(l=>l.phase===p.n).map(lessonCard).join('')||`<div class="card"><p class="small-muted">Các bài học nâng cao của giai đoạn này sẽ được mở rộng theo lớp và địa phương dự thi.</p></div>`}</div>`).join('')}<div class="callout"><strong>Quy tắc mở khóa:</strong> Chỉ bài đầu tiên được mở lúc bắt đầu. Hoàn thành đầy đủ các bước của bài hiện tại để tự động mở bài kế tiếp. Bài đã hoàn thành vẫn có thể ôn tập lại.<br><br>Chương trình hiện là bản nền tảng mẫu. Khi xác định lớp hiện tại và tỉnh/thành dự thi, nội dung ôn thi sẽ được điều chỉnh theo chương trình và cấu trúc đề tương ứng.</div>`}
function renderProgress(){const rows=lessons.map(l=>{const p=getProg(l.id);return `<tr><td><strong>${esc(l.title)}</strong><div class="small-muted">${esc(l.skill)}</div></td><td>${p.completed?'Hoàn thành':p.started?`Bước ${Math.min(p.step+1,l.steps.length)}/${l.steps.length}`:'Chưa bắt đầu'}</td><td>${p.total?`${p.score}/${p.total}`:'—'}</td><td>${p.best?`${p.best}/${p.total}`:'—'}</td><td>${p.updated?new Date(p.updated).toLocaleString('vi-VN'):'—'}</td></tr>`}).join('');const subs=state.submissions.slice().reverse().slice(0,20);return `${pageTop('LỊCH SỬ HỌC','Kết quả của tôi','Mỗi câu trả lời, bài đã nộp và tiến độ từng bài sẽ được ghi nhận.')}<div class="stats"><div class="stat"><div class="s-label">Bài hoàn thành</div><div class="s-num">${lessons.filter(l=>getProg(l.id).completed).length}</div></div><div class="stat"><div class="s-label">Bài đã bắt đầu</div><div class="s-num">${lessons.filter(l=>getProg(l.id).started).length}</div></div><div class="stat"><div class="s-label">Bài tự luận đã nộp</div><div class="s-num">${state.submissions.length}</div></div><div class="stat"><div class="s-label">Điểm trắc nghiệm trung bình</div><div class="s-num">${avgScore(state.progress)}%</div></div></div><div class="section-head"><div><h2>Tiến độ theo bài</h2><p>Thời điểm được lưu gần nhất theo từng bài.</p></div><button class="btn ghost small" id="exportBtn">Xuất kết quả JSON</button></div><div class="table-wrap"><table class="data-table"><thead><tr><th>Bài học / kỹ năng</th><th>Trạng thái</th><th>Điểm lần gần nhất</th><th>Điểm tốt nhất</th><th>Cập nhật</th></tr></thead><tbody>${rows}</tbody></table></div><div class="section-head"><div><h2>Lịch sử bài viết</h2><p>Lưu nguyên văn câu trả lời cùng đánh giá gợi ý và các ý còn thiếu.</p></div></div>${subs.length?`<div class="module-list">${subs.map(s=>`<details class="card"><summary style="cursor:pointer;font-weight:800">${esc(s.lessonTitle||s.lessonId)} · ${esc(s.gradeLabel||'Đã nộp')} · ${esc(s.date||'')}</summary><p class="small-muted">CÂU TRẢ LỜI NGUYÊN VĂN (${words(s.answer)} từ)</p><p style="white-space:pre-wrap;font-size:13px;color:#3c4d41">${esc(s.answer)}</p>${s.score!=null?`<p><strong>Điểm gợi ý: ${s.score}/100 — ${esc(s.gradeLabel||'')}</strong></p>`:''}${s.matched?.length?`<p><strong>Ý đã nhận diện:</strong> ${esc(s.matched.join('; '))}</p>`:''}${s.missing?.length?`<p><strong>Ý nên bổ sung:</strong> ${esc(s.missing.join('; '))}</p>`:''}${s.feedback?`<div class="feedback">${esc(s.feedback)}</div>`:''}</details>`).join('')}</div>`:`<div class="card empty">Chưa có bài tự luận nào được nộp. Sau khi hoàn thành phần viết trong bài học, nội dung sẽ xuất hiện ở đây.</div>`}<div class="section-head"><div><h2>Lịch sử ôn thi có tính giờ</h2><p>Điểm tổng hợp trên thang 10, thời lượng và trạng thái nộp bài.</p></div></div>${(state.examHistory||[]).length?`<div class="table-wrap"><table class="data-table"><thead><tr><th>Lần thi</th><th>Điểm</th><th>Thời gian</th><th>Kết quả</th></tr></thead><tbody>${state.examHistory.slice().reverse().map(e=>`<tr><td>${esc(e.date||'')}</td><td>${esc(String(e.finalScore??'—'))}/10</td><td>${Math.round((e.durationSeconds||0)/60)} phút</td><td>${e.expired?'Hết giờ':'Đã nộp'}</td></tr>`).join('')}</tbody></table></div>`:`<div class="card empty">Chưa có lượt luyện thi tính giờ nào.</div>`}`}
function renderMonitor(){const students=parentResults?.students||savedLocalLearners().map(x=>({learner_name:x.profile.display_name,payload:cloudPayloadFrom(x),updated_at:x.progress?Object.values(x.progress).reduce((m,p)=>Math.max(m,Date.parse(p.updated||0)||0),0):0}));const cloudMessage=CONFIG.syncEndpoint?'Dữ liệu tổng hợp từ máy chủ trực tuyến.':'Đang xem dữ liệu được lưu trên trình duyệt hiện tại; để xem bài làm từ điện thoại hoặc thiết bị khác, hãy cấu hình đồng bộ trực tuyến.';return `${pageTop('BẢNG THEO DÕI','Kết quả người học','Theo dõi tiến độ, điểm luyện tập và bài viết đã nộp.')}<div class="callout">${esc(cloudMessage)}</div>${students.length?students.map(st=>{const p=st.payload||{},progs=p.progress||{},subs=p.submissions||[],completed=lessons.filter(l=>progs[l.id]?.completed).length,total=lessons.length;return `<section class="card" style="margin-bottom:14px"><div class="section-head" style="margin-top:0"><div><h2>${esc(st.learner_name||'Người học')}</h2><p>Cập nhật: ${st.updated_at?new Date(st.updated_at).toLocaleString('vi-VN'):'chưa có thời điểm đồng bộ'}</p></div><span class="tag">${completed}/${total} bài hoàn thành</span></div><div class="stats"><div class="stat"><div class="s-label">Bài bắt đầu</div><div class="s-num">${lessons.filter(l=>progs[l.id]?.started).length}</div></div><div class="stat"><div class="s-label">Bài hoàn thành</div><div class="s-num">${completed}</div></div><div class="stat"><div class="s-label">Bài viết đã nộp</div><div class="s-num">${subs.length}</div></div><div class="stat"><div class="s-label">Điểm trắc nghiệm TB</div><div class="s-num">${avgScore(progs)}%</div></div></div><div class="table-wrap" style="margin-top:14px"><table class="data-table"><thead><tr><th>Bài học</th><th>Trạng thái</th><th>Điểm</th><th>Cập nhật</th></tr></thead><tbody>${lessons.map(l=>{const x=progs[l.id]||{};return `<tr><td>${esc(l.title)}</td><td>${x.completed?'Hoàn thành':x.started?`Bước ${(x.step||0)+1}/${l.steps.length}`:'Chưa bắt đầu'}</td><td>${x.total?`${x.score||0}/${x.total}`:'—'}</td><td>${x.updated?new Date(x.updated).toLocaleString('vi-VN'):'—'}</td></tr>`}).join('')}</tbody></table></div>${subs.length?`<div class="section-head"><div><h2>Bài viết đã nộp</h2><p>Hiển thị nguyên văn câu trả lời để phụ huynh xem lại.</p></div></div>${subs.slice().reverse().map(a=>`<details class="module-row" style="margin-top:8px;display:block"><summary style="cursor:pointer"><strong>${esc(a.lessonTitle||a.lessonId||'Bài viết')}</strong> · ${esc(a.gradeLabel|| (a.score!=null?('Điểm gợi ý '+a.score+'/100'):'Chưa chấm'))} · ${esc(a.date||'')}</summary><div style="margin-top:10px"><div class="small-muted">CÂU TRẢ LỜI NGUYÊN VĂN</div><p style="white-space:pre-wrap;margin-top:7px">${esc(a.answer||'')}</p>${a.matched?.length?`<p><strong>Ý chính đã nhận diện:</strong> ${esc(a.matched.join('; '))}</p>`:''}${a.missing?.length?`<p><strong>Ý cần bổ sung:</strong> ${esc(a.missing.join('; '))}</p>`:''}<p class="feedback">${esc(a.feedback||'')}</p></div></details>`).join('')}`:''}${(p.examHistory||[]).length?`<div class="section-head"><div><h2>Lịch sử luyện thi có tính giờ</h2></div></div><div class="module-list">${p.examHistory.slice().reverse().map(e=>`<div class="module-row"><div style="flex:1"><strong>${esc(e.title||'Bài luyện thi Ngữ văn')}</strong><p>Điểm: ${esc(String(e.finalScore??'—'))}/10 · ${Math.round((e.durationSeconds||0)/60)} phút · ${e.expired?'Hết giờ':'Hoàn thành'}</p></div><small>${esc(e.date||'')}</small></div>`).join('')}</div>`:''}</section>`}).join(''):`<div class="card empty">Chưa có dữ liệu để hiển thị. Người học cần mở link, nhập tên và bắt đầu làm bài. Nếu bạn đang sử dụng thiết bị khác, hãy bật đồng bộ trực tuyến trong hướng dẫn bên dưới.</div>`}<div class="lesson-actions"><button class="btn ghost" id="refreshParent">Làm mới dữ liệu</button><button class="btn ghost" id="exportParent">Xuất báo cáo JSON</button><a class="btn" href="./">Quay lại học</a></div>`}
function cloudPayloadFrom(s){return {answers:s.answers||{},progress:s.progress||{},submissions:s.submissions||[],examHistory:s.examHistory||[],screen:'home'}}
function renderParentGate(){return `<div class="auth-wrap"><section class="auth-card"><div class="logo">文</div><div class="eyebrow" style="margin-top:20px">VĂN MÌNH · KHU VỰC NGƯỜI THEO DÕI</div><h1>Theo dõi tiến độ học</h1><p>Người học không cần tài khoản. Bạn có thể mở bảng này bằng link riêng và nhập mã theo dõi đã đặt trong cấu hình máy chủ.</p><div class="field"><label for="parentPin">Mã theo dõi</label><input id="parentPin" type="password" placeholder="Nhập mã theo dõi" autocomplete="current-password"></div><div id="parentMessage" class="notice">${CONFIG.syncEndpoint?'Bảng sẽ lấy kết quả đã đồng bộ từ thiết bị của người học.':'Chưa bật đồng bộ trực tuyến; dữ liệu chỉ có thể xem trên chính trình duyệt lưu bài.'}</div><button class="btn full" id="enterParent">Mở bảng theo dõi</button><button class="btn ghost full" style="margin-top:8px" id="showLocalParent">Xem dữ liệu trên thiết bị này</button><a class="btn ghost full" style="margin-top:8px;text-decoration:none" href="./">Quay lại trang học</a></section></div>`}
function renderSettings(){return `${pageTop('LƯU TIẾN ĐỘ','Tiến độ được lưu tự động','Không cần tài khoản. Người học nhập tên, làm bài và có thể quay lại bằng cùng tên.')}<div class="cards"><div class="card"><div class="lesson-icon">💾</div><h2 style="font-size:19px">Lưu trên trình duyệt</h2><p class="small-muted">Bản mặc định tự lưu câu trả lời và tiến độ trên chính trình duyệt, kể cả khi đóng trang. Dữ liệu cục bộ không tự chuyển sang thiết bị khác.</p><button class="btn ghost" id="changeNameFromSettings">Đổi tên người học</button><button class="btn ghost" id="exportBtn" style="margin-left:6px">Xuất kết quả JSON</button></div><div class="card"><div class="lesson-icon">☁️</div><h2 style="font-size:19px">Đồng bộ giữa thiết bị</h2><p class="small-muted">Muốn bạn theo dõi bài làm từ thiết bị khác, cần thiết lập một dịch vụ dữ liệu trực tuyến. Gói mã nguồn có thể dùng Google Sheets + Apps Script để đồng bộ kết quả từ điện thoại lên bảng theo dõi; người học không cần tài khoản riêng.</p><button class="btn ghost" id="showHowto">Xem hướng dẫn xuất bản</button></div></div><div class="callout"><strong>Đã lưu chưa?</strong> <span id="saveStatus">${CONFIG.syncEndpoint?'Đã cấu hình đồng bộ trực tuyến.':'Tiến độ hiện được lưu trên trình duyệt này.'}</span> Không xóa dữ liệu trang web/trình duyệt nếu chưa xuất hoặc đồng bộ kết quả.</div><div class="section-head"><div><h2>Muốn đổi người học?</h2><p>Mỗi tên có hồ sơ tiến độ riêng trên cùng một trình duyệt.</p></div></div><div class="card"><p>Người học nên dùng cùng một tên mỗi lần quay lại. Với chế độ chỉ nhập tên, tên không phải phương thức xác thực bảo mật; không nhập thông tin cá nhân nhạy cảm vào bài viết.</p><div class="lesson-actions"><button class="btn ghost" id="switchRole">Mở khu vực người theo dõi trên thiết bị này</button><button class="btn warning" id="resetDemo">Xóa kết quả trên thiết bị này</button></div></div>`}
function renderHowto(){return `${pageTop('XUẤT BẢN','Đưa Văn Mình lên GitHub Pages','Sau khi xuất bản, bạn gửi link HTTPS cho em trai qua Zalo; em mở trực tiếp trong trình duyệt, không cần tải ứng dụng.')}<div class="module-list"><div class="module-row"><div class="module-n">1</div><div><h4>Giữ nguyên file config.js đang hoạt động</h4><p>File này cần chứa Web app URL Google Apps Script của bạn. Khi cập nhật index.html, không thay config.js bằng bản mẫu rỗng.</p></div></div><div class="module-row"><div class="module-n">2</div><div><h4>Kết nối Google Sheets</h4><p>Tạo bảng tính theo dõi, mở Extensions → Apps Script và dùng file Code.gs trong gói cập nhật. Chạy Deploy → Manage deployments → Edit → New version → Deploy.</p></div></div><div class="module-row"><div class="module-n">3</div><div><h4>Đặt mã theo dõi phụ huynh</h4><p>Trong Apps Script, mở Project Settings → Script Properties và đặt VANMINH_PARENT_PIN. Không đặt mã PIN trong mã nguồn website và không gửi mã này vào cuộc trò chuyện.</p></div></div><div class="module-row"><div class="module-n">4</div><div><h4>Cập nhật index.html trên GitHub</h4><p>Thay file index.html cũ bằng bản mới, commit changes. Giữ nguyên config.js và không xoá các file cấu hình cần thiết.</p></div></div><div class="module-row"><div class="module-n">5</div><div><h4>Gửi link cho người học</h4><p>Em mở link qua Zalo, nhập cùng tên hồ sơ và học như bình thường. Khi đồng bộ đã được kết nối, tiến độ và bài tự luận sẽ được gửi lên Google Sheets.</p></div></div></div><div class="callout"><strong>Lưu ý:</strong> Google Sheets/Apps Script là dịch vụ lưu dữ liệu trực tuyến, không phải kho lưu trữ tuyệt đối riêng tư. Dùng mã theo dõi riêng, không dùng mật khẩu tài khoản; tránh đưa thông tin nhạy cảm vào câu trả lời. Câu trả lời tự luận được giữ nguyên văn để phụ huynh xem lại.</div><button class="btn" data-screen="home">Quay lại tổng quan</button>`}
function renderLesson(){const l=lessons.find(x=>x.id===state.lessonId);if(!l)return renderHome();if(l.id==='exam-practice'&&state.examSession?.finished)return renderExamResult(l);const step=Math.min(state.step,l.steps.length-1);const s=l.steps[step];const ans=state.answers[`${l.id}:${step}`]||{};const timer=l.id==='exam-practice'?`<div class="exam-clock"><div><strong>⏱ Bài luyện thi đang tính giờ</strong><div class="small-muted">30 phút · hết giờ sẽ tự lưu câu trả lời và kết thúc lượt thi</div></div><strong id="examTimer">${formatCountdown(state.examSession?.deadline||Date.now()+1800000)}</strong></div>`:'';return `<div class="lesson-body"><div class="detail-head"><button class="back" id="backLesson">← Quay lại</button><div style="flex:1"><div class="eyebrow">GIAI ĐOẠN ${l.phase} · ${esc(l.skill)}</div><h1 class="page-title" style="font-size:26px;margin-bottom:4px">${esc(l.title)}</h1><p class="small-muted">${esc(l.subtitle)}</p></div></div>${timer}<div class="step-count"><span>Bước ${step+1} / ${l.steps.length}</span><span>${pct(step+1,l.steps.length)}%</span></div><div class="stepbar"><span style="width:${pct(step+1,l.steps.length)}%"></span></div><section class="lesson-panel"><div class="eyebrow">${s.type==='learn'?'KIẾN THỨC CỐT LÕI':s.type==='quiz'?'CÂU HỎI TƯƠNG TÁC':s.type==='order'?'SẮP XẾP Ý':'THỰC HÀNH VIẾT'}</div><h2>${esc(s.title)}</h2>${s.type==='learn'?renderLearn(s):s.type==='quiz'?renderQuiz(l,step,s,ans):s.type==='order'?renderOrder(l,step,s,ans):renderWrite(l,step,s,ans)}<div class="lesson-actions"><button class="btn ghost" id="prevStep" ${step===0?'disabled':''}>← Bước trước</button>${step<l.steps.length-1?`<button class="btn" id="nextStep" ${!canContinue(l,step,s,ans)?'disabled':''}>Bước tiếp theo →</button>`:`<button class="btn" id="finishLesson" ${!canContinue(l,step,s,ans)?'disabled':''}>Hoàn thành bài ✓</button>`}</div><p class="small-muted" style="margin-top:14px"><span id="saveStatus">${CONFIG.syncEndpoint?'Tiến độ sẽ tự động đồng bộ sau mỗi thao tác.':'Tiến độ tự lưu trên trình duyệt này.'}</span></p></section></div>`}
function renderExamResult(l){const e=state.examSession||{};return `<div class="lesson-body"><section class="lesson-panel"><div class="eyebrow">KẾT QUẢ LUYỆN THI</div><h1 class="page-title">${e.expired?'Đã hết giờ':'Em đã hoàn thành lượt thi'}</h1><p>${esc(l.title)}</p><div class="stats"><div class="stat"><div class="s-label">Điểm tổng hợp</div><div class="s-num">${e.finalScore??0}<span style="font-size:14px">/10</span></div></div><div class="stat"><div class="s-label">Thời gian làm</div><div class="s-num">${Math.round((e.durationSeconds||0)/60)}<span style="font-size:14px"> phút</span></div></div><div class="stat"><div class="s-label">Điểm trắc nghiệm</div><div class="s-num">${e.quizPoints??0}<span style="font-size:14px">/3</span></div></div><div class="stat"><div class="s-label">Điểm tự luận</div><div class="s-num">${e.writingScore??0}<span style="font-size:14px">/100</span></div></div></div><div class="callout">${e.expired?'Hết giờ: câu trả lời tự luận đang nhập đã được lưu nếu có nội dung. Hãy xem lại phần chưa hoàn thành và thử lại khi đã ôn tập.':'Lượt thi đã được lưu vào lịch sử. Điểm tự luận là điểm gợi ý theo các ý chính được nhận diện tự động, không thay thế người chấm.'}</div><div class="lesson-actions"><button class="btn" id="retakeExamBtn">Làm lại bài luyện thi</button><button class="btn ghost" data-screen="progress">Xem lịch sử kết quả</button><button class="btn ghost" data-screen="home">Về trang chủ</button></div></section></div>`}
function renderLearn(s){return `<p>${esc(s.body)}</p><div class="theory"><h3>Ghi nhớ</h3><ul>${s.bullets.map(b=>`<li>${esc(b)}</li>`).join('')}</ul></div><div class="example"><strong>Ví dụ:</strong> ${esc(s.example)}</div><div class="notice">Trước khi sang bước tiếp theo, hãy thử tự nói lại một ý quan trọng bằng lời của mình.</div>`}
function renderQuiz(l,step,s,a){return `<p>${esc(s.question)}</p><div class="notice">Chọn đáp án rồi đọc phản hồi. Nếu sai, em phải bấm “Thử lại” sau khi xem giải thích; mỗi lần sai làm giảm điểm của câu này 0,25 điểm.</div><div class="choice-list">${s.options.map((o,i)=>`<button class="choice ${a.selected===i?'selected':''} ${a.checked&&i===s.correct?'correct':''} ${a.checked&&a.selected===i&&i!==s.correct?'incorrect':''}" data-choice="${i}" ${a.checked?'disabled':''}><span class="letter">${String.fromCharCode(65+i)}</span><span>${esc(o)}</span></button>`).join('')}</div>${a.checked?`<div class="feedback ${a.correct?'':'bad'}"><strong>${a.correct?'Chính xác!':`Chưa đúng — đây là lần sai thứ ${a.wrongAttempts||1}.`}</strong><div style="margin-top:5px">${esc(s.explain)}</div>${a.correct?`<p><strong>Điểm nhận được cho câu này: ${Number(a.points||0).toFixed(2)}/1</strong></p>`:`<p>Chưa thể qua câu tiếp theo. Đọc lời giải rồi thử lại; điểm sẽ giảm theo số lần sai.</p><button class="btn ghost small" style="margin-top:10px" id="retryQuiz">Đã xem giải thích — thử lại</button>`}</div>`:''}`}
function renderOrder(l,step,s,a){const chosen=a.order||s.items.map(x=>x.id);return `<p>${esc(s.question)}</p><div class="notice">Hãy sắp xếp rồi kiểm tra. Nếu sai, phải xem giải thích và bấm thử lại; mỗi lần sai làm giảm điểm của câu này 0,25 điểm.</div><div class="module-list">${chosen.map((id,i)=>{const item=s.items.find(x=>x.id===id);return `<div class="module-row"><div class="module-n">${i+1}</div><div style="flex:1"><p style="color:#3e4f44">${esc(item?.text||'')}</p></div><button class="btn ghost small" data-move="${id}" data-dir="-1" ${i===0||a.checked?'disabled':''}>↑</button><button class="btn ghost small" data-move="${id}" data-dir="1" ${i===chosen.length-1||a.checked?'disabled':''}>↓</button></div>`}).join('')}</div>${a.checked?`<div class="feedback ${a.correct?'':'bad'}"><strong>${a.correct?'Đúng trình tự!':`Chưa đúng — đây là lần sai thứ ${a.wrongAttempts||1}.`}</strong><div>${esc(s.explain)}</div>${a.correct?`<p>Điểm nhận được cho câu này: ${Number(a.points||0).toFixed(2)}/1</p>`:`<button class="btn ghost small" style="margin-top:10px" id="retryQuiz">Đã xem giải thích — thử lại</button>`}</div>`:''}<div style="margin-top:12px"><button class="btn ghost" id="checkOrder" ${a.checked?'disabled':''}>Kiểm tra thứ tự</button></div>`}
function renderWrite(l,step,s,a){const val=a.text||'',g=a.grade||null;return `<p>${esc(s.prompt)}</p><div class="notice">Hệ thống đối chiếu các ý chính và cách diễn đạt tương đương, không yêu cầu chép nguyên văn đáp án mẫu. Điểm tự động là gợi ý theo bộ tiêu chí của bài; nếu cách diễn đạt quá mới, phụ huynh vẫn nên xem nguyên văn.</div><div class="field"><label for="writingAnswer">Câu trả lời của em · tối thiểu gợi ý ${s.minWords} từ</label><textarea id="writingAnswer" placeholder="Hãy viết bằng lời của em. Sai sót là một phần của quá trình học…">${esc(val)}</textarea></div><div class="lesson-meta"><span id="wordCounter">${words(val)} từ</span><span>Rõ ý và có căn cứ quan trọng hơn viết giống văn mẫu.</span></div><div class="theory"><h3>Gợi ý nếu em bí ý</h3><p style="margin:0;font-size:13px">${esc(s.guide)}</p></div><div class="lesson-actions" style="justify-content:flex-start"><button class="btn" id="submitWriting">Lưu và nhận phản hồi</button><button class="btn ghost" id="saveDraft">Lưu bản nháp</button></div>${a.submitted?`<div class="feedback ${g&&g.score<50?'bad':''}"><strong>Đánh giá gợi ý: ${g?`${g.score}/100 · ${esc(g.label)}`:'Đã lưu bài viết'}</strong><div style="margin-top:5px">${esc(a.feedback||'Bài đã được lưu. Hãy xem tiêu chí bên dưới và thử chỉnh sửa để tiến bộ hơn.')}</div>${g?.matched?.length?`<p><strong>Ý chính đã nhận diện:</strong> ${esc(g.matched.join('; '))}</p>`:''}${g?.missing?.length?`<p><strong>Ý nên bổ sung:</strong> ${esc(g.missing.join('; '))}</p>`:''}<div style="margin-top:9px"><strong>Tiêu chí của bài</strong><ul style="margin:5px 0;padding-left:18px">${s.rubric.map(r=>`<li>${esc(r)}</li>`).join('')}</ul></div><details style="margin-top:9px"><summary style="cursor:pointer;font-weight:750">Xem đoạn tham khảo (không nên chép nguyên văn)</summary><p style="white-space:pre-wrap">${esc(s.model)}</p></details><button class="btn ghost small" style="margin-top:10px" id="editWriting">Sửa và nộp lại</button></div>`:''}`}
function canContinue(l,step,s,a){if(l.id==='exam-practice'&&state.examSession?.finished)return false;if(s.type==='learn')return true;if(s.type==='quiz')return a.checked&&a.selected===s.correct;if(s.type==='order')return a.checked&&a.correct;if(s.type==='write')return a.submitted&&words(a.text||'')>=Math.min(6,s.minWords);return false}
function renderAuth(){return `<div class="auth-wrap"><section class="auth-card"><div class="logo">文</div><div class="eyebrow" style="margin-top:20px">VĂN MÌNH · HỌC NGỮ VĂN TỪNG BƯỚC</div><h1>Bắt đầu học nhé!</h1><p>Chỉ cần nhập tên. Không cần email, mật khẩu hay tạo tài khoản. Tiến độ sẽ được tự lưu theo tên trên trình duyệt này.</p>${authMsg?`<div class="notice error">${esc(authMsg)}</div>`:''}<form id="studentNameForm"><div class="field"><label for="studentName">Tên người học</label><input id="studentName" name="studentName" autocomplete="name" required minlength="2" maxlength="60" placeholder="Ví dụ: Minh Anh"></div><button class="btn full" type="submit">Vào học ngay →</button></form><div class="notice">Khi quay lại trên cùng trình duyệt, hãy nhập đúng tên đã dùng để tiếp tục tiến độ cũ. Để theo dõi kết quả từ thiết bị khác, người quản lý cần bật đồng bộ trực tuyến.</div><a href="?mode=parent" style="display:block;text-align:center;margin-top:13px;color:#52665a;font-weight:750;font-size:13px">Tôi là người theo dõi</a></section></div>`}
function render(){if(state.screen==='auth'){document.getElementById('app').innerHTML=header()+renderAuth();wire();return}if(state.screen==='monitor-gate'){document.getElementById('app').innerHTML=header()+renderParentGate();wire();return}const content=state.screen==='home'?renderHome():state.screen==='curriculum'?renderCurriculum():state.screen==='progress'?renderProgress():state.screen==='monitor'?renderMonitor():state.screen==='settings'?renderSettings():state.screen==='howto'?renderHowto():state.screen==='lesson'?renderLesson():renderHome();document.getElementById('app').innerHTML=header()+`<div class="app-grid">${nav()}<main>${content}<footer class="foot"><span>Văn Mình · Học từng bước nhỏ, tiến bộ từng ngày.</span><span id="saveStatus">${CONFIG.syncEndpoint?'Đồng bộ trực tuyến':'Tự lưu trên trình duyệt này'}</span></footer></main></div>`;wire()}
function setScreen(screen){state.screen=screen;persist();render()}
function startExamAttempt(){const lesson=lessons.find(x=>x.id==='exam-practice');lesson.steps.forEach((_,i)=>delete state.answers[`${lesson.id}:${i}`]);const old=getProg(lesson.id);state.progress[lesson.id]={...old,step:0,started:true,completed:false,score:0,total:0,correctCount:0,updated:new Date().toISOString()};state.examSession={id:'exam-'+Date.now(),lessonId:lesson.id,startedAt:Date.now(),deadline:Date.now()+30*60*1000,finished:false}}

function gradeWriting(text,s,lessonId){const clean=normalizeMeaning(text);const rules=conceptRules(lessonId);const matched=[],missing=[];for(const rule of rules){if(rule.terms.some(term=>conceptTermMatches(clean,term)))matched.push(rule.label);else missing.push(rule.label)}const coverage=Math.round(matched.length/rules.length*100);const length=words(text);let score=coverage;if(length<s.minWords)score=Math.max(0,score-Math.min(20,Math.ceil((s.minWords-length)/Math.max(1,s.minWords)*20)));const label=score>=75?'Đạt phần lớn ý chính':score>=50?'Đạt một phần — nên bổ sung ý':'Chưa thể hiện rõ các ý chính';const notes=[];if(length>=s.minWords)notes.push(`Độ dài ${length} từ đạt mức gợi ý.`);else notes.push(`Bài có ${length} từ, ngắn hơn mức gợi ý ${s.minWords} từ.`);if(matched.length)notes.push('Hệ thống nhận diện được: '+matched.join('; ')+'.');if(missing.length)notes.push('Nên xem lại: '+missing.join('; ')+'.');notes.push('Điểm này dựa trên các cụm ý và cách diễn đạt tương đương đã cấu hình, chưa phải AI hiểu ngữ nghĩa hoàn chỉnh; phụ huynh có thể đọc nguyên văn để đánh giá những cách diễn đạt mới.');return {score,label,matched,missing,feedback:notes.join(' ')}}

async function finishQuiz(l,step,s,selected){const key=`${l.id}:${step}`,old=state.answers[key]||{};if(old.checked)return;const correct=selected===s.correct;const wrongAttempts=Number(old.wrongAttempts||0)+(correct?0:1);const points=correct?Math.max(0,1-(Number(old.wrongAttempts||0)*0.25)):0;state.answers[key]={...old,selected,checked:true,correct,wrongAttempts,points};const p=getProg(l.id);p.attempts=(p.attempts||0)+1;const scored=l.steps.map((st,i)=>({st,a:state.answers[`${l.id}:${i}`]})).filter(x=>(x.st.type==='quiz'||x.st.type==='order')&&x.a&&x.a.checked);p.total=scored.length;p.score=Math.round(scored.reduce((sum,x)=>sum+(Number(x.a.points)||0),0)*100)/100;p.correctCount=scored.filter(x=>!!x.a.correct).length;p.best=Math.max(p.best||0,p.score||0);p.updated=new Date().toISOString();state.progress[l.id]=p;persist();render()}
